<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&T HACCP — Audits (démo)</title><style>body{font:16px Arial;background:#f3f7f5;color:#173b30;margin:0}header{background:#07563f;color:white;padding:22px}main{max-width:850px;margin:auto;padding:20px}.card{background:white;border:1px solid #ccdcd2;border-radius:14px;padding:18px;margin:14px 0}button,select,input,textarea{font:inherit;padding:12px;border:1px solid #b8cbc0;border-radius:9px}button{background:#17654c;color:white;cursor:pointer}input,textarea,select{width:100%;box-sizing:border-box}textarea{min-height:70px}label{display:block;margin:12px 0 5px}small{color:#64756c}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{flex:1;background:#e3f0e9;padding:14px;border-radius:10px}#results{white-space:pre-wrap} @media(max-width:600px){main{padding:10px}header{padding:16px}}</style></head><body><header><strong>M&T HACCP — Audits HACCP</strong><div>Prototype indépendant • Données fictives • Aucun accès Firebase</div></header><main><div class="card"><label>Établissement<input id="site" value="Restaurant Démo — Cuisine principale"></label><label>Auditeur<input id="auditor" value="Responsable HACCP"></label><label>Date<input id="date" type="date" value="2026-10-13"></label></div><div class="stats"><div>Progression<br><b id="progress">0/10</b></div><div>Conformité<br><b id="score">—</b></div><div>Non-conformités<br><b id="nc">0</b></div></div><div id="questions"></div><div class="card"><button id="generate">Générer le rapport</button> <button id="print" type="button">Imprimer / PDF</button><pre id="results" style="white-space:pre-wrap;font:14px Arial"></pre></div></main><script>
const items=[["Hygiène du personnel","Tenue professionnelle propre et adaptée"],["Hygiène du personnel","Lavage des mains et dispositifs disponibles"],["Températures et stockage","Températures des enceintes frigorifiques conformes"],["Températures et stockage","Séparation des produits crus et cuits"],["Nettoyage et désinfection","Plan de nettoyage respecté"],["Nettoyage et désinfection","Produits de nettoyage stockés séparément"],["Traçabilité et DLC","Produits correctement étiquetés"],["Traçabilité et DLC","Absence de produits périmés"],["Locaux et nuisibles","Locaux et surfaces en bon état"],["Locaux et nuisibles","Absence d'indices de nuisibles"]];
const host=document.getElementById("questions");items.forEach((it,i)=>{const box=document.createElement("section");box.className="card";const h=document.createElement("h3");h.textContent=(i+1)+". "+it[1];const sm=document.createElement("small");sm.textContent=it[0];const sel=document.createElement("select");sel.id="a"+i;[["","Choisir le résultat"],["ok","Conforme"],["nc","Non conforme"],["na","Non applicable"]].forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;sel.append(o)});sel.addEventListener("change",refresh);const lab=document.createElement("label");lab.textContent="Observation";const ta=document.createElement("textarea");ta.id="n"+i;ta.placeholder="Observation ou mesure corrective";lab.append(ta);box.append(sm,h,sel,lab);host.append(box)});function refresh(){let done=0,ok=0,nc=0;items.forEach((_,i)=>{let v=document.getElementById("a"+i).value;if(v)done++;if(v==="ok")ok++;if(v==="nc")nc++});document.getElementById("progress").textContent=done+"/10";document.getElementById("nc").textContent=nc;document.getElementById("score").textContent=ok+nc?Math.round(100*ok/(ok+nc))+"%":"—";return{done,ok,nc}}document.getElementById("generate").onclick=()=>{const x=refresh();let lines=["RAPPORT AUDIT HACCP — DÉMONSTRATION","Établissement : "+document.getElementById("site").value,"Auditeur : "+document.getElementById("auditor").value,"Date : "+document.getElementById("date").value,"Questions renseignées : "+x.done+"/10","Conformité : "+document.getElementById("score").textContent,"Non-conformités : "+x.nc,""];items.forEach((it,i)=>{const v=document.getElementById("a"+i).value;lines.push(it[0]+" — "+it[1],"Résultat : "+({ok:"Conforme",nc:"Non conforme",na:"Non applicable"}[v]||"Non renseigné"),"Observation : "+(document.getElementById("n"+i).value||"Aucune"),"")});document.getElementById("results").textContent=lines.join("\n")};document.getElementById("print").onclick=()=>{document.getElementById("generate").click();window.print()};refresh();
</script></body></html>

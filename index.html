function mtReportEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mtReportDate(v){
 if(!v)return '';
 if(typeof v==='object'&&typeof v.toDate==='function')v=v.toDate();
 if(v instanceof Date)return Number.isNaN(v.getTime())?'':mtReportLocalDate(v);
 const d=String(v);if(/^\d{4}-\d{2}-\d{2}/.test(d))return d.slice(0,10);
 const m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return m[3]+'-'+m[2]+'-'+m[1];
 const parsed=new Date(d);return Number.isNaN(parsed.getTime())?'':mtReportLocalDate(parsed)
}
function mtReportRecordDate(x){return mtReportDate(x.receivedAt||x.createdAt||x.date||x.modifiedAt||x.timestamp)}
function mtReportRows(kind,from,to){return (Array.isArray(S[kind])?S[kind]:[]).filter(x=>x&&mtReportRecordDate(x)>=from&&mtReportRecordDate(x)<=to)}
function mtReportFormat(v){return v===true?'Oui':v===false?'Non':v==null||v===''?'—':String(v)}
function mtReportTable(headers,rows){
 if(!rows.length)return '<p class="empty">Aucun enregistrement disponible pour la période sélectionnée.</p>';
 return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+mtReportEsc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+mtReportEsc(mtReportFormat(v))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'
}
function mtReportLocalDate(d){const pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mtReportRange(mode){
 const now=new Date(),end=mtReportLocalDate(now),start=new Date(now);
 if(mode==='three')start.setDate(now.getDate()-2);
 if(mode==='week')start.setDate(now.getDate()-6);
 if(mode==='thirty')start.setDate(now.getDate()-29);
 if(mode==='month')start.setDate(1);
 if(mode==='last'){const first=new Date(now.getFullYear(),now.getMonth()-1,1),last=new Date(now.getFullYear(),now.getMonth(),0);return [mtReportLocalDate(first),mtReportLocalDate(last)]}
 return [mtReportLocalDate(start),end]
}

let mtAiReportLastRequest=0,mtAiReportCooldownTimer=null,mtAiReportPrintData=null;
function mtAiDateFr(value){const m=String(value||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+"/"+m[2]+"/"+m[1]:String(value||"")}

function mtAiRenderReport(report,facts,site,from,to){
 const out=document.getElementById("mtAiReportOutput"),proof=document.getElementById("mtAiReportProofs");out.replaceChildren();proof.replaceChildren();
 const siteName=typeof siteDisplayName!=="undefined"&&siteDisplayName?siteDisplayName:site;
 mtAiText("h2","Analyse HACCP — "+siteName,out);
 mtAiText("p","Période : "+mtAiDateFr(from)+" au "+mtAiDateFr(to),out);
 const c=facts.counts||{},anomalies=facts.anomalies||[];
 const summary=(c.receptions??0)+" réceptions (dont "+(c.receptionsNonConformes??0)+" non conformes), "+(c.temperatures??0)+" relevé(s) de température, "+(c.nettoyages??0)+" nettoyage(s), "+(c.dlcASurveiller??0)+" DLC à surveiller.";
 mtAiText("h3","Bilan",out);mtAiText("p",summary,out);
 if(!anomalies.length)mtAiText("p","Aucune anomalie détectée sur les données enregistrées",out);
 const conclusion=mtAiFormatDates(report.bilan||"").replace(/^\s*\d+\s+réceptions[\s\S]*?(?:\.\s+|$)/i,"").trim();
 if(conclusion)mtAiText("p",conclusion.split(/(?<=[.!?])\s+/).slice(0,2).join(" "),out);
 mtAiText("h3","Points à vérifier",out);
 const rank={"critique":0,"important":1,"à surveiller":2};
 const pts=report.points.slice().sort((x,y)=>(rank[x.urgence]??3)-(rank[y.urgence]??3));
 if(!pts.length)mtAiText("p","Aucun point supplémentaire signalé.",out);
 for(const p of pts){
  const item=document.createElement("div"),severity=String(p.urgence||"à surveiller").toLowerCase();
  const color=severity==="critique"?"#a32d32":severity==="important"?"#aa6413":"#63726c";
  item.style.cssText="border:2px solid "+color+";border-radius:12px;padding:14px;margin:14px 0;break-inside:avoid";out.appendChild(item);
  mtAiBadge(severity,item);
  mtAiField(item,"Constat",p.constat);
  mtAiField(item,"Preuve",p.preuve);
  mtAiField(item,"Risque",p.risque);
  mtAiField(item,"Action",p.action);
  mtAiField(item,"Urgence",severity+" — "+p.delaiSuggere);
 }
 mtAiText("h3","Actions prioritaires",out);
 const important=anomalies.filter(x=>x.gravite==="critique"||x.gravite==="important");
 const priorities=[...new Set(important.map(x=>x.action).filter(Boolean))].slice(0,3);
 if(!priorities.length)mtAiText("p","Aucune action prioritaire fondée sur un point critique ou important.",out);
 for(const action of priorities)mtAiText("p",mtAiFormatDates(action),out);
 mtAiText("h3","Données manquantes",out);
 const missing=[...new Set(facts.donneesManquantes||[])];
 if(!missing.length)mtAiText("p","Aucune donnée manquante identifiée dans les catégories contrôlées.",out);
 for(const v of missing)mtAiText("p",mtAiFormatDates(v),out);
 mtAiText("p","Texte généré par IA : à vérifier par le responsable HACCP avant toute décision.",proof);
 const user=typeof currentUserProfile!=="undefined"&&currentUserProfile?currentUserProfile:{};
 mtAiReportPrintData={siteName,from,to,userName:user.displayName||user.name||user.username||user.email||"Non renseigné",generated:new Date().toLocaleString("fr-FR")};
}
async function mtAiReportGenerate(){
 const btn=document.getElementById("mtAiReportButton"),status=document.getElementById("mtAiReportStatus"),out=document.getElementById("mtAiReportOutput"),proof=document.getElementById("mtAiReportProofs");
 if(!btn||!status||!out||!proof)return;
 const from=document.getElementById("mtReportFrom")?.value,to=document.getElementById("mtReportTo")?.value;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(from||"")||!/^\d{4}-\d{2}-\d{2}$/.test(to||"")||from>to){status.textContent="Sélectionnez une période valide.";return}
 if(typeof SITE_ID==="undefined"||SITE_ID==="main"){status.textContent="Disponible uniquement pour les établissements.";return}
 const user=window.firebase?.auth?.()?.currentUser;if(!user){status.textContent="Reconnectez-vous à votre établissement.";return}
 if(Date.now()-mtAiReportLastRequest<60000){mtAiCooldown();return}
 mtAiReportLastRequest=Date.now();mtAiCooldown();if(mtAiReportCooldownTimer)clearInterval(mtAiReportCooldownTimer);mtAiReportCooldownTimer=setInterval(mtAiCooldown,1000);
 btn.disabled=true;const oldLabel=btn.textContent;btn.textContent="Analyse en cours…";status.textContent="";
 try{
  const token=await user.getIdToken();
  const res=await fetch("https://mt-haccp-ai-audit.gazibenamar97.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({from,to,mode:"detailed"})});
  const data=await res.json();if(!res.ok)throw Error(data.error||"Erreur "+res.status);
  if(data.site!==SITE_ID)throw Error("Sécurité : établissement différent du compte connecté.");
  const report=data.report;
  if(!report||typeof report.bilan!=="string"||!Array.isArray(report.points)||!Array.isArray(report.priorites)||!Array.isArray(report.donneesManquantes))throw Error("Format du rapport IA invalide. Veuillez réessayer.");
  mtAiRenderReport(report,data.facts||{},data.site,from,to);
 }catch(e){mtAiReportLastRequest=0;if(mtAiReportCooldownTimer){clearInterval(mtAiReportCooldownTimer);mtAiReportCooldownTimer=null}mtAiCooldown();status.textContent="Analyse indisponible : "+String(e.message||e)+". Vérifiez la connexion au service IA et réessayez."}finally{btn.disabled=false;btn.textContent=oldLabel}
}

function customPhotoKey(cat,p){return 'haccpProductPhoto::'+cat+'::'+p}
const haccpProductPhotoCache={};
const haccpProductPhotoLoading=new Set();
async function haccpLoadProductPhoto(path){
 if(haccpProductPhotoLoading.has(path)||haccpProductPhotoCache[path])return;
 haccpProductPhotoLoading.add(path);
 try{
  const a=await haccpPhotoAuth();
  if(!a.tenantReady||!path.startsWith(a.site+'/produits/'))return;
  const res=await fetch(HACCP_PHOTO_ENDPOINT+'/storage/v1/object/authenticated/haccp-photos/'+path,{headers:{apikey:HACCP_PHOTO_PUBLIC_KEY,Authorization:'Bearer '+a.token}});
  if(!res.ok)throw new Error('Photo indisponible ('+res.status+')');
  const blob=await res.blob();haccpProductPhotoCache[path]=URL.createObjectURL(blob);
  if(document.getElementById('photoCatalogue'))renderPhotoCatalogue();
  else if(document.getElementById('catalogueProductGrid'))productPhotoManager();
 }catch(e){console.warn('Photo produit',e)}finally{haccpProductPhotoLoading.delete(path)}
}
async function haccpUploadProductPhoto(data,cat,name){
 const a=await haccpPhotoAuth();
 if(!a.tenantReady)throw new Error('Le jeton Firebase ne contient pas encore les autorisations établissement nécessaires. Aucune photo envoyée.');
 const blob=await(await fetch(data)).blob();
 const path=a.site+'/produits/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';
 const res=await fetch(HACCP_PHOTO_ENDPOINT+'/storage/v1/object/haccp-photos/'+path,{method:'POST',headers:{apikey:HACCP_PHOTO_PUBLIC_KEY,Authorization:'Bearer '+a.token,'Content-Type':'image/jpeg','x-upsert':'false'},body:blob});
 if(!res.ok)throw new Error('Supabase refuse la photo ('+res.status+') : '+(await res.text()).slice(0,150));
 haccpProductPhotoCache[path]=data;return path;
}

function chooseNewProductPhoto(input){
 const file=input.files&&input.files[0];if(!file)return;
 if(!file.type.startsWith('image/')){alert('Choisissez une image valide.');return}
 const reader=new FileReader();
 reader.onload=function(){const image=new Image();image.onload=function(){
 const canvas=document.createElement('canvas');canvas.width=500;canvas.height=500;
 const ctx=canvas.getContext('2d'),side=Math.min(image.width,image.height);
 ctx.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,500,500);
 const data=canvas.toDataURL('image/jpeg',0.8);
 newProductPhotoDraft.changed=true;newProductPhotoDraft.data=data;
 refreshNewProductPhotoPreview();
 };image.onerror=function(){alert('Photo illisible.');};image.src=reader.result;};
 reader.onerror=function(){alert('Impossible de lire la photo.');};
 reader.readAsDataURL(file);input.value='';
}
function storeNewProductPhoto(cat,name){

 try{

 else localStorage.removeItem(key);
 return true;
 }catch(err){alert('Photo trop volumineuse pour le stockage local. Le produit n’a pas été modifié.');return false}

 const say=m=>{if(st)st.textContent=m};

 loginInProgress=true;if(btn){btn.disabled=true;btn.textContent='Connexion…'};say('');
 try{

   cred=await firebase.auth().signInWithEmailAndPassword(login,password);
  }else if(/^[a-z0-9_-]+[0-9]*\.[a-z0-9]+[0-9]*$/.test(login)){
   // New globally unique username: no pre-auth Firestore site lookup required.
   cred=await firebase.auth().signInWithEmailAndPassword(login+'@mt-haccp.local',password);
  }else{
   // Usernames are stored in Firebase Auth as username@<site>.mt-haccp.local.

   // including dynamically created sites such as Le Grand Bleu.
   let sites=[];
   if(SITE_ID&&SITE_ID!=='main')sites.push(SITE_ID);
   try{const known=await getEstablishments();known.forEach(x=>{if(x&&x.id&&x.id!=='main'&&!sites.includes(x.id))sites.push(x.id)})}catch(_){}
   // Publicly known establishment IDs are safe login namespaces; no private profile data is exposed.
   // Include established namespaces when Firestore registry is unavailable before login.
   ['le-grand-bleu','cloche-d-or'].forEach(s=>{if(!sites.includes(s))sites.push(s)});
   // Preserve site IDs from a previous successful sign-in on this device.
   try{const last=localStorage.getItem('mtLastPwaSite');if(last&&last!=='main'&&!sites.includes(last))sites.unshift(last)}catch(_){} 
   // Administrator usernames may also use the main namespace.
   if(!sites.includes('main'))sites.push('main');
   let lastErr=null;
   for(const site of sites){
    try{cred=await firebase.auth().signInWithEmailAndPassword(login+'@'+site+'.mt-haccp.local',password);break}catch(e){lastErr=e}
   }
   if(!cred){const err=lastErr||new Error('Identifiants incorrects');err.siteDiagnostic=sites.join(', ');throw err;}
  }
  try{sessionStorage.removeItem('haccpDashboardUnlocked');sessionStorage.removeItem('mtWelcomeShownFor');sessionStorage.setItem('mtWelcomePending',cred.user.uid)}catch(_){}
  await authorizeAppUser(cred.user);loginInProgress=false;
 }catch(e){

  // Ne pas exposer les détails internes des établissements dans les erreurs de connexion.
  say(msg);loginInProgress=false;if(btn){btn.disabled=false;btn.textContent='Se connecter'}
 }
}

  if(p.active===false){await firebase.auth().signOut();currentUserProfile=null;authLoginScreen('Ce compte a été désactivé par l’administrateur.');return false}
  const isAdmin=p.role==='admin'&&p.site==='main';
  if(!isAdmin&&!p.site){await firebase.auth().signOut();currentUserProfile=null;authLoginScreen('Aucun établissement valide n’est affecté à ce compte.');return false}
  if(SITE_ID==='main'&&!isAdmin){try{localStorage.setItem('mtLastPwaSite',p.site)}catch(_){}location.replace(location.pathname+'?site='+encodeURIComponent(p.site)+'&auth=1');return false}
  if(SITE_ID!=='main'&&isAdmin){location.replace(location.pathname+'?site=main&auth=1');return false}
  if(SITE_ID!==p.site){location.replace(location.pathname+'?site='+encodeURIComponent(p.site)+'&auth=1');return false}
  renderUserSessionBar();home();
  try{
   const pendingWelcome=sessionStorage.getItem('mtWelcomePending')===user.uid;
   const redirectedLogin=new URLSearchParams(location.search).get('auth')==='1';
   const loginAlreadyWelcomed=sessionStorage.getItem('mtWelcomeShownFor')===user.uid;
   if((pendingWelcome||redirectedLogin)&&!loginAlreadyWelcomed){
    sessionStorage.removeItem('mtWelcomePending');
    sessionStorage.setItem('mtWelcomeShownFor',user.uid);
    if(redirectedLogin){const clean=new URL(location.href);clean.searchParams.delete('auth');history.replaceState(null,'',clean.pathname+clean.search+clean.hash)}
    await showEstablishmentWelcome(isAdmin?'Espace administrateur':p.site);
   }
  }catch(e){console.warn('Welcome screen',e)}
  await initCloudSync();return true
 }catch(e){console.error('Authorize',e);authLoginScreen('Impossible de vérifier les droits du compte. '+(e.message||''));return false}

 if(type==='dlc'){title='Alertes DLC';intro='Produits dont la DLC est dépassée, arrive aujourd’hui ou dans les 3 prochains jours. Touchez un produit pour ouvrir sa fiche.';rows=S.stock.map((x,i)=>({x:x,i:i})).filter(o=>{let x=o.x;if(!x.dlc)return false;let d=new Date(x.dlc+'T00:00:00'),n=Math.ceil((d-now)/86400000);return n<=3}).map(o=>{let x=o.x,i=o.i,d=new Date(x.dlc+'T00:00:00'),n=Math.ceil((d-now)/86400000),s=n<0?'EXPIRÉE':n===0?'AUJOURD’HUI':'Dans '+n+' jour(s)';return `<div class="record clickable" onclick="dashboardDLCDetail(${i})" style="cursor:pointer"><b>${esc(x.product)} — ${s}</b><br><span class="note">DLC : ${esc(x.dlc)} · Lot : ${esc(x.lot||'—')} · Fournisseur : ${esc(x.supplier||'—')} · Voir la fiche →</span></div>`}).join('')}
 if(type==='nc'||type==='watch'){title=type==='nc'?'Non-conformités':'Points à surveiller';intro=type==='nc'?'Détail des contrôles enregistrés comme non conformes.':'Alertes qui nécessitent l’attention de la direction ou du responsable HACCP.';let a=[];S.temps.forEach((x,i)=>{if(!x.ok)a.push(`<div class="record clickable" onclick="dashboardTempNCDetail('${esc(x.id||String(i))}')" style="cursor:pointer"><b>Température non conforme — ${esc(x.equipment)}</b><br><span class="note">${esc(x.value)} °C · ${esc(x.date||'')} · Opérateur : ${esc(x.operator||'—')} · Voir le détail →</span></div>`)});S.stock.forEach((x,i)=>{if(x.pack==='Non conforme')a.push(`<div class="record clickable" onclick="dashboardReceptionNCDetail(${i})" style="cursor:pointer"><b>Réception non conforme — ${esc(x.product)}</b><br><span class="note">Motif : ${esc(x.nonConformityReason||'—')} · Fournisseur : ${esc(x.supplier||'—')} · Voir le détail →</span></div>`)});if(type==='watch')S.stock.filter(x=>x.dlc&&new Date(x.dlc+'T00:00:00')<now).forEach(x=>a.push(`<div class="record"><b>DLC dépassée — ${esc(x.product)}</b><br><span class="note">DLC : ${esc(x.dlc)} · Lot : ${esc(x.lot||'—')}</span></div>`));rows=a.join('')}

function dashboardOpenReception(i){
 if(sessionStorage.getItem('haccpDashboardUnlocked')!=='1'){dashboard();return}
 const x=S.stock[i];if(!x){dashboardDetail('receptions');return}
 const match=S.trace.findIndex(t=>t&&t.type==='Réception'&&((x.id&&t.id===x.id)||(t.product===x.product&&t.lot===x.lot&&t.date===x.date)));
 if(match<0){alert('Fiche de réception introuvable dans la traçabilité');return}
 traceReceptionDetail(match);
 const back=app.querySelector('button.back');
 if(back){back.textContent='← Réceptions enregistrées';back.onclick=()=>dashboardDetail('receptions')}
}
function dashboardActivityDetail(i){
 if(sessionStorage.getItem('haccpDashboardUnlocked')!=='1'){dashboard();return}
 let x=S.trace[i];
 if(!x){dashboardDetail('activity');return}
 let back=B('← Dernières activités',"dashboardDetail('activity')",'back');
 let fields=[];
 let add=(label,value)=>{if(value!==undefined&&value!==null&&String(value)!=='')fields.push('<div class="record"><b>'+label+'</b><br><span class="note">'+esc(value)+'</span></div>')};
 add('Type d’activité',x.type||'Opération');
 add('Équipement / produit',x.equipment||x.product||'—');
 add('Date et heure',x.date||'—');
 add('Opérateur',x.operator||x.operateur||x.modifiedBy||'—');
 if(x.type==='Équipement ajouté'){
  add('Température minimum',x.min!==undefined?x.min+' °C':'—');
  add('Température maximum',x.max!==undefined?x.max+' °C':'—');
  if(x.referenceName)add('Référence',x.referenceName);
  if(x.referenceMin!==null&&x.referenceMin!==undefined)add('Plage de référence',x.referenceMin+' °C à '+x.referenceMax+' °C');
  add('Statut',x.ok===false?'Plage différente de la référence':'Plage conforme à la référence')
 }else{
  if(x.value!==undefined)add('Température',x.value+' °C');
  add('Fournisseur',x.supplier);
  add('Lot',x.lot);
  add('Observation / action',x.note||x.observation||x.action||x.correctiveAction);
 }
 app.innerHTML=back+'<h1>Fiche activité</h1><div class="panel"><h2>'+esc(x.type||'Opération')+'</h2>'+fields.join('')+'</div>'
}

function dashboardDLCDetail(i){if(sessionStorage.getItem('haccpDashboardUnlocked')!=='1'){dashboard();return}let x=S.stock[i];if(!x){dashboardDetail('dlc');return}let now=new Date();now.setHours(0,0,0,0);let d=x.dlc?new Date(x.dlc+'T00:00:00'):null,n=d?Math.ceil((d-now)/86400000):null,status=n===null?'—':n<0?'DLC DÉPASSÉE':n===0?'DLC AUJOURD’HUI':'DLC DANS '+n+' JOUR(S)';app.innerHTML=B('← Alertes DLC',"dashboardDetail('dlc')",'back')+`<h1>Fiche alerte DLC</h1><div class="panel"><h2>${esc(x.product||'Produit')}</h2><div class="record"><b>Statut</b><br><span class="note">${esc(status)}</span></div><div class="record"><b>DLC / DDM</b><br><span class="note">${esc(x.dlc||'—')}</span></div><div class="record"><b>Catégorie</b><br><span class="note">${esc(x.category||'—')}</span></div><div class="record"><b>Fournisseur</b><br><span class="note">${esc(x.supplier||'—')}</span></div><div class="record"><b>Lot</b><br><span class="note">${esc(x.lot||'—')}</span></div><div class="record"><b>Quantité / poids</b><br><span class="note">${esc(x.quantity||'—')}</span></div><div class="record"><b>Date de réception</b><br><span class="note">${esc(x.date||'—')}</span></div><div class="record"><b>Réceptionné par</b><br><span class="note">${esc(x.receivedBy||x.operator||'—')}</span></div><div class="record"><b>Observation</b><br><span class="note">${esc(x.observation||'—')}</span></div></div>`}

function showEditSuggestions(kind){
 let input=document.getElementById(kind==='category'?'ec':'esupplier'),box=document.getElementById(kind==='category'?'ecSuggestions':'esupplierSuggestions');
 if(!input||!box)return;
 let values=kind==='category'?Object.keys(CAT):S.suppliers.map(s=>typeof s==='string'?s:s.name).filter(Boolean);
 let norm=v=>normalizeSearch(v);
 let q=norm(input.value),rows=values.filter(v=>!q||norm(v).includes(q));
 if(!rows.length){box.innerHTML='<div class="note" style="padding:12px">Aucune suggestion trouvée.</div>';box.style.display='block';return}
 box.innerHTML=rows.map(v=>'<button type="button" style="display:block;width:100%;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid #e5edf3;background:#fff;color:#243f5b;font-size:16px" onclick="chooseEditSuggestion(\''+encodeURIComponent(v)+'\',\''+kind+'\')"><b>'+esc(v)+'</b></button>').join('');
 box.style.display='block'
}
function chooseEditSuggestion(encoded,kind){

}

const RECEIVING_TEMP_RULES={
 'Viande hachée':{max:2,label:'≤ +2 °C'},'Merguez':{max:4,label:'≤ +4 °C'},'Kefta':{max:4,label:'≤ +4 °C'}
};
function receivingTempRule(cat,prod){
 if(RECEIVING_TEMP_RULES[prod])return RECEIVING_TEMP_RULES[prod];
 if(cat==='Viandes'){
   if(/Foie|Cœur|Rognons|Tripes/i.test(prod))return {max:3,label:'≤ +3 °C'};
   return {max:7,label:'≤ +7 °C'};
 }
 if(cat==='Volailles')return {max:4,label:'≤ +4 °C'};
 if(cat==='Poissons & fruits de mer')return {max:2,label:'proche de la glace fondante (cible 0 à +2 °C)'};
 if(cat==='Surgelés')return {max:-18,label:'≤ -18 °C'};
 if(['Produits laitiers','Œufs & ovoproduits','Charcuterie'].includes(cat))return {max:5,label:'≤ +5 °C (référence générale réception réfrigérée)'};
 return null;
}
function checkReceivingTemp(){
 let el=document.getElementById('rt'),box=document.getElementById('tempCheck');if(!el||!box)return true;
 let rule=receivingTempRule(rc.value,rp.value),v=parseFloat(String(el.value).replace(',','.'));
 if(!rule){box.innerHTML=el.value?'<span class="note">Pas de recommandation automatique pour ce produit : vérifier l’étiquette fabricant / cahier des charges.</span>':'';el.style.borderColor='';return true}
 if(!el.value||Number.isNaN(v)){box.innerHTML='<div style="padding:10px;border:1px solid #c9d7cf;background:#f5faf7;border-radius:10px"><b>Température recommandée : '+rule.label+'</b><br><span class="note">Saisissez manuellement la température mesurée à la réception.</span></div>';el.style.borderColor='';return true}
 let ok=v<=rule.max;el.style.borderColor=ok?'#2e6a50':'#b42318';
 box.innerHTML=ok?'<div style="padding:10px;border:2px solid #2e6a50;background:#e8f5ed;color:#20543e;border-radius:10px"><b>✓ Conforme à la température recommandée</b><br>Température saisie : '+v+' °C · Recommandation : '+rule.label+'</div>':'<div style="padding:12px;border:2px solid #b42318;background:#fde8e8;color:#8a1c13;border-radius:10px"><b>⚠ ALERTE — Température supérieure à la recommandation</b><br>Température saisie : '+v+' °C · Température recommandée : '+rule.label+'<br><b>Indiquez l’action prise dans Observation avant de valider.</b></div>';
 return ok;
}

function haccpRestoreReceptionDraft(){
 try{
  const saved=JSON.parse(sessionStorage.getItem('haccpReceptionSelection')||'null');
  if(!saved||Date.now()-saved.at>3600000)return;
  const cat=document.getElementById('rc');
  if(cat&&saved.category&&Array.from(cat.options).some(o=>o.value===saved.category))cat.value=saved.category;
  if(saved.product){
   const item=receptionSearchItems().find(x=>x.name===saved.product&&(x.category===saved.category||x.cat===saved.category));
   if(item){
    const hidden=document.getElementById('rp'),input=document.getElementById('rpSearch'),label=document.getElementById('rpSelected');
    if(hidden)hidden.value=saved.product;
    if(input)input.value=saved.product;
    if(label)label.textContent='Produit sélectionné : '+saved.product+' · '+saved.category;
   }
  }
  receptionRules();renderPhotoCatalogue();updateReceptionSide();
 }catch(e){}
}

async function preprocessOCRImage(file){

async function haccpPhotoToWebp(file){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
   URL.revokeObjectURL(url);
   try{
    const MAX_BYTES=900*1024;
    const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
    if(!ctx)throw new Error('Compression photo indisponible sur cet appareil');
    let dimension=Math.min(1200,Math.max(img.naturalWidth,img.naturalHeight));
    const encode=()=>{
     const factor=Math.min(1,dimension/img.naturalWidth,dimension/img.naturalHeight);
     cv.width=Math.max(1,Math.round(img.naturalWidth*factor));
     cv.height=Math.max(1,Math.round(img.naturalHeight*factor));
     ctx.drawImage(img,0,0,cv.width,cv.height);
     let quality=0.76;
     let format='image/webp';
     const attempt=()=>{
      cv.toBlob(blob=>{
       if(!blob){reject(new Error('Conversion WebP impossible'));return}
       if(blob.type!==format){
        if(format==='image/webp'){format='image/jpeg';quality=0.76;attempt();return}
        reject(new Error('Format JPEG non pris en charge'));return
       }
       if(blob.size<=MAX_BYTES){resolve(blob);return}
       if(quality>0.38){quality=Math.max(0.38,quality-0.12);attempt();return}
       if(dimension>400){dimension=Math.max(400,Math.round(dimension*0.75));encode();return}
       reject(new Error('Impossible de compresser cette photo sous 1 Mo'));
      },format,quality);
     };
     attempt();
    };
    encode();
   }catch(err){reject(err)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Format photo non pris en charge'))};
  img.src=url;
 });
}

  const path=(tenantReady?site+'/'+uid+'/':uid+'/')+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+extension;

function mtShortCode(name){
 const words=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g)||[];
 return (words.length>1?words.map(w=>w[0]).join(''):words[0]?.slice(0,2)||'et').slice(0,5);
}

async function mtSiteCode(site){
 if(site==='main')return 'adm';
 const items=await getEstablishments(),sorted=items.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)));
 const used=new Set();
 for(const item of sorted){
  const base=mtShortCode(item.name||item.id);let code=base,n=2;
  while(used.has(code))code=base+n++;
  used.add(code);
  if(item.id===site)return code;
 }
 return mtShortCode(site);
}

async function getSiteUsers(site){
 if(!cloudDb||!site)return {rows:[],errors:['Firebase indisponible']};
 const by=new Map(),errors=[];
 const add=u=>{if(u&&u.uid&&u.site===site)by.set(u.uid,{...(by.get(u.uid)||{}),...u})};
 if(currentUserProfile?.site===site)add({...currentUserProfile});
 const tasks=[
  ['Répertoire établissement',()=>cloudDb.collection('appState').doc(site).get({source:'server'}),s=>{if(s.exists&&Array.isArray(s.data()?.userDirectory))s.data().userDirectory.forEach(add)}],
  ['Registre utilisateurs',()=>cloudDb.collection('appUsers').doc(site).get({source:'server'}),s=>{if(s.exists&&Array.isArray(s.data()?.users))s.data().users.forEach(add)}],
  ['Profils Firestore',()=>cloudDb.collection('users').where('site','==',site).get({source:'server'}),s=>s.forEach(d=>add({...(d.data()||{}),uid:d.id}))]
 ];
 await Promise.all(tasks.map(async ([label,read,collect])=>{
  try{collect(await read())}catch(e){errors.push(label+' : '+(e.code||e.message||String(e)))}
 }));
 return {rows:[...by.values()],errors};
}

function equipmentPresetOptions(){
 let groups={};
 EQUIPMENT_PRESETS.forEach((x,i)=>(groups[x.group]||(groups[x.group]=[])).push([x,i]));
 return '<option value="">Choisir un équipement prédéfini</option>'+Object.keys(groups).map(g=>'<optgroup label="'+esc(g)+'">'+groups[g].map(([x,i])=>'<option value="'+i+'">'+esc(x.name)+' ('+x.min+' à '+x.max+' °C)</option>').join('')+'</optgroup>').join('')
}
function applyEquipmentPreset(){
 let s=document.getElementById('equipmentPreset'),ideal=document.getElementById('equipmentPresetIdeal');
 if(!s||s.value===''){if(ideal)ideal.innerHTML='';checkEquipmentRange();return}
 let x=EQUIPMENT_PRESETS[Number(s.value)];
 if(!x)return;
 let base=x.name;
 let normalizeName=v=>String(v||'').trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 let normalizedBase=normalizeName(base),used=new Set();
 S.equipment.forEach(e=>{
  let normalized=normalizeName(e&&e.name);
  if(normalized===normalizedBase)used.add(1);
  if(normalized.indexOf(normalizedBase+' ')===0){
   let suffix=normalized.slice(normalizedBase.length+1);
   if(/^\d+$/.test(suffix))used.add(Number(suffix))
  }
 });
 let next=1;
 while(used.has(next))next++;
 document.getElementById('en').value=base+' '+next;
 document.getElementById('emin').value=x.min;
 document.getElementById('emax').value=x.max;
 if(ideal)ideal.innerHTML='<b>Température idéale : '+esc(x.min)+' °C à '+esc(x.max)+' °C</b>';
 checkEquipmentRange()
}

function checkEquipmentRange(){
 let s=document.getElementById('equipmentPreset'),box=document.getElementById('equipmentRangeStatus'),minEl=document.getElementById('emin'),maxEl=document.getElementById('emax');
 if(!box||!s||s.value===''||!minEl||!maxEl){if(box)box.style.display='none';return true}
 let x=EQUIPMENT_PRESETS[Number(s.value)];
 if(!x||minEl.value===''||maxEl.value===''){box.style.display='none';return true}
 let min=Number(minEl.value),max=Number(maxEl.value),logical=Number.isFinite(min)&&Number.isFinite(max)&&min<=max&&min>=x.min&&max<=x.max;
 box.style.display='block';
 if(logical){
  box.style.border='1px solid #b9e5d2';box.style.background='#e8f8f0';box.style.color='#14704f';
  box.innerHTML='<b>✓ Plage cohérente</b><br>Référence : '+esc(x.min)+' °C à '+esc(x.max)+' °C.'
 }else{
  box.style.border='2px solid #b42318';box.style.background='#fde8e8';box.style.color='#8a1c13';
  box.innerHTML='<b>⚠ Température incohérente avec la référence de cet équipement</b><br>Référence : '+esc(x.min)+' °C à '+esc(x.max)+' °C. Vérifiez la saisie ou le plan HACCP de votre établissement.'
 }
 return logical
}

function checkEquipmentTemperature(){let sel=document.getElementById('te'),input=document.getElementById('tv'),ideal=document.getElementById('tempIdeal'),status=document.getElementById('tempStatus');if(!sel||!ideal||!status)return;if(sel.value===''){ideal.textContent='';status.style.display='none';return}let e=S.equipment[Number(sel.value)];if(!e){ideal.textContent='';status.style.display='none';return}if(e.outOfService){ideal.innerHTML='<div style="padding:14px;border:2px solid #b42318;background:#fde8e8;color:#8a1c13;border-radius:10px"><b>⚠ ÉQUIPEMENT HORS SERVICE — '+esc(e.name)+'</b><br><br>Cet équipement est actuellement déclaré hors service. Merci de vérifier avec le responsable ou l’équipe technique avant toute utilisation.<br><b>Aucun relevé de température ne peut être enregistré tant que l’équipement n’est pas réactivé.</b></div>';status.style.display='none';if(input){input.value='';input.disabled=true}return}else{if(input)input.disabled=false}ideal.innerHTML='<b>Température idéale à respecter : '+esc(e.min)+' °C à '+esc(e.max)+' °C</b>';if(!input||input.value===''){status.style.display='none';return}let v=Number(input.value),ok=Number.isFinite(v)&&v>=Number(e.min)&&v<=Number(e.max);status.style.display='block';if(ok){status.style.border='1px solid #b9e5d2';status.style.background='#e8f8f0';status.style.color='#14704f';status.innerHTML='<b>✓ Température conforme</b><br>'+esc(v)+' °C est dans la plage autorisée ('+esc(e.min)+' °C à '+esc(e.max)+' °C).'}else{status.style.border='2px solid #b42318';status.style.background='#fde8e8';status.style.color='#8a1c13';status.innerHTML='<b>⚠ NON CONFORME — Température hors de la plage autorisée</b><br>Température saisie : '+esc(v)+' °C · Plage à respecter : '+esc(e.min)+' °C à '+esc(e.max)+' °C.<br><b>Indiquez l’observation ou l’action corrective avant d’enregistrer.</b>'}}

function saveTemp(){if(!te||te.value===''){alert('Choisissez votre équipement.');return}let e=S.equipment[+te.value];if(!e){alert('Choisissez un équipement enregistré.');return}if(e.outOfService){alert('Cet équipement est hors service. Réactivez-le depuis le Catalogue équipements avant d’enregistrer un relevé.');return}let v=+tv.value,ok=v>=e.min&&v<=e.max,operator=to.value.trim(),note=(document.getElementById('tn')||{}).value||'';note=note.trim();if(!operator){alert('Le nom de l’opérateur est obligatoire.');to.focus();return}if(!ok&&!note){alert('Température non conforme : indiquez obligatoirement l’observation ou l’action corrective.');document.getElementById('tn').focus();return}let id='temp-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),x={id,equipment:e.name,value:v,ok,operator,note,observation:note,date:new Date().toLocaleString('fr-FR'),createdAt:new Date().toISOString()};S.temps.unshift(x);S.trace.unshift({type:'Température',...x});save();temperatures()}
function setEquipmentService(i,inService){
 let e=S.equipment[i];
 if(!e)return;
 let action=inService?'réactiver':'mettre hors service';
 if(!confirm((inService?'Réactiver':'Mettre hors service')+' « '+e.name+' » ?'))return;
 let operator=prompt('Nom de l’opérateur qui va '+action+' cet équipement :','');
 if(operator===null)return;
 operator=operator.trim();
 if(!operator){alert('Le nom de l’opérateur est obligatoire.');return}
 e.outOfService=!inService;
 e.serviceUpdatedAt=new Date().toISOString();
 S.trace.unshift({type:inService?'Équipement réactivé':'Équipement hors service',equipment:e.name,product:e.name,min:e.min,max:e.max,operator:operator,date:new Date().toLocaleString('fr-FR'),ok:inService,note:inService?'Équipement remis en service.':'Équipement temporairement hors service / en réparation.'});
 save();
 equipmentManager()
}
function removeEquipment(i){
 let e=S.equipment[i];
 if(!e)return;
 if(!confirm('Supprimer « '+e.name+' » de la liste des équipements ?\n\nLes anciens relevés et l’historique HACCP seront conservés.'))return;
 let operator=prompt('Nom de l’opérateur qui retire cet équipement :','');
 if(operator===null)return;
 operator=operator.trim();
 if(!operator){alert('Le nom de l’opérateur est obligatoire pour retirer un équipement.');return}
 let removed=S.equipment.splice(i,1)[0];
 S.trace.unshift({type:'Équipement supprimé',equipment:removed.name,product:removed.name,min:removed.min,max:removed.max,operator:operator,date:new Date().toLocaleString('fr-FR'),note:'Équipement retiré de la liste active. Historique conservé.'});
 save();
 equipmentManager()
}
function addEq(){
 let name=(document.getElementById('en')||{}).value||'',min=(document.getElementById('emin')||{}).value,max=(document.getElementById('emax')||{}).value,operator=((document.getElementById('eqOperator')||{}).value||'').trim();
 name=name.trim().replace(/\s+/g,' ');
 if(!name){alert('Le nom de l’équipement est obligatoire.');document.getElementById('en').focus();return}
 if(!operator){alert('Le nom de l’opérateur est obligatoire.');document.getElementById('eqOperator').focus();return}
 if(min===''||max===''){alert('Les températures minimum et maximum sont obligatoires.');(min===''?document.getElementById('emin'):document.getElementById('emax')).focus();return}
 let minValue=Number(min),maxValue=Number(max);
 if(!Number.isFinite(minValue)||!Number.isFinite(maxValue)){alert('Saisissez des températures minimum et maximum valides.');return}
 if(minValue>maxValue){alert('La température minimum ne peut pas être supérieure à la température maximum.');document.getElementById('emin').focus();return}
 let preset=document.getElementById('equipmentPreset');
 if(preset&&preset.value!==''&&!checkEquipmentRange()){
  let ref=EQUIPMENT_PRESETS[Number(preset.value)];
  if(!confirm('La plage saisie ('+minValue+' °C à '+maxValue+' °C) est différente de la référence ('+ref.min+' °C à '+ref.max+' °C). Voulez-vous quand même ajouter cet équipement selon votre plan HACCP ?'))return
 }
 let normalized=name.toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 let duplicate=S.equipment.some(e=>{
  let existing=String(e&&e.name||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return existing===normalized
 });
 if(duplicate){
  alert('Ce nom d’équipement est déjà utilisé. Vous pouvez choisir librement un autre nom, par exemple « '+name+' X » ou un nom correspondant à son emplacement.');
  document.getElementById('en').focus();
  document.getElementById('en').select();
  return
 }
 let ref=preset&&preset.value!==''?EQUIPMENT_PRESETS[Number(preset.value)]:null;
 let referenceOk=!ref||(minValue>=ref.min&&maxValue<=ref.max);
 let item={name:name,min:minValue,max:maxValue};
 S.equipment.push(item);
 S.trace.unshift({type:'Équipement ajouté',equipment:name,product:name,min:minValue,max:maxValue,operator:operator,date:new Date().toLocaleString('fr-FR'),referenceMin:ref?ref.min:null,referenceMax:ref?ref.max:null,referenceName:ref?ref.name:'',ok:referenceOk,note:referenceOk?'Plage conforme à la référence':'Plage différente de la référence'});
 save();
 equipmentManager();
}

function prepareCleanPhoto(file){if(!file)return;let r=new FileReader();r.onload=function(){let im=new Image();im.onload=function(){let maxW=1000,maxH=750,scale=Math.min(1,maxW/im.width,maxH/im.height),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale)),cv=document.createElement('canvas');cv.width=w;cv.height=h;let ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);CLEAN_PHOTO=cv.toDataURL('image/webp',.68);let p=document.getElementById('cleanPhotoPreview');if(p){p.style.display='block';p.innerHTML='<b>Photo prête</b><br><img src="'+CLEAN_PHOTO+'" alt="Preuve nettoyage" style="display:block;max-width:260px;max-height:190px;object-fit:contain;margin-top:8px;border-radius:8px"><button type="button" class="btn" style="margin-top:8px;padding:8px 12px" onclick="removeCleanPhoto()">Supprimer la photo</button>'}};im.src=r.result};r.readAsDataURL(file)}
function removeCleanPhoto(){CLEAN_PHOTO='';['cleanCameraInput','cleanGalleryInput'].forEach(function(id){let i=document.getElementById(id);if(i)i.value=''});let p=document.getElementById('cleanPhotoPreview');if(p){p.style.display='none';p.innerHTML=''}}
function saveClean(){if(!cz.value.trim()){alert('Indiquez la zone ou l’équipement nettoyé.');return}if(!co.value.trim()){alert('Indiquez l’opérateur.');return}let status=cs.value;if(status!=='Conforme'&&!cn.value.trim()){alert('Décrivez le problème ou l’action corrective avant de valider.');return}let x={zone:cz.value.trim(),operator:co.value.trim(),action:ca.value,status:status,note:cn.value.trim(),photo:CLEAN_PHOTO||'',date:new Date().toLocaleString('fr-FR'),createdAt:new Date().toISOString()};S.clean.unshift(x);S.trace.unshift({type:'Nettoyage',product:x.zone,date:x.date,status:x.status,operator:x.operator,note:x.note,photo:x.photo,action:x.action});save();cleaning()}
function trace(){CURRENT_VIEW='trace';for(const k of ['stock','temps','clean','trace'])if(!Array.isArray(S[k]))S[k]=[];app.innerHTML=`<h1>Traçabilité</h1><div class="cards"><div class="metric"><span>Réceptions</span><b>${S.stock.length}</b></div><div class="metric"><span>Températures</span><b>${S.temps.length}</b></div><div class="metric"><span>Nettoyages</span><b>${S.clean.length}</b></div></div><div class="panel">${S.trace.length?S.trace.map((x,i)=>{let openable=x&&['Étiquette HACCP','Réception','Nettoyage','Température','Équipement ajouté'].includes(x.type);return `<div class="record ${openable?'clickable':''}" ${openable?`onclick="openTraceIndex(${i})" style="cursor:pointer"`:''}><b>${esc(x&&x.type||'')}</b> — ${esc(x&&x.date||'')}<br><span class="note">${esc(x&&(x.product||x.equipment)||'')}${openable?' · Voir le détail →':''}${x&&x.type==='Modification réception'?'<br>Par : '+esc(x.modifiedBy||'—')+' · Motif : '+esc(x.reason||'—'):''}</span></div>`}).join(''):'Aucune opération enregistrée.'}</div>`}

function openTraceIndex(i){let source=S.trace[i];if(!source){alert('Le relevé a été actualisé. Rouvrez Traçabilité puis réessayez.');return}let record=JSON.parse(JSON.stringify(source));openTraceRecord(record)}

function openTraceRecord(x){if(!x)return;CURRENT_VIEW='trace-detail';if(x.type==='Réception'){renderTraceReception(x);return}if(x.type==='Température'){renderTraceTemperature(x);return}if(x.type==='Nettoyage'){renderTraceCleaning(x);return}if(x.type==='Équipement ajouté'){renderTraceEquipment(x);return}if(x.type==='Étiquette HACCP'){let live=S.trace.findIndex(t=>t&&t.type===x.type&&t.date===x.date&&t.product===x.product);if(live>=0)traceLabelDetail(live);return}}

function renderTraceEquipment(x){let ref=(x.referenceMin!==null&&x.referenceMin!==undefined)?esc(x.referenceMin)+' °C à '+esc(x.referenceMax)+' °C':'Référence non sélectionnée';app.innerHTML=`<button class="btn back" onclick="trace()">← Traçabilité</button><h1>Historique équipement</h1><div class="panel"><h2>${esc(x.equipment||x.product||'Équipement')}</h2><div class="record"><b>Statut de la plage configurée</b><br><span class="note">${x.ok===false?'⚠ ÉCART PAR RAPPORT À LA RÉFÉRENCE':'Conforme'}</span></div><div class="record"><b>Plage configurée</b><br><span class="note">${esc(x.min)} °C à ${esc(x.max)} °C</span></div><div class="record"><b>Plage de référence</b><br><span class="note">${ref}</span></div><div class="record"><b>Date / heure</b><br><span class="note">${esc(x.date||'—')}</span></div><div class="record"><b>Opérateur</b><br><span class="note">${esc(x.operator||'—')}</span></div></div>`}

function renderTraceCleaning(x){let bad=x.status&&x.status!=='Conforme';app.innerHTML=`<button class="btn back" onclick="trace()">← Traçabilité</button><h1>Historique nettoyage</h1><div class="panel"><h2>${esc(x.product||'Zone')}</h2>${bad?'<div style="padding:14px;border:2px solid #b42318;background:#fde8e8;color:#8a1c13;border-radius:12px;margin-bottom:12px"><b>Anomalie signalée</b></div>':'<div style="padding:12px;border:1px solid #b9e5d2;background:#e8f8f0;color:#14704f;border-radius:10px;margin-bottom:12px"><b>Contrôle conforme</b></div>'}<div class="record"><b>Date / heure</b><br><span class="note">${esc(x.date||'—')}</span></div><div class="record"><b>Action</b><br><span class="note">${esc(x.action||'Nettoyage')}</span></div><div class="record"><b>Opérateur</b><br><span class="note">${esc(x.operator||'—')}</span></div><div class="record"><b>Observation / action corrective</b><br><span class="note">${esc(x.note||'—')}</span></div></div>`}

function renderTraceReception(x){let live=S.trace.findIndex(t=>t&&t.type==='Réception'&&t.date===x.date&&t.product===x.product&&t.lot===x.lot);if(live>=0){traceReceptionDetail(live);return}app.innerHTML=`<button class="btn back" onclick="trace()">← Traçabilité</button><h1>Historique réception</h1><div class="panel"><h2>${esc(x.product||'Produit')}</h2><div class="record"><b>Date de réception</b><br><span class="note">${esc(x.date||'—')}</span></div><div class="record"><b>Fournisseur</b><br><span class="note">${esc(x.supplier||'—')}</span></div><div class="record"><b>Lot fournisseur</b><br><span class="note">${esc(x.lot||'—')}</span></div><div class="record"><b>Température réception</b><br><span class="note">${x.temp!==''?esc(String(x.temp))+' °C':'—'}</span></div><div class="record"><b>Emballage</b><br><span class="note">${esc(x.pack||'—')}</span></div><div class="record"><b>Réceptionné par</b><br><span class="note">${esc(x.receivedBy||x.operator||'—')}</span></div></div>`}

function traceTemperatureById(id){let i=S.trace.findIndex(x=>x&&x.type==='Température'&&x.id===id);if(i<0){let t=S.temps.find(x=>x&&x.id===id);if(!t){alert('Relevé de température introuvable.');return}let eq=S.equipment.find(e=>e.name===t.equipment),range=eq?esc(eq.min)+' °C à '+esc(eq.max)+' °C':'—';app.innerHTML=`<button class="btn back" onclick="trace()">← Traçabilité</button><h1>Historique température</h1><div class="panel"><h2>${esc(t.equipment||'Équipement')}</h2><div class="record"><b>Statut</b><br><span class="note">${t.ok?'Conforme':'NON CONFORME'}</span></div><div class="record"><b>Température mesurée</b><br><span class="note">${esc(t.value)} °C</span></div><div class="record"><b>Plage autorisée</b><br><span class="note">${range}</span></div><div class="record"><b>Date / heure</b><br><span class="note">${esc(t.date||'—')}</span></div><div class="record"><b>Opérateur</b><br><span class="note">${esc(t.operator||'Non renseigné')}</span></div><div class="record"><b>Observation / action corrective</b><br><span class="note">${esc(t.note||t.observation||'Non renseignée')}</span></div></div>`;return}traceTemperatureDetail(i)}
function traceTemperatureDetail(i){let tr=S.trace[i];if(!tr||tr.type!=='Température'){trace();return}let x=(tr.id?temperatureRecord(tr.id):null)||temperatureRecord(S.temps.findIndex(t=>t&&t.equipment===tr.equipment&&t.date===tr.date&&String(t.value)===String(tr.value)))||{equipment:tr.equipment,value:tr.value,ok:tr.ok,operator:tr.operator||tr.operateur||'',note:tr.note||tr.observation||tr.action||tr.correctiveAction||'',date:tr.date};let eq=S.equipment.find(e=>e.name===x.equipment),range=eq?esc(eq.min)+' °C à '+esc(eq.max)+' °C':'—';app.innerHTML=`<button class="btn back" onclick="trace()">← Traçabilité</button><h1>Historique température</h1><div class="panel"><h2>${esc(x.equipment||'Équipement')}</h2><div class="record"><b>Statut</b><br><span class="note">${x.ok?'Conforme':'NON CONFORME'}</span></div><div class="record"><b>Température mesurée</b><br><span class="note">${esc(x.value)} °C</span></div><div class="record"><b>Plage autorisée</b><br><span class="note">${range}</span></div><div class="record"><b>Date / heure</b><br><span class="note">${esc(x.date||'—')}</span></div><div class="record"><b>Opérateur</b><br><span class="note">${esc(x.operator||'Non renseigné')}</span></div><div class="record"><b>Observation / action corrective</b><br><span class="note">${esc(x.note||'Non renseignée')}</span></div></div>`}

function traceReceptionDetail(i){

function labelAutoRule(product,action){
 let r=LABEL_AUTO_RULES.find(x=>x.re.test(product||''));
 if(!r)return {days:7,temp:'≤ +5 °C',basis:'Plafond automatique par défaut pour préparation réfrigérée prête à consommer; à réduire si le plan HACCP, le procédé ou le fabricant l’exige',manufacturer:false};
 return r;
}

function normalizeSearch(v){
 return String(v||'').toLocaleLowerCase('fr').replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')
}
function normalizeProductSearch(v){return normalizeSearch(v)}
function labelAllProducts(){
 let rows=[];
 Object.keys(LABEL_CAT).forEach(function(cat){
   Object.keys(LABEL_CAT[cat]).forEach(function(sub){
     LABEL_CAT[cat][sub].forEach(function(item,i){rows.push({cat:cat,sub:sub,item:item,index:i})})
   })
 });
 return rows
}
function labelProductsForCategory(cat){
 return labelAllProducts().filter(function(x){return x.cat===cat})
}
function dlcCats(){
 CURRENT_VIEW='labeling';
 document.body.classList.remove('on-home','mt-premium-active');
 C='';SUB='';P='';
 let cats=Object.keys(LABEL_CAT);
 app.innerHTML='<h1>Étiquetage HACCP</h1><div class="panel"><h2>Créer une étiquette</h2>'+
 '<div class="row"><div><label>Catégorie <b>*</b></label><select id="labelCategory" onchange="labelCategoryChanged()"><option value="">Choisir une catégorie</option>'+cats.map(function(x){return '<option value="'+esc(x)+'">'+x+'</option>'}).join('')+'</select></div>'+
 '<div><label>Produit <b>*</b></label><div style="position:relative"><input id="labelProductSearch" placeholder="Rechercher ou choisir un produit" autocomplete="off" onfocus="showLabelProductList()" oninput="filterLabelProducts()"><div id="labelProductList" class="panel" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:20;max-height:260px;overflow:auto;padding:6px;margin-top:4px"></div></div></div></div>'+
 '<div id="labelSelected" class="note" style="margin:12px 0">Recherchez un produit dans tout le catalogue ou choisissez une catégorie pour filtrer.</div>'+
 '<button id="labelContinue" class="btn primary" disabled onclick="openSelectedLabelTicket()">Créer / imprimer le ticket</button>'+
 '<p class="note" style="margin-top:16px">Les produits proposés proviennent de la base HACCP existante. La recherche Produit est limitée à la catégorie sélectionnée.</p></div>'
}
function labelCategoryChanged(){
 let cat=document.getElementById('labelCategory').value,input=document.getElementById('labelProductSearch');
 C=cat;SUB='';P='';input.value='';if(input){input.disabled=false;input.readOnly=false}
 document.getElementById('labelContinue').disabled=true;
 document.getElementById('labelSelected').textContent=cat?'Choisissez ou recherchez un produit dans cette catégorie.':'Recherchez un produit dans tout le catalogue ou choisissez une catégorie pour filtrer.';
 showLabelProductList()
}
function showLabelProductList(){let input=document.getElementById('labelProductSearch');if(input){input.disabled=false;input.readOnly=false}filterLabelProducts()}
function filterLabelProducts(){
 let box=document.getElementById('labelProductList'),input=document.getElementById('labelProductSearch');if(!box||!input)return;
 let q=normalizeProductSearch(input.value),rows=(C?labelProductsForCategory(C):labelAllProducts()).filter(function(x){return !q||normalizeProductSearch(x.item[0]).includes(q)}).sort(function(a,b){return String(a.item[0]).localeCompare(String(b.item[0]),'fr')});
 box.innerHTML=rows.length?rows.map(function(x){return '<button type="button" class="btn" style="display:block;width:100%;text-align:left;margin:3px 0" onclick="selectLabelProduct(this)" data-cat="'+encodeURIComponent(x.cat)+'" data-sub="'+encodeURIComponent(x.sub)+'" data-i="'+x.index+'">'+x.item[0]+'</button>'}).join(''):'<div class="note" style="padding:10px">Aucun produit trouvé.</div>';
 box.style.display='block'
}
function selectLabelProduct(el){
 C=decodeURIComponent(el.getAttribute('data-cat'));SUB=decodeURIComponent(el.getAttribute('data-sub'));let i=Number(el.getAttribute('data-i')),item=LABEL_CAT[C][SUB][i];
 P=item[0];let catEl=document.getElementById('labelCategory');if(catEl&&catEl.value!==C)catEl.value=C;document.getElementById('labelProductSearch').value=P;document.getElementById('labelProductList').style.display='none';
 document.getElementById('labelSelected').innerHTML='<b>Produit sélectionné :</b> '+P+' · '+C;document.getElementById('labelContinue').disabled=false;document.getElementById('labelProductSearch').placeholder='Choisir / changer de produit'
}
function openSelectedLabelTicket(){
 if(!C||!SUB||!P){alert('Choisissez une catégorie et un produit.');return}
 let products=LABEL_CAT[C][SUB],i=products.findIndex(function(x){return x[0]===P});if(i<0)return;ticket(i)
}
function dlcSubsByName(){dlcCats()}
function dlcProductsByName(){dlcCats()}
function dlcSubsByCurrent(){dlcCats()}
function dlcProductsCurrent(){dlcCats()}
function ticket(i){
 let item=LABEL_CAT[C][SUB][i];P=item[0];
 let now=new Date(),date=now.toISOString().slice(0,10),time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 let rule=labelAutoRule(P,'Préparation');DAYS=rule.days;
 app.innerHTML='<button class="btn back print-hide" onclick="dlcCats()">← Étiquetage</button><h1>Étiquette HACCP</h1><div class="panel"><h2>'+P+'</h2>'+
 '<div class="row print-hide"><div><label>Type d’opération</label><select id="labelAction" onchange="applyLabelAutoRule()"><option>Préparation</option><option>Ouverture</option><option>Déconditionnement</option><option>Portionnement</option><option>Décongélation</option><option>Cuisson / refroidissement</option></select></div><div></div></div>'+
 '<div class="row print-hide"><div><label>Date</label><input id="labelDate" type="date" value="'+date+'" onchange="calcLabel()"></div><div><label>Heure</label><input id="labelTime" type="time" value="'+time+'" onchange="calcLabel()"></div></div>'+
 '<div class="row print-hide"><div><label>Recommandation HACCP</label><div id="labelSuggestion" class="metric" style="padding:12px;margin-top:6px"></div><div id="labelRuleNote" class="note"></div></div><div><label>DLC en jours <b>*</b></label><input id="labelDays" type="number" min="0" step="1" placeholder="Ex. 1, 2, 3…" oninput="calcLabel()"><div class="note">L’opérateur indique le nombre de jours. La date limite est calculée automatiquement sur l’étiquette.</div><div id="labelDlcAlert" style="display:none;margin-top:10px;padding:12px;border-radius:10px;font-weight:800"></div></div></div><div class="row print-hide"><div><label>Conservation</label><input id="labelTemp" oninput="calcLabel()"></div><div></div></div>'+
 '<div class="row print-hide"><div><label>Emplacement / équipement</label><select id="labelStorage" onchange="calcLabel()"><option value="">Choisir un équipement</option>'+S.equipment.map(function(e){return '<option value="'+String(e.name||'').replace(/"/g,'&quot;')+'">'+e.name+'</option>'}).join('')+'</select><div class="note">Liste synchronisée avec les équipements du module Températures.</div></div><div><label>Opérateur</label><input id="labelOperator" oninput="calcLabel()"></div></div>'+
 '<div class="row print-hide"><div><label>Instruction fabricant après ouverture (si applicable)</label><input id="labelManufacturer" oninput="calcLabel()" placeholder="Ex. à consommer sous 3 jours après ouverture"><div class="note">Si le fabricant indique une durée plus courte, elle est prioritaire.</div></div><div></div></div>'+
 '<h2 class="print-hide">Aperçu</h2><div id="labelPreview" style="width:60mm;min-height:40mm;margin:12px auto;border:2px solid #17251f;padding:4mm;background:white;color:#111;font-family:Arial,sans-serif"></div>'+
 '<div class="row print-hide"><button class="btn primary" onclick="saveLabel(true)">Imprimer l’étiquette</button><button class="btn" onclick="saveLabel(false)">Enregistrer sans imprimer</button></div></div>';
 applyLabelAutoRule();
}
function applyLabelAutoRule(){
 let a=document.getElementById('labelAction'),r=labelAutoRule(P,a?a.value:'Préparation'),days=document.getElementById('labelDays'),temp=document.getElementById('labelTemp'),note=document.getElementById('labelRuleNote');
 DAYS=r.days;
 let suggestion=document.getElementById('labelSuggestion');
 if(days){days.value='';days.placeholder='Nombre de jours'}
 if(suggestion)suggestion.innerHTML=r.manual?'⚠ Durée à définir selon une procédure HACCP validée.':('Conseil : à consommer de préférence sous <b>'+r.days+' jour'+(r.days>1?'s':'')+'</b>.');
 if(temp)temp.value=r.temp||'';
 if(note)note.innerHTML=r.basis+(r.manufacturer?' — <b>instruction fabricant prioritaire</b>':'');
 calcLabel();
}
function calcLabel(){
 let d=document.getElementById('labelDate'),days=document.getElementById('labelDays');if(!d||!days)return;
 let n=Number(days.value),has=days.value!==''&&Number.isFinite(n)&&n>=0;
 let exp=new Date(d.value+'T12:00:00');if(has)exp.setDate(exp.getDate()+n);
 outDate=has?exp.toLocaleDateString('fr-FR'):'À définir';
 let alertBox=document.getElementById('labelDlcAlert');
 if(alertBox){
   if(!has){alertBox.style.display='none';}
   else if(DAYS>0&&n>DAYS){
     alertBox.style.display='block';alertBox.style.background='#fde8e8';alertBox.style.border='2px solid #b42318';alertBox.style.color='#8a1c13';
     alertBox.innerHTML='⚠ ALERTE — La durée saisie ('+n+' jour'+(n>1?'s':'')+') dépasse la recommandation HACCP ('+DAYS+' jour'+(DAYS>1?'s':'')+'). Durée conseillée : '+DAYS+' jour'+(DAYS>1?'s':'')+'.';
   }else{
     alertBox.style.display='block';alertBox.style.background='#e8f5ed';alertBox.style.border='2px solid #2e6a50';alertBox.style.color='#20543e';
     alertBox.innerHTML='✓ Conforme à la recommandation HACCP.';
   }
 }
 let v=id=>{let e=document.getElementById(id);return e?e.value:''};
 document.getElementById('labelPreview').innerHTML='<div style="font-size:15px;font-weight:900;text-align:center;border-bottom:1px solid #111;padding-bottom:3px">'+P+'</div>'+
 '<div style="font-size:11px;margin-top:4px">Opération : '+v('labelAction')+'</div>'+
 '<div style="font-size:11px">Date : '+new Date(d.value+'T12:00:00').toLocaleDateString('fr-FR')+' · '+v('labelTime')+'</div>'+
 '<div style="font-size:15px;font-weight:900;margin:5px 0">À consommer avant : '+outDate+'</div>'+
 (v('labelTemp')?'<div style="font-size:11px">Conservation : '+v('labelTemp')+'</div>':'')+
 (v('labelStorage')?'<div style="font-size:11px">Emplacement : '+v('labelStorage')+'</div>':'')+
 (v('labelOperator')?'<div style="font-size:11px">Opérateur : '+v('labelOperator')+'</div>':'');
}
function saveLabel(printIt){
 let v=id=>{let e=document.getElementById(id);return e?e.value:''};
 if(!v('labelDays')){alert('Indiquez la DLC en nombre de jours avant d’enregistrer cette étiquette.');return}
 let enteredDays=Number(v('labelDays')),overRecommendation=DAYS>0&&enteredDays>DAYS;
 if(overRecommendation&&!confirm('ALERTE HACCP : la durée saisie ('+enteredDays+' jours) dépasse la recommandation ('+DAYS+' jours).\n\nVoulez-vous maintenir cette durée ?'))return;
 S.trace.unshift({type:'Étiquette HACCP',overRecommendation:overRecommendation,recommendedDays:DAYS,product:P,category:C,subCategory:SUB,action:v('labelAction'),preparedAt:v('labelDate')+' '+v('labelTime'),durationDays:Number(v('labelDays')),dlc:outDate,temperature:v('labelTemp'),storage:v('labelStorage'),operator:v('labelOperator'),manufacturerInstruction:v('labelManufacturer'),date:new Date().toLocaleString('fr-FR')});
 save();if(printIt){window.print()}else{alert('Étiquette enregistrée dans la traçabilité.');dlcCats()}
}

document.addEventListener('click',function(e){
 let labelBox=document.getElementById('labelProductList'),labelInput=document.getElementById('labelProductSearch');
 if(labelBox&&labelInput&&!labelBox.contains(e.target)&&e.target!==labelInput){labelBox.style.display='none';labelInput.value=''}
 let recBox=document.getElementById('rpList'),recInput=document.getElementById('rpSearch');
 if(recBox&&recInput&&!recBox.contains(e.target)&&e.target!==recInput){recBox.style.display='none';let rp=document.getElementById('rp');recInput.value=rp&&rp.value?rp.value:''}
 document.querySelectorAll('input[id*="Search"],input[id*="search"]').forEach(function(input){
   if(e.target===input)return;
   let wrap=input.parentElement;
   if(wrap&&wrap.contains(e.target))return;
   if(input.id==='rpSearch'){let rp=document.getElementById('rp');input.value=rp&&rp.value?rp.value:''}
   else if(input.value)input.value='';
   if(input.id==='teSearch'){
     let box=document.getElementById('teSuggestions');
     if(box)box.style.display='none';
     let hidden=document.getElementById('te');
     if(hidden&&hidden.value==='')checkEquipmentTemperature();
   }
 });
 document.querySelectorAll('[id$="Suggestions"]').forEach(function(box){
   let parent=box.parentElement;
   if(parent&&!parent.contains(e.target))box.style.display='none';
 });
});

startApplication();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>reg.update()).catch(e=>console.warn('PWA service worker',e))})}

const titles={formation:'Formation du personnel',documents:'Gestion documentaire HACCP',dechets:'Gestion des déchets alimentaires',nuisibles:'Plan de lutte contre les nuisibles',audits:'Audits HACCP',correctives:'Actions correctives HACCP',reception:'Réception des marchandises',fournisseurs:'Fournisseurs',etiquetage:'Étiquetage HACCP',stock:'Stock et DLC',temperatures:'Contrôle des températures',nettoyage:'Nettoyage',tracabilite:'Traçabilité',direction:'Tableau de bord Direction',parametres:'Paramètres'};
function moduleKey(){

return Object.keys(titles).find(k=>t.includes(titles[k]))||(/Fournisseur/i.test(t)?'fournisseurs':/Nettoyage/i.test(t)?'nettoyage':null);

function decorate(){

if(!app||!shell||document.body.classList.contains('on-home')||innerWidth<=850)return;

 const on=(b.getAttribute('onclick')||'').includes("'"+key+"'");
 b.classList.toggle('mt-module-active',on);
 b.style.background=on?'#2a8a55':'transparent';
 b.style.color=on?'#fff':'#edf8f2';

 bar.querySelector('.mt-module-site span').textContent=site;
 app.prepend(bar);
}
const h=app.querySelector('.rec-head h1, :scope > h1, :scope > section h1');

 });

 const panel=Array.from(app.querySelectorAll('.panel')).find(p=>p.querySelector('.record'));

 }

 app.querySelectorAll('a,button,span').forEach(el=>{if(el.textContent.trim()==='Voir le détail →')el.classList.add('mt-dashboard-detail')});

const obs=new MutationObserver(()=>{if(!document.body.classList.contains('on-home'))decorate()});
const app=document.getElementById('app');if(app)obs.observe(app,{childList:true,subtree:false});

<script id="mt-desktop-responsive-scale-script">
/* Paramètres modifiables : largeur de référence et plafond d'agrandissement. */
(function(){
 const MT_REFERENCE_WIDTH=1536;
 const MT_MAX_SCALE=2.25;
 let resizeDelay;
 function mtApplyDesktopScale(){
  const width=window.innerWidth;
  const scale=width<851?1:Math.min(MT_MAX_SCALE,Math.max(1,width/MT_REFERENCE_WIDTH));
  document.documentElement.style.setProperty('--mt-scale',String(scale));
 }
 mtApplyDesktopScale();
 window.addEventListener('resize',function(){
  clearTimeout(resizeDelay);
  resizeDelay=setTimeout(mtApplyDesktopScale,100);
 },{passive:true});
 window.addEventListener('beforeprint',function(){document.documentElement.style.setProperty('--mt-scale','1')});
 window.addEventListener('afterprint',mtApplyDesktopScale);
})();
</script>

<script id="mt-audits-firestore-bridge">
(function(){
 'use strict';
 window.addEventListener('message',async function(event){
  if(event.origin!==location.origin||!event.data||event.data.mtAudit!==true)return;
  const frame=document.querySelector('.mt-audits-iframe');
  if(!frame||event.source!==frame.contentWindow)return;
  const msg=event.data;const respond=(result,error)=>event.source.postMessage({mtAuditResponse:true,id:msg.id,result,error},event.origin);
  try{
   if(typeof SITE_ID==='undefined'||SITE_ID==='main')throw Error('Un compte établissement est requis.');
   if(!firebase.auth().currentUser||!currentUserProfile||currentUserProfile.site!==SITE_ID||currentUserProfile.active===false)throw Error('Session établissement non autorisée.');
   if(!cloudDb)throw Error('Connexion Firebase indisponible.');
   const doc=cloudDb.collection('appState').doc(SITE_ID);
   if(msg.type==='context'){
    respond({site:SITE_ID,name:siteDisplayName||SITE_ID,auditor:currentUserProfile.name||currentUserProfile.displayName||currentUserProfile.email||''});return;
   }
   if(msg.type==='list'){
    const snap=await doc.get({source:'server'});const records=(snap.data()||{}).auditsRecords;
    respond((Array.isArray(records)?records:[]).slice().sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||''))));return;
   }
   // Drafts are isolated by authenticated user and by audit zone in the establishment document.
   const uid=firebase.auth().currentUser.uid;
   const zone=String(msg.payload&&msg.payload.zone||'');
   if(msg.type==='draftGet'){
    const snap=await doc.get({source:'server'});
    const all=(snap.data()||{}).auditDraftsByUser||{};
    respond(all[uid]&&typeof all[uid]==='object'?all[uid]:{});return;
   }
   if(msg.type==='draftPut'){
    const draft=msg.payload&&msg.payload.draft||{};
    if(!zone||zone.length>100||zone==='__proto__'||zone==='constructor'||draft.zone!==zone||
       !Array.isArray(draft.entries)||draft.entries.length!==10||
       draft.entries.some(x=>!['','ok','nc','na'].includes(x.result))||JSON.stringify(draft).length>18000)
       throw Error('Brouillon HACCP invalide.');
    const updatedAt=new Date().toISOString();
    const cleaned={site:SITE_ID,actorUid:uid,zone,updatedAt,
     date:String(draft.date||'').slice(0,10),auditor:String(draft.auditor||'').slice(0,140),
     entries:draft.entries.map(x=>({category:String(x.category||'').slice(0,100),
      question:String(x.question||'').slice(0,300),result:x.result,
      note:String(x.note||'').slice(0,1500)}))};
    await doc.update(new firebase.firestore.FieldPath('auditDraftsByUser',uid,zone),cleaned);
    respond({updatedAt});return;
   }
   if(msg.type==='draftRemove'){
    if(!zone||zone.length>100)throw Error('Lieu d’audit invalide.');
    await doc.update(new firebase.firestore.FieldPath('auditDraftsByUser',uid,zone),
      firebase.firestore.FieldValue.delete());
    respond({removed:true});return;
   }
   if(msg.type==='save'){
    const a=msg.payload||{};
    if(a.site!==SITE_ID||!Array.isArray(a.entries)||(a.entries.length!==10||a.entries.some(x=>!['ok','nc','na'].includes(x.result)))||typeof a.zone!=='string'||!a.zone.trim()||a.zone.length>100||!a.auditor||!/^\d{4}-\d{2}-\d{2}$/.test(a.date))throw Error('Audit incomplet ou établissement incorrect.');
    if(JSON.stringify(a).length>18000)throw Error('Les observations dépassent la taille autorisée.');
    const uid=firebase.auth().currentUser.uid;
    const savedAt=new Date().toISOString();
    const record={id:uid+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),savedAt,site:SITE_ID,actorUid:uid,actorName:currentUserProfile.name||currentUserProfile.email||'',date:a.date,auditor:a.auditor,zone:a.zone,entries:a.entries.map(x=>({category:String(x.category||'').slice(0,100),question:String(x.question||'').slice(0,300),result:x.result,note:String(x.note||'').slice(0,1500)})),progress:10,score:a.score,nonConformities:a.nonConformities,status:a.status};
    let linkedCount=0;
    await cloudDb.runTransaction(async tx=>{
     const snap=await tx.get(doc),data=snap.data()||{};
     const audits=Array.isArray(data.auditsRecords)?data.auditsRecords:[];
     const correctives=Array.isArray(data.correctiveActionsRecords)?data.correctiveActionsRecords:[];
     let maxRef=correctives.reduce((n,x)=>Math.max(n,parseInt(String(x.reference||'').replace('AC-',''))||0),0);
     const newActions=[];
     record.entries.forEach((entry,i)=>{
      if(entry.result!=='nc')return;
      const sourceId=record.id+':'+i;
      if(correctives.some(c=>c.source==='Audit HACCP'&&c.sourceId===sourceId))return;
      const when=savedAt,reference='AC-'+String(++maxRef).padStart(4,'0');
      newActions.push({id:record.id+'-nc-'+i,reference,site:SITE_ID,createdAt:when,actorUid:uid,
       severity:'majeure',zone:record.zone,source:'Audit HACCP',sourceId,auditId:record.id,
       problem:('Audit HACCP : '+entry.question+(entry.note?' — '+entry.note:'')).slice(0,900),
       immediate:'',measure:'Définir les mesures appropriées et contrôler leur efficacité.',
       owner:record.auditor,deadline:'',status:'Ouverte',
       events:[{at:when,by:record.auditor,action:'Création depuis Audit HACCP',note:'Non-conformité numéro '+(i+1)+' de l’audit '+record.id}]});
     });
     linkedCount=newActions.length;
     tx.set(doc,{auditsRecords:[...audits,record],correctiveActionsRecords:[...correctives,...newActions]},{merge:true});
    });
    respond({id:record.id,savedAt,linkedActions:linkedCount});if(linkedCount>0)setTimeout(()=>{if(typeof window.mtOpenCorrectivesTest==='function'&&document.querySelector('.mt-audits-iframe'))window.mtOpenCorrectivesTest()},900);return;
   }
   throw Error('Action inconnue.');
  }catch(err){respond(null,err&&err.message||'Erreur Firebase inconnue.');}
 });
})();
</script>

<script id="mt-correctives-test-bridge">
(function(){
window.mtOpenCorrectivesTest=function(){
 if(typeof SITE_ID==='undefined'||SITE_ID==='main'){alert('Compte établissement requis.');return}
 if(typeof CURRENT_VIEW!=='undefined')CURRENT_VIEW='correctives-test';
 document.body.classList.remove('on-home','mt-premium-active','on-login');
 const root=document.getElementById('app');if(!root)return;
 root.innerHTML='<section class="mt-ac-view"><button class="btn back" onclick="home()">← Accueil</button><h1>Actions correctives HACCP</h1><iframe class="mt-ac-frame" title="Actions correctives" scrolling="no" src="actions-correctives-module-test.html?v=8-autoheight"></iframe></section>';
 const frame=root.querySelector('.mt-ac-frame');
 const resetScroll=()=>{window.scrollTo({top:0,left:0,behavior:'instant'});document.documentElement.scrollTop=0;document.body.scrollTop=0;if(frame){try{frame.contentWindow.scrollTo(0,0)}catch(_){}}};
 if(frame)frame.addEventListener('load',()=>{resetScroll();requestAnimationFrame(resetScroll)},{once:true});
 resetScroll();requestAnimationFrame(resetScroll);
};
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||typeof e.data.mtCorrectivesHeight!=='number')return;const f=document.querySelector('.mt-ac-frame');if(f&&e.source===f.contentWindow)f.style.height=Math.max(300,e.data.mtCorrectivesHeight+4)+'px'});
window.addEventListener('message',async e=>{
 if(e.origin!==location.origin||!e.data||e.data.mtCorrectives!==true)return;
 const frame=document.querySelector('.mt-ac-frame');if(!frame||e.source!==frame.contentWindow)return;
 const m=e.data,reply=(result,error)=>e.source.postMessage({mtCorrectivesResponse:true,id:m.id,result,error},e.origin);
 try{
  if(!cloudDb||!firebase.auth().currentUser||!currentUserProfile||currentUserProfile.site!==SITE_ID||SITE_ID==='main'||currentUserProfile.active===false)throw Error('Compte établissement non autorisé.');
  const uid=firebase.auth().currentUser.uid,actor=currentUserProfile.name||currentUserProfile.email||uid,ref=cloudDb.collection('appState').doc(SITE_ID);
  if(m.type==='context'){reply({site:SITE_ID,name:siteDisplayName||SITE_ID,uid,actor:actor,canClose:['responsable','haccp'].includes(currentUserProfile.role)});return}
  if(m.type==='list'){
   // Reconcile pest follow-up sheets into the central corrective-action register.
   // Each pest sheet has a stable sourceId so repeat visits never create duplicates.
   let listed=[];
   await cloudDb.runTransaction(async tx=>{
    const snap=await tx.get(ref),data=snap.data()||{};
    const records=Array.isArray(data.correctiveActionsRecords)?data.correctiveActionsRecords.slice():[];
    const followups=Array.isArray(data.pest?.followups)?data.pest.followups:[];
    const linked=new Set(records.filter(x=>x.source==='Lutte contre les nuisibles').map(x=>String(x.sourceId||'')));
    let number=records.reduce((n,x)=>Math.max(n,parseInt(String(x.reference||'').replace('AC-',''))||0),0);
    let additions=0;
    for(const f of followups){
     if(!f||!f.id||!String(f.description||f.title||'').trim()||linked.has(String(f.id)))continue;
     const severity=String(f.severity||'Mineure').toLowerCase();
     const status=['Ouverte','En cours','Clôturée'].includes(f.status)?f.status:'Ouverte';
     const createdAt=f.createdAt||new Date().toISOString(),reference='AC-'+String(++number).padStart(4,'0');
     records.push({
      id:'pest-'+String(f.id),reference,site:SITE_ID,source:'Lutte contre les nuisibles',
      sourceId:String(f.id),sourceReference:String(f.reference||''),createdAt,
      severity:['mineure','majeure','critique'].includes(severity)?severity:'mineure',
      zone:String(f.zone||'Zone non précisée').slice(0,100),
      problem:String(f.description||f.title).slice(0,900),
      immediate:String(f.immediate||'').slice(0,900),
      measure:String(f.corrective||'').slice(0,900),
      owner:String(f.owner||'').slice(0,120),deadline:String(f.due||'').slice(0,10),
      status,actorUid:String(f.actorUid||uid),
      events:[{at:createdAt,by:String(f.createdBy||f.operator||actor),action:'Import de la fiche nuisibles',note:'Fiche liée : '+String(f.reference||f.id)}]
     });
     linked.add(String(f.id));additions++;
    }
    if(additions)tx.set(ref,{correctiveActionsRecords:records},{merge:true});
    listed=records;
   });
   reply(listed);return;
  }
  if(m.type==='create'){
   const a=m.payload||{};
   if(!['mineure','majeure','critique'].includes(a.severity)||!a.problem||a.problem.length>900||!a.zone||!a.source||(a.severity==='critique'&&!a.immediate)||JSON.stringify(a).length>5000)throw Error('Informations manquantes ou invalides.');
   let saved;
   await cloudDb.runTransaction(async tx=>{
    const snap=await tx.get(ref),records=snap.data()?.correctiveActionsRecords||[];
    const dupe=records.find(x=>x.status!=='Clôturée'&&x.zone===a.zone&&x.source===a.source&&x.problem.trim().toLowerCase()===a.problem.trim().toLowerCase());
    if(dupe)throw Error('Action déjà ouverte : '+dupe.reference);
    const number=1+records.reduce((n,x)=>Math.max(n,parseInt(String(x.reference||'').replace('AC-',''))||0),0);
    const when=new Date().toISOString();
    saved={id:uid+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),reference:'AC-'+String(number).padStart(4,'0'),site:SITE_ID,createdAt:when,actorUid:uid,
     severity:a.severity,zone:a.zone,source:a.source,problem:String(a.problem).slice(0,900),immediate:String(a.immediate||'').slice(0,900),
     measure:String(a.measure||'').slice(0,900),owner:String(a.owner||'').slice(0,120),deadline:String(a.deadline||'').slice(0,10),status:'Ouverte',
     events:[{at:when,by:actor,action:'Création',note:a.severity==='critique'?'Alerte critique créée immédiatement':'Déclaration confirmée'}]};
    tx.set(ref,{correctiveActionsRecords:[...records,saved]},{merge:true});
   });
   reply({id:saved.id,reference:saved.reference});return;
  }

    tx.set(ref,{correctiveActionsRecords:records},{merge:true});
   });reply({updated:true});return;
  }

  const uid=firebase.auth().currentUser?.uid;
  if(!uid)return;
  const prior=document.getElementById('mtReceptionCorrectiveSheet');if(prior)prior.remove();
  const overlay=document.createElement('div');overlay.id='mtReceptionCorrectiveSheet';
  overlay.style='position:fixed;inset:0;z-index:999998;background:#10241f99;overflow:auto;padding:12px';
  const card=document.createElement('section');card.style='position:relative;background:#fff;max-width:760px;margin:3vh auto;padding:22px;border-radius:15px;box-shadow:0 14px 40px #0003;color:#143d30';
  const heading=document.createElement('h2');heading.textContent='Non-conformité '+kind+' — Action corrective';
  const details=document.createElement('p');details.textContent=(x.product||x.zone||'Contrôle')+' · '+reason+' · '+(x.receivedBy||x.operator||'Opérateur non renseigné');
  const label=(t,el)=>{const l=document.createElement('label');l.textContent=t;l.style='display:block;margin:14px 0 5px;font-weight:600';card.append(l,el)};
  const severity=document.createElement('select');[['mineure','Mineure'],['majeure','Majeure'],['critique','Critique — intervention urgente']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;severity.append(o)});severity.value='majeure';
  const checks=document.createElement('div');checks.style='padding:10px;border:1px solid #d5e5db;border-radius:10px';
  const options=kind==='Réception'?['Isoler les produits concernés','Refuser la marchandise non conforme','Contrôler la température des produits','Informer le responsable HACCP','Contacter le fournisseur','Vérifier DLC et emballages','Organiser le retour de la marchandise','Enregistrer une nouvelle vérification']:kind==='Stock et DLC'?['Isoler le lot concerné','Bloquer l’utilisation du produit','Contrôler la DLC / DDM et le numéro de lot','Vérifier les conditions de stockage','Informer le responsable HACCP','Évaluer et documenter le devenir du produit','Retirer les produits non conformes selon la procédure','Effectuer un nouveau contrôle du stock']:['Réaliser un nouveau nettoyage','Désinfecter la zone ou équipement','Isoler la zone non conforme','Informer le responsable HACCP','Vérifier les produits et matériels utilisés','Effectuer un nouveau contrôle'];
  const measureRows=[];
  options.forEach(t=>{const row=document.createElement('div');row.style='display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0';const check=document.createElement('input');check.type='checkbox';check.style='width:18px;height:18px;flex:0 0 18px';const title=document.createElement('span');title.textContent=t;title.style='flex:1 1 210px';const state=document.createElement('select');state.style='width:auto;min-width:120px';[['a_faire','À faire'],['realisee','Réalisée']].forEach(([v,txt])=>{const op=document.createElement('option');op.value=v;op.textContent=txt;state.append(op)});state.disabled=true;check.onchange=()=>state.disabled=!check.checked;row.append(check,title,state);checks.append(row);measureRows.push({t,check,state})});
  const selectBar=document.createElement('div');selectBar.style='display:flex;justify-content:flex-end;margin:0 0 9px';
  const selectAll=document.createElement('button');selectAll.type='button';selectAll.style='padding:7px 12px;border:1px solid #9dc7b6;background:#edf7f2;color:#075e46;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer';
  const syncSelectAll=()=>{selectAll.textContent=measureRows.every(r=>r.check.checked)?'Tout désélectionner':'Sélectionner tous'};
  selectAll.onclick=()=>{const shouldSelect=!measureRows.every(r=>r.check.checked);measureRows.forEach(r=>{r.check.checked=shouldSelect;r.state.disabled=!shouldSelect});syncSelectAll()};
  measureRows.forEach(r=>r.check.addEventListener('change',syncSelectAll));syncSelectAll();selectBar.append(selectAll);checks.prepend(selectBar);
  const note=document.createElement('textarea');note.value=x.stockProblem||x.observation||x.note||'';note.placeholder='Observation complémentaire, produit et lot concernés';note.rows=3;
  const owner=document.createElement('input');owner.value=x.receivedBy||x.operator||'';owner.placeholder='Nom du responsable';
  const deadline=document.createElement('input');deadline.type='date';
  const status=document.createElement('p');status.setAttribute('role','status');
  const actions=document.createElement('div');actions.style='display:flex;flex-wrap:wrap;gap:8px;margin-top:14px';
  const close=document.createElement('button');close.textContent='Fermer sans créer';close.type='button';close.onclick=()=>overlay.remove();
  const submit=document.createElement('button');submit.textContent='Créer l’action corrective';submit.type='button';submit.style='background:#087657;color:white';

  const dismiss=document.createElement('button');dismiss.textContent='×';dismiss.title='Fermer';dismiss.setAttribute('aria-label','Fermer');dismiss.style='position:absolute;top:10px;right:12px;padding:6px 12px;font-size:23px;border:0;background:#eef5ef;border-radius:50%';dismiss.onclick=()=>overlay.remove();
  card.append(dismiss,heading,details);label('Gravité évaluée',severity);label('Mesures de prise en charge (Réalisée / À faire)',checks);label('Observations libres',note);label('Responsable désigné',owner);label('Échéance',deadline);card.append(status,actions);overlay.append(card);document.body.append(overlay);
  submit.onclick=async()=>{
   const selected=measureRows.filter(r=>r.check.checked).map(r=>(r.state.value==='realisee'?'[Réalisée] ':'[À faire] ')+r.t);
   if(!selected.length&&!note.value.trim()){status.textContent='Sélectionnez une mesure ou indiquez une observation.';return}

   submit.disabled=true;status.textContent='Enregistrement en cours…';
   try{await createLinkedAction({severity:severity.value,immediate:text,owner:owner.value.trim(),deadline:deadline.value});status.textContent='Action corrective enregistrée dans Firebase.';submit.textContent='Ouvrir Actions correctives';submit.disabled=false;submit.onclick=()=>{overlay.remove();window.mtOpenCorrectivesTest()}}catch(e){status.textContent='Enregistrement impossible : '+e.message;submit.disabled=false}
  };
  async function createLinkedAction(form){
   let outcome='';
   await cloudDb.runTransaction(async tx=>{
    const ref=cloudDb.collection('appState').doc(SITE_ID),snap=await tx.get(ref);
    const rows=Array.isArray(snap.data()?.correctiveActionsRecords)?snap.data().correctiveActionsRecords:[];

      immediate:form.immediate.slice(0,900),measure:'Définir les mesures de maîtrise adaptées et vérifier leur efficacité.',

   });

  }

})();

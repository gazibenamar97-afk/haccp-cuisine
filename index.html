<style>
:root{--ink:#17251f;--muted:#52615a;--line:#c7d2cc;--bg:#f3f7f5;--card:#fff;--active:#e2ece7;--accent:#2e6a50;--danger:#9e4545}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}nav{height:88px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:5}
.brand{font-size:25px;font-weight:900;margin-right:12px;white-space:nowrap}.tab{border:0;background:transparent;color:#35433d;padding:18px 20px;border-radius:14px;font-size:18px;cursor:pointer}.tab:hover,.tab.active{background:var(--active);font-weight:800;color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:32px 26px 60px}h1{font-size:29px;margin:0 0 20px}h2{font-size:21px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric,.panel{background:var(--card);border:2px solid var(--line);border-radius:15px;padding:16px}.metric span{color:var(--muted)}.metric.clickable{cursor:pointer;transition:.15s}.metric.clickable:hover{background:var(--active);border-color:#aabbb2;transform:translateY(-1px)}.dash-lock{position:relative;min-height:420px}.dash-blur{filter:blur(8px);pointer-events:none;user-select:none}.dash-gate{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;z-index:3}.dash-gate-card{width:min(480px,92%);background:#fff;border:2px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 12px 35px rgba(23,37,31,.14);text-align:center}.dash-gate-card input{text-align:center;font-size:22px;letter-spacing:5px}.metric b{display:block;font-size:38px;margin-top:8px}
.panel{margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:17px;font-size:17px;text-align:left;cursor:pointer}.btn:hover{background:var(--active);border-color:#aabbb2}.primary{background:var(--accent);color:white;border-color:var(--accent);text-align:center;font-weight:800}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.back{margin-bottom:15px;width:auto;padding:11px 16px}label{display:block;margin:14px 0 6px;color:#39473f}input,select,textarea{width:100%;padding:15px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#edf5f1;border:2px solid #c6d9cf;border-radius:14px;padding:20px;text-align:center;font-size:24px;font-weight:900;margin:16px 0}.note{font-size:13px;color:var(--muted);line-height:1.45}.record{padding:13px 0;border-bottom:1px solid #d9e1dd}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar>div{min-width:250px}.empty{color:var(--muted);margin:22px 0}
@media(max-width:850px){nav{height:auto;overflow-x:auto;padding:10px}.brand{font-size:20px}.tab{white-space:nowrap;padding:14px}.cards,.grid{grid-template-columns:1fr 1fr}main{padding:22px 15px}}
@media(max-width:520px){.cards,.grid,.row{grid-template-columns:1fr}}
@media print{nav,.back,.print-hide{display:none}main{padding:0}.panel{border:0}}
</style><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body>

app=document.getElementById('app');
const S=JSON.parse(localStorage.getItem('haccpV3')||'{"stock":[],"temps":[],"clean":[],"trace":[],"equipment":[{"name":"Frigo 1","min":0,"max":4},{"name":"Congélateur 1","min":-24,"max":-18}]}');
if(!Array.isArray(S.suppliers))S.suppliers=[];S.suppliers=S.suppliers.map(s=>typeof s==='string'?{name:s,phone:'',plate:'',driver:''}:s);
function save(){localStorage.setItem('haccpV3',JSON.stringify(S))}
function B(t,f,c=''){return `<button class="btn ${c}" onclick="${f}">${t}</button>`}
function authorizeStockEdit(i){let pin=localStorage.getItem('haccpAdminPin');if(!pin){alert('Aucun code PIN administrateur n’est configuré. Allez dans Paramètres → Sécurité pour le créer.');settings();return}let entered=prompt('Code PIN Responsable / Administrateur :');if(entered===null)return;if(entered!==pin){alert('Code PIN incorrect. Modification refusée.');return}editStock(i)}
function dashboard(){if(sessionStorage.getItem('haccpDashboardUnlocked')==='1'){renderDashboard();return}let hasPin=!!localStorage.getItem('haccpAdminPin');app.innerHTML=`<h1>Tableau de bord Direction 🔒</h1><div class="dash-lock"><div class="dash-blur"><div class="cards"><div class="metric"><span>Produits en stock</span><b>8</b></div><div class="metric"><span>Alertes DLC</span><b>2</b></div><div class="metric"><span>Non-conformités</span><b>1</b></div></div><div class="panel"><h2>Points à surveiller</h2><div class="record">Informations réservées à la Direction</div></div></div><div class="dash-gate"><div class="dash-gate-card"><h2>Accès Direction</h2><p class="note">Ce tableau de bord est réservé au propriétaire, à la direction générale et aux personnes autorisées.</p>${hasPin?'<label>Code PIN administrateur</label><input id="dashboardPin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" onkeydown="if(event.key===\'Enter\')unlockDashboard()"><br><br>'+B('Déverrouiller le tableau de bord','unlockDashboard()','primary'):'<p><b>Aucun code PIN administrateur n’est encore configuré.</b></p><p class="note">Créez-le dans Paramètres → Sécurité.</p>'+B('Aller aux Paramètres','settings()','primary')}</div></div></div>`}

function unlockDashboard(){let pin=localStorage.getItem('haccpAdminPin'),entered=(document.getElementById('dashboardPin')||{}).value||'';if(!pin){settings();return}if(entered!==pin){alert('Code PIN incorrect. Accès refusé.');return}sessionStorage.setItem('haccpDashboardUnlocked','1');renderDashboard()}
function lockDashboard(){sessionStorage.removeItem('haccpDashboardUnlocked');dashboard()}
function renderDashboard(){let today=new Date();today.setHours(0,0,0,0);let exp=0,soon=0,dlcToday=0;S.stock.forEach(x=>{if(!x.dlc)return;let d=new Date(x.dlc+'T00:00:00'),diff=Math.ceil((d-today)/86400000);if(diff<0)exp++;else if(diff===0)dlcToday++;else if(diff<=3)soon++});let tempNC=S.temps.filter(x=>!x.ok).length,packNC=S.stock.filter(x=>x.pack==='Non conforme').length,mods=S.trace.filter(x=>x.type==='Modification réception'),recent=S.trace.slice(0,10);let totalNC=tempNC+packNC;app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1>Tableau de bord Direction</h1><button class="btn" style="width:auto;padding:10px 14px" onclick="lockDashboard()">🔒 Verrouiller</button></div><p class="note">Vue synthétique pour le propriétaire, la direction générale et le responsable HACCP. Cliquez sur un indicateur pour voir le détail.</p><div class="cards"><div class="metric clickable" onclick="dashboardDetail('stock')"><span>Produits en stock</span><b>${S.stock.length}</b><span>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('dlc')"><span>Alertes DLC</span><b>${exp+dlcToday+soon}</b><span>${exp} expiré(s) · ${dlcToday} aujourd'hui · ${soon} sous 3 jours<br>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('nc')"><span>Non-conformités</span><b>${totalNC}</b><span>${tempNC} température(s) · ${packNC} réception(s)<br>Voir le détail →</span></div></div><div class="cards" style="margin-top:14px"><div class="metric clickable" onclick="dashboardDetail('receptions')"><span>Réceptions enregistrées</span><b>${S.stock.length}</b><span>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('temps')"><span>Contrôles température</span><b>${S.temps.length}</b><span>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('clean')"><span>Nettoyages enregistrés</span><b>${S.clean.length}</b><span>Voir le détail →</span></div></div><div class="panel clickable" onclick="dashboardDetail('watch')"><h2>⚠️ Points à surveiller</h2>${exp?'<div class="record"><b>'+exp+' produit(s) avec DLC dépassée</b><br><span class="note">Action de contrôle requise.</span></div>':''}${tempNC?'<div class="record"><b>'+tempNC+' relevé(s) de température non conforme(s)</b><br><span class="note">À vérifier dans les contrôles de température.</span></div>':''}${packNC?'<div class="record"><b>'+packNC+' réception(s) avec emballage non conforme</b><br><span class="note">Consulter la traçabilité et les motifs enregistrés.</span></div>':''}${!totalNC&&!exp?'<p class="empty">Aucune alerte critique enregistrée actuellement.</p>':''}<span class="note">Voir tous les points à surveiller →</span></div><div class="panel"><h2>Supervision HACCP</h2><div class="grid">${B('Réceptions & stock','stock()')}${B('Températures','temperatures()')}${B('Nettoyage','cleaning()')}${B('Traçabilité complète','trace()')}${B('Fournisseurs','suppliers()')}${B('Paramètres & sécurité','settings()')}</div></div><div class="panel clickable" onclick="dashboardDetail('mods')"><h2>Modifications des réceptions</h2><div class="metric"><span>Corrections enregistrées</span><b>${mods.length}</b></div>${mods.length?mods.slice(0,5).map(x=>`<div class="record"><b>${esc(x.product||'Article')}</b> — ${esc(x.date||'')}<br><span class="note">Par : ${esc(x.modifiedBy||'—')} · Motif : ${esc(x.reason||'—')}</span></div>`).join(''):'<p class="empty">Aucune modification enregistrée.</p>'}</div><div class="panel clickable" onclick="dashboardDetail('activity')"><h2>Dernières activités</h2>${recent.length?recent.map(x=>`<div class="record"><b>${esc(x.type||'Opération')}</b> — ${esc(x.date||'')}<br><span class="note">${esc(x.product||x.equipment||'')}</span></div>`).join(''):'<p class="empty">Aucune activité enregistrée.</p>'}</div>`}

function dashboardDetail(type){if(sessionStorage.getItem('haccpDashboardUnlocked')!=='1'){dashboard();return}let back=B('← Tableau de bord','dashboard()','back'),title='',intro='',rows='';let now=new Date();now.setHours(0,0,0,0);
 if(type==='stock'){title='Produits en stock';intro='Liste des produits issus des réceptions enregistrées.';rows=S.stock.map(x=>`<div class="record"><b>${esc(x.product)}</b><br><span class="note">Catégorie : ${esc(x.category||'—')} · Fournisseur : ${esc(x.supplier||'—')} · Lot : ${esc(x.lot||'—')} · DLC : ${esc(x.dlc||'—')}</span></div>`).join('')}
 if(type==='dlc'){title='Alertes DLC';intro='Produits dont la DLC est dépassée, arrive aujourd’hui ou dans les 3 prochains jours.';rows=S.stock.filter(x=>{if(!x.dlc)return false;let d=new Date(x.dlc+'T00:00:00'),n=Math.ceil((d-now)/86400000);return n<=3}).map(x=>{let d=new Date(x.dlc+'T00:00:00'),n=Math.ceil((d-now)/86400000),s=n<0?'EXPIRÉE':n===0?'AUJOURD’HUI':'Dans '+n+' jour(s)';return `<div class="record"><b>${esc(x.product)} — ${s}</b><br><span class="note">DLC : ${esc(x.dlc)} · Lot : ${esc(x.lot||'—')} · Fournisseur : ${esc(x.supplier||'—')}</span></div>`}).join('')}
 if(type==='nc'||type==='watch'){title=type==='nc'?'Non-conformités':'Points à surveiller';intro=type==='nc'?'Détail des contrôles enregistrés comme non conformes.':'Alertes qui nécessitent l’attention de la direction ou du responsable HACCP.';let a=[];S.temps.filter(x=>!x.ok).forEach(x=>a.push(`<div class="record"><b>Température non conforme — ${esc(x.equipment)}</b><br><span class="note">${esc(x.value)} °C · ${esc(x.date||'')} · Opérateur : ${esc(x.operator||'—')}</span></div>`));S.stock.filter(x=>x.pack==='Non conforme').forEach(x=>a.push(`<div class="record"><b>Réception non conforme — ${esc(x.product)}</b><br><span class="note">Motif : ${esc(x.nonConformityReason||'—')} · Fournisseur : ${esc(x.supplier||'—')}</span></div>`));if(type==='watch')S.stock.filter(x=>x.dlc&&new Date(x.dlc+'T00:00:00')<now).forEach(x=>a.push(`<div class="record"><b>DLC dépassée — ${esc(x.product)}</b><br><span class="note">DLC : ${esc(x.dlc)} · Lot : ${esc(x.lot||'—')}</span></div>`));rows=a.join('')}
 if(type==='receptions'){title='Réceptions enregistrées';intro='Historique synthétique des marchandises réceptionnées.';rows=S.stock.map(x=>`<div class="record"><b>${esc(x.product)}</b> — ${esc(x.date||'')}<br><span class="note">Fournisseur : ${esc(x.supplier||'—')} · Lot : ${esc(x.lot||'—')} · Emballage : ${esc(x.pack||'—')}</span></div>`).join('')}
 if(type==='temps'){title='Contrôles de température';intro='Tous les relevés de température avec leur statut de conformité.';rows=S.temps.map(x=>`<div class="record"><b>${esc(x.equipment)} — ${esc(x.value)} °C — ${x.ok?'Conforme':'NON CONFORME'}</b><br><span class="note">${esc(x.date||'')} · Opérateur : ${esc(x.operator||'—')}</span></div>`).join('')}

function detectQuantity(text){
 let raw=(text||'').replace(/,/g,'.'),lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 const unit='(kg|kgs|g|gr|grammes?|mg|l|litres?|ml|cl)';
 const explicit=new RegExp('(?:poids\\s*(?:net)?|net\\s*weight|contenance|quantit[eé]|volume|الوزن\\s*الصافي|السعة)\\s*[:.-]?\\s*(\\d+(?:\\.\\d+)?)\\s*'+unit,'i');
 for(let line of lines){let m=line.match(explicit);if(m)return normalizeQty(m[1],m[2])}
 let candidates=[];
 lines.forEach((line,i)=>{
   if(/valeurs?\s*nutrition|nutrition|pour\s*100|per\s*100|لكل\s*100|القيمة\s*الغذائية/i.test(line))return;
   let rx=new RegExp('\\b(\\d+(?:\\.\\d+)?)\\s*'+unit+'\\b','ig'),m;
   while((m=rx.exec(line))){
     let val=parseFloat(m[1]),u=m[2].toLowerCase(),score=1;
     if(/litre|poids|net|contenance|volume|سعة|لتر/i.test(line))score+=6;
     if((u==='l'||/^litre/.test(u))&&val>=0.2)score+=4;
     if(u==='kg'&&val>=0.1)score+=3;
     if((u==='ml'||u==='cl')&&val===100)score-=6;
     candidates.push({q:normalizeQty(m[1],m[2]),score});
   }

  y=+y;mo=+mo;d=+d;if(y<100)y+=2000;if(y<2020||y>2045||mo<1||mo>12||d<1||d>31)return;

  let iso=String(y)+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');

 };
 let m,rx1=/(\d{1,2})\s*[\.\/-]\s*(\d{1,2})\s*[\.\/-]\s*(\d{2,4})/g;
 while((m=rx1.exec(cleaned)))add(m[3],m[2],m[1],m[0]);
 let rx2=/(20\d{2})\s*[\.\/-]\s*(\d{1,2})\s*[\.\/-]\s*(\d{1,2})/g;
 while((m=rx2.exec(cleaned)))add(m[1],m[2],m[3],m[0]);

 return out;
}

async function preprocessOCRImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
   const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
   const d=ctx.getImageData(0,0,cv.width,cv.height),p=d.data;
   // grayscale + stronger contrast helps dot-matrix dates and small printed text
   for(let i=0;i<p.length;i+=4){
    let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];
    g=(g-128)*1.65+128; g=Math.max(0,Math.min(255,g));
    p[i]=p[i+1]=p[i+2]=g;
   }
   ctx.putImageData(d,0,0);URL.revokeObjectURL(url);resolve(cv);
  };img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};img.src=url;
 });
}
async function makeRotatedOCRVariants(file){
 return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let arr=[];[90,-90].forEach(deg=>{let cv=document.createElement('canvas'),swap=Math.abs(deg)===90;cv.width=swap?img.height:img.width;cv.height=swap?img.width:img.height;let x=cv.getContext('2d');x.translate(cv.width/2,cv.height/2);x.rotate(deg*Math.PI/180);x.drawImage(img,-img.width/2,-img.height/2);arr.push(cv)});URL.revokeObjectURL(url);resolve(arr)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};img.src=url})
}
async function makeDateOCRVariants(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const scale=Math.min(2,2200/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
   const base=document.createElement('canvas');base.width=w;base.height=h;let b=base.getContext('2d');b.drawImage(img,0,0,w,h);
   let src=b.getImageData(0,0,w,h),arr=[];
   [105,135,165,195].forEach(th=>{
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d'),d=x.createImageData(w,h);
    for(let i=0;i<src.data.length;i+=4){let g=.299*src.data[i]+.587*src.data[i+1]+.114*src.data[i+2],v=g<th?0:255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
    x.putImageData(d,0,0);arr.push(cv);
   });
   URL.revokeObjectURL(url);resolve(arr);
  };img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};img.src=url;
 });
}
function mergeDateCandidates(texts){
 let map={},now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),min=new Date(today);min.setFullYear(min.getFullYear()-5);let max=new Date(today);max.setFullYear(max.getFullYear()+5);
 texts.forEach(t=>extractDateCandidates(t).forEach(d=>{let dt=new Date(d.iso+'T12:00:00');if(isNaN(dt)||dt<min||dt>max)return;map[d.iso]=map[d.iso]||{...d,hits:0};map[d.iso].hits++}));
 return Object.values(map).map(d=>({...d,confidence:d.hits>=2?'forte':'à confirmer'})).sort((a,b)=>b.hits-a.hits||a.iso.localeCompare(b.iso));
}

 autoDates.filled.forEach(x=>{if(!found.includes(x))found.push(x)});
 let info=document.getElementById('detectedInfo');
 if(info)info.innerHTML='<b>Moteur actuel : Tesseract OCR.</b><br><b>Analyse globale de '+receptionPhotoCount+' photo(s) :</b> '+(found.length?found.join(', '):'aucune donnée suffisamment certaine')+'.';
 n.innerHTML='<b>Analyse terminée.</b> <button class="btn" type="button" style="padding:8px 12px;margin-top:8px" onclick="document.getElementById(\'cameraPhoto\').click()">📷 Prendre une autre photo</button>';

async function analyzeLabelFile(file,index,total){
 let n=document.getElementById('scanStatus');if(!file)return;
 window.currentReceptionLabel=file;
 if(typeof Tesseract==='undefined'){n.innerHTML='<b>OCR indisponible.</b> Utilisez la saisie manuelle.';return}
 try{
  receptionPhotoCount++;rphotos.value=receptionPhotoCount;
  n.innerHTML='<b>Analyse photo '+(index||receptionPhotoCount)+' / '+(total||1)+'…</b>';
  rocr.value='Analyse en cours…';
  // Arabic + French + English. The language data is downloaded by Tesseract in the browser.
  const enhanced=await preprocessOCRImage(file);
  const opts={logger:m=>{if(m.status==='recognizing text'&&m.progress)n.innerHTML='<b>Lecture OCR :</b> '+Math.round(m.progress*100)+' %'}};
  const result=await Tesseract.recognize(file,'ara+fra+eng',opts);
  n.innerHTML='<b>Deuxième lecture optimisée…</b>';
  const result2=await Tesseract.recognize(enhanced,'ara+fra+eng');
  let texts=[result.data.text||'',result2.data.text||''];
  // Extra rotated readings: expiry stamps are frequently printed vertically or sideways.
  const rotated=await makeRotatedOCRVariants(file);
  for(let r=0;r<rotated.length;r++){const rr=await Tesseract.recognize(rotated[r],'eng');texts.push(rr.data.text||'')}
  // Dedicated pass for stamped/dot-matrix dates. Multiple thresholds recover faint broken digits.
  n.innerHTML='<b>Recherche renforcée des dates…</b>';
  const variants=await makeDateOCRVariants(file);
  for(let k=0;k<variants.length;k++){
    const dr=await Tesseract.recognize(variants[k],'eng');
    texts.push(dr.data.text||'');
  }
  const text=texts.join('\n');receptionScanTexts.push(text);
  let found=fillFromOCR(text);
  const allReceptionTexts=receptionScanTexts.flatMap(t=>[t]),autoDates=autoFillReceptionDates(allReceptionTexts),dc=autoDates.cands;
  showDateCandidates(dc,autoDates);
  autoDates.filled.forEach(x=>{if(!found.includes(x))found.push(x+' remplie automatiquement')});
  // Only ask for manual confirmation when the OCR could not safely assign all detected dates.
  if((!autoDates.fab||!autoDates.dlc)&&dc.length){showDateCandidates(dc);if(!found.some(x=>x.includes('date(s)')))found.push(dc.length+' date(s) à confirmer')}
  else{let box=document.getElementById('dateCandidates');if(box)box.innerHTML='<div class="note"><b>Dates placées automatiquement.</b> Vérifiez-les avec la photo avant validation.</div>'}
  if(!autoDates.fab&&autoDates.dlc){detectedInfo.innerHTML='<b>DLC détectée, mais date de fabrication non reconnue.</b> Photographiez de plus près la zone FAB / MFG / production.'}
  if(autoDates.fab&&!autoDates.dlc){detectedInfo.innerHTML='<b>Date de fabrication détectée, mais DLC non reconnue.</b> Photographiez de plus près la zone DLC / EXP.'}
  rocr.value=Math.round(Math.max(result.data.confidence||0,result2.data.confidence||0))+' %';
  detectedInfo.innerHTML='<b>Photo '+receptionPhotoCount+' :</b> '+(found.length?'détecté : '+found.join(', '):'aucune donnée HACCP suffisamment certaine. Les cases restent vides.')+'<br>Vous pouvez scanner une autre face du même emballage.';
  n.innerHTML='<b>Photo '+(index||receptionPhotoCount)+' analysée.</b>';
 }catch(e){rocr.value='Échec de lecture';n.innerHTML='<b>Lecture impossible.</b> Reprenez une photo nette ou utilisez la saisie manuelle.'}
}

function dlcCats(){app.innerHTML='<h1>Étiquetage HACCP</h1><div class="panel"><h2>Créer une étiquette interne</h2><p>Choisissez une catégorie.</p><div class="grid">'+Object.keys(LABEL_CAT).map(function(c){return '<button type="button" class="btn" onclick="dlcSubsByName(this)" data-name="'+encodeURIComponent(c)+'">'+c+'</button>'}).join('')+'</div><p class="note" style="margin-top:16px">Cette rubrique est réservée aux produits préparés, ouverts ou déconditionnés nécessitant une étiquette interne. Les produits fermés conservent la DLC / DDM du fabricant.</p></div>'}
function dlcSubsByName(el){C=decodeURIComponent(el.getAttribute('data-name'));let subs=Object.keys(LABEL_CAT[C]);app.innerHTML='<button class="btn back" onclick="dlcCats()">← Catégories</button><h1>'+C+'</h1><div class="panel"><div class="grid">'+subs.map(function(s){return '<button type="button" class="btn" onclick="dlcProductsByName(this)" data-name="'+encodeURIComponent(s)+'">'+s+'</button>'}).join('')+'</div></div>'}
function dlcProductsByName(el){SUB=decodeURIComponent(el.getAttribute('data-name'));let products=LABEL_CAT[C][SUB];app.innerHTML='<button class="btn back" onclick="dlcSubsByCurrent()">← Sous-catégories</button><h1>'+SUB+'</h1><div class="panel"><div class="grid">'+products.map(function(p,i){return '<button type="button" class="btn" onclick="ticket('+i+')">'+p[0]+'</button>'}).join('')+'</div></div>'}
function dlcSubsByCurrent(){let subs=Object.keys(LABEL_CAT[C]);app.innerHTML='<button class="btn back" onclick="dlcCats()">← Catégories</button><h1>'+C+'</h1><div class="panel"><div class="grid">'+subs.map(function(s){return '<button type="button" class="btn" onclick="dlcProductsByName(this)" data-name="'+encodeURIComponent(s)+'">'+s+'</button>'}).join('')+'</div></div>'}
function dlcProductsCurrent(){let products=LABEL_CAT[C][SUB];app.innerHTML='<button class="btn back" onclick="dlcSubsByCurrent()">← Sous-catégories</button><h1>'+SUB+'</h1><div class="panel"><div class="grid">'+products.map(function(p,i){return '<button type="button" class="btn" onclick="ticket('+i+')">'+p[0]+'</button>'}).join('')+'</div></div>'}
function ticket(i){let item=LABEL_CAT[C][SUB][i];P=item[0];DAYS=item[1];let now=new Date();let date=now.toISOString().slice(0,10);let time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');app.innerHTML='<button class="btn back print-hide" onclick="dlcProductsCurrent()">← Produits</button><h1>Étiquette HACCP</h1><div class="panel"><h2>'+P+'</h2><div class="row print-hide"><div><label>Type d’opération</label><select id="labelAction" onchange="calcLabel()"><option>Préparation</option><option>Ouverture</option><option>Déconditionnement</option></select></div><div><label>Quantité (facultatif)</label><input id="labelQty" oninput="calcLabel()" placeholder="Ex. 2,5 kg"></div></div><div class="row print-hide"><div><label>Date</label><input id="labelDate" type="date" value="'+date+'" onchange="calcLabel()"></div><div><label>Heure</label><input id="labelTime" type="time" value="'+time+'" onchange="calcLabel()"></div></div><div class="row print-hide"><div><label>Durée interne</label><input value="'+DAYS+' jour(s)" disabled></div><div><label>Emplacement</label><input id="labelStorage" oninput="calcLabel()" placeholder="Ex. Frigo 1"></div></div><div class="row print-hide"><div><label>Opérateur</label><input id="labelOperator" oninput="calcLabel()"></div><div><label>Lot interne (facultatif)</label><input id="labelLot" oninput="calcLabel()"></div></div><h2 class="print-hide">Aperçu</h2><div id="labelPreview" style="width:60mm;min-height:40mm;margin:12px auto;border:2px solid #17251f;padding:4mm;background:white;color:#111;font-family:Arial,sans-serif"></div><div class="row print-hide"><button class="btn primary" onclick="saveLabel(true)">Imprimer l’étiquette</button><button class="btn" onclick="saveLabel(false)">Enregistrer sans imprimer</button></div></div>';calcLabel()}
function calcLabel(){let d=document.getElementById('labelDate');if(!d)return;let exp=new Date(d.value+'T12:00:00');exp.setDate(exp.getDate()+Number(DAYS||0));outDate=exp.toLocaleDateString('fr-FR');let v=function(id){let e=document.getElementById(id);return e?e.value:''};document.getElementById('labelPreview').innerHTML='<div style="font-size:15px;font-weight:900;text-align:center;border-bottom:1px solid #111;padding-bottom:3px">'+P+'</div><div style="font-size:11px;margin-top:4px">Opération : '+v('labelAction')+'</div><div style="font-size:11px">Date : '+new Date(d.value+'T12:00:00').toLocaleDateString('fr-FR')+' · '+v('labelTime')+'</div><div style="font-size:15px;font-weight:900;margin:5px 0">À consommer avant : '+outDate+'</div>'+(v('labelQty')?'<div style="font-size:11px">Quantité : '+v('labelQty')+'</div>':'')+(v('labelStorage')?'<div style="font-size:11px">Stockage : '+v('labelStorage')+'</div>':'')+(v('labelLot')?'<div style="font-size:11px">Lot : '+v('labelLot')+'</div>':'')+(v('labelOperator')?'<div style="font-size:11px">Opérateur : '+v('labelOperator')+'</div>':'')}
function saveLabel(printIt){let v=function(id){let e=document.getElementById(id);return e?e.value:''};S.trace.unshift({type:'Étiquette HACCP',product:P,category:C,subCategory:SUB,action:v('labelAction'),quantity:v('labelQty'),preparedAt:v('labelDate')+' '+v('labelTime'),dlc:outDate,storage:v('labelStorage'),operator:v('labelOperator'),lot:v('labelLot'),date:new Date().toLocaleString('fr-FR')});save();if(printIt){window.print()}else{alert('Étiquette enregistrée dans la traçabilité.');dlcCats()}}

reception();
</script></body></html>

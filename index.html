el><input id="cpTemp" type="number" step="0.1" value="'+esc(String(x&&x.maxTemp!=null?x.maxTemp:''))+'"></div><div><label>Unité habituelle</label><select id="cpUnit">'+['kg','pièce','L','carton'].map(v=>'<option '+(x&&x.unit===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div><label>Note / précision</label><textarea id="cpNote">'+esc(x&&x.note?x.note:'')+'</textarea><p class="note">L’identifiant interne du produit reste stable même si son nom change.</p><button class="btn primary" onclick="saveCatalogueProductById(\''+encodeURIComponent(id)+'\')">Enregistrer le produit</button></div>'}

function saveCatalogueProductById(eid){let id=decodeURIComponent(eid||''),old=id?findCatalogueProductById(id):null,name=document.getElementById('cpName').value.trim(),cat=document.getElementById('cpCat').value,sub=document.getElementById('cpSub').value;if(!name||!cat||!sub){alert('Nom, catégorie et sous-catégorie sont obligatoires.');return}let duplicate=allCatalogueItems().some(x=>x.id!==id&&x.category===cat&&x.name.toLowerCase()===name.toLowerCase());if(duplicate){alert('Ce produit existe déjà dans cette catégorie.');return}let data={name:name,category:cat,subCategory:sub,dlcDays:Number(document.getElementById('cpDays').value)||0,maxTemp:document.getElementById('cpTemp').value===''?null:Number(document.getElementById('cpTemp').value),unit:document.getElementById('cpUnit').value,note:document.getElementById('cpNote').value.trim(),active:true};if(!id){data.id=customProductId();S.customProducts.push(data)}else if(id.startsWith('base:')){S.productOverrides[id]=data}else{let i=S.customProducts.findIndex(x=>x.id===id);if(i>=0)S.customProducts[i]=Object.assign({},S.customProducts[i],data)}if(old&&(old.name!==name||old.category!==cat)){let photo=localStorage.getItem(customPhotoKey(old.category,old.name));if(photo){localStorage.setItem(customPhotoKey(cat,name),photo);localStorage.removeItem(customPhotoKey(old.category,old.name))}}save();productPhotoManager()}
function productWasUsed(x){return (S.stock||[]).some(r=>r.product===x.name||r.prod===x.name||r.p===x.name)||(S.trace||[]).some(r=>JSON.stringify(r).includes(x.name))}
function deleteCatalogueProductById(eid){let id=decodeURIComponent(eid),x=findCatalogueProductById(id);if(!x)return;let used=productWasUsed(x),choice=prompt('Que voulez-vous faire avec « '+x.name+' » ?\n\n1 = Désactiver le produit\n2 = Supprimer définitivement'+(used?' (indisponible : historique existant)':'')+'\n0 = Annuler','1');if(choice===null||choice==='0'||choice==='')return;if(choice==='1'){if(id.startsWith('base:'))S.disabledBaseProducts[id]=true;else{let i=S.customProducts.findIndex(p=>p.id===id);if(i>=0)S.customProducts[i].active=false}save();productPhotoManager();return}if(choice==='2'){if(used){alert('Suppression définitive impossible : ce produit possède déjà un historique HACCP. Vous pouvez uniquement le désactiver.');return}if(!confirm('Supprimer définitivement « '+x.name+' » ? Cette action est irréversible.'))return;if(id.startsWith('base:')){S.disabledBaseProducts[id]=true}else{let i=S.customProducts.findIndex(p=>p.id===id);if(i>=0)S.customProducts.splice(i,1)}localStorage.removeItem(customPhotoKey(x.category,x.name));save();productPhotoManager();return}alert('Choisissez 1 pour désactiver, 2 pour supprimer ou 0 pour annuler.')}

 let cat=decodeURIComponent(ec),p=decodeURIComponent(ep),file=input.files&&input.files[0];if(!file)return;

const RECEIVING_TEMP_RULES={
 'Viande hachée':{max:2,label:'≤ +2 °C'},'Merguez':{max:4,label:'≤ +4 °C'},'Kefta':{max:4,label:'≤ +4 °C'}
};
function receivingTempRule(cat,prod){
 if(RECEIVING_TEMP_RULES[prod])return RECEIVING_TEMP_RULES[prod];
 if(cat==='Viandes'){
   if(/Foie|Cœur|Rognons|Tripes/i.test(prod))return {max:3,label:'≤ +3 °C'};
   return {max:7,label:'≤ +7 °C'};
 }
 if(cat==='Volailles')return {max:4,label:'≤ +4 °C'};
 if(cat==='Poissons & fruits de mer')return {max:2,label:'proche de la glace fondante (cible 0 à +2 °C)'};
 if(cat==='Surgelés')return {max:-18,label:'≤ -18 °C'};
 if(['Produits laitiers','Œufs & ovoproduits','Charcuterie'].includes(cat))return {max:5,label:'≤ +5 °C (référence générale réception réfrigérée)'};
 return null;
}
function checkReceivingTemp(){
 let el=document.getElementById('rt'),box=document.getElementById('tempCheck');if(!el||!box)return true;
 let rule=receivingTempRule(rc.value,rp.value),v=parseFloat(String(el.value).replace(',','.'));
 if(!rule){box.innerHTML=el.value?'<span class="note">Pas de recommandation automatique pour ce produit : vérifier l’étiquette fabricant / cahier des charges.</span>':'';el.style.borderColor='';return true}
 if(!el.value||Number.isNaN(v)){box.innerHTML='<div style="padding:10px;border:1px solid #c9d7cf;background:#f5faf7;border-radius:10px"><b>Température recommandée : '+rule.label+'</b><br><span class="note">Saisissez manuellement la température mesurée à la réception.</span></div>';el.style.borderColor='';return true}
 let ok=v<=rule.max;el.style.borderColor=ok?'#2e6a50':'#b42318';
 box.innerHTML=ok?'<div style="padding:10px;border:2px solid #2e6a50;background:#e8f5ed;color:#20543e;border-radius:10px"><b>✓ Conforme à la température recommandée</b><br>Température saisie : '+v+' °C · Recommandation : '+rule.label+'</div>':'<div style="padding:12px;border:2px solid #b42318;background:#fde8e8;color:#8a1c13;border-radius:10px"><b>⚠ ALERTE — Température supérieure à la recommandation</b><br>Température saisie : '+v+' °C · Température recommandée : '+rule.label+'<br><b>Indiquez l’action prise dans Observation avant de valider.</b></div>';
 return ok;
}

   if(/valeurs?\s*nutrition|nutrition|pour\s*100|per\s*100|لكل\s*100|القيمة\s*الغذائية/i.test(line))return;
   let rx=new RegExp('\\b(\\d+(?:\\.\\d+)?)\\s*'+unit+'\\b','ig'),m;

async function preprocessOCRImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
   const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);

   // grayscale + stronger contrast helps dot-matrix dates and small printed text
   for(let i=0;i<p.length;i+=4){
    let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];
    g=(g-128)*1.65+128; g=Math.max(0,Math.min(255,g));
    p[i]=p[i+1]=p[i+2]=g;
   }
   ctx.putImageData(d,0,0);URL.revokeObjectURL(url);resolve(cv);
  };img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};img.src=url;

}
async function makeRotatedOCRVariants(file){

async function makeDateOCRVariants(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const scale=Math.min(2,2200/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
   const base=document.createElement('canvas');base.width=w;base.height=h;let b=base.getContext('2d');b.drawImage(img,0,0,w,h);

    const cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d'),d=x.createImageData(w,h);
    for(let i=0;i<src.data.length;i+=4){let g=.299*src.data[i]+.587*src.data[i+1]+.114*src.data[i+2],v=g<th?0:255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}

function labelAutoRule(product,action){
 let r=LABEL_AUTO_RULES.find(x=>x.re.test(product||''));
 if(!r)return {days:7,temp:'≤ +5 °C',basis:'Plafond automatique par défaut pour préparation réfrigérée prête à consommer; à réduire si le plan HACCP, le procédé ou le fabricant l’exige',manufacturer:false};
 return r;
}

function applyLabelAutoRule(){
 let a=document.getElementById('labelAction'),r=labelAutoRule(P,a?a.value:'Préparation'),days=document.getElementById('labelDays'),temp=document.getElementById('labelTemp'),note=document.getElementById('labelRuleNote');
 DAYS=r.days;
 let suggestion=document.getElementById('labelSuggestion');
 if(days){days.value='';days.placeholder='Nombre de jours'}
 if(suggestion)suggestion.innerHTML=r.manual?'⚠ Durée à définir selon une procédure HACCP validée.':('Conseil : à consommer de préférence sous <b>'+r.days+' jour'+(r.days>1?'s':'')+'</b>.');
 if(temp)temp.value=r.temp||'';
 if(note)note.innerHTML=r.basis+(r.manufacturer?' — <b>instruction fabricant prioritaire</b>':'');
 calcLabel();
}
function calcLabel(){
 let d=document.getElementById('labelDate'),days=document.getElementById('labelDays');if(!d||!days)return;
 let n=Number(days.value),has=days.value!==''&&Number.isFinite(n)&&n>=0;
 let exp=new Date(d.value+'T12:00:00');if(has)exp.setDate(exp.getDate()+n);
 outDate=has?exp.toLocaleDateString('fr-FR'):'À définir';
 let alertBox=document.getElementById('labelDlcAlert');
 if(alertBox){
   if(!has){alertBox.style.display='none';}
   else if(DAYS>0&&n>DAYS){
     alertBox.style.display='block';alertBox.style.background='#fde8e8';alertBox.style.border='2px solid #b42318';alertBox.style.color='#8a1c13';
     alertBox.innerHTML='⚠ ALERTE — La durée saisie ('+n+' jour'+(n>1?'s':'')+') dépasse la recommandation HACCP ('+DAYS+' jour'+(DAYS>1?'s':'')+'). Durée conseillée : '+DAYS+' jour'+(DAYS>1?'s':'')+'.';
   }else{
     alertBox.style.display='block';alertBox.style.background='#e8f5ed';alertBox.style.border='2px solid #2e6a50';alertBox.style.color='#20543e';
     alertBox.innerHTML='✓ Conforme à la recommandation HACCP.';
   }
 }
 let v=id=>{let e=document.getElementById(id);return e?e.value:''};
 document.getElementById('labelPreview').innerHTML='<div style="font-size:15px;font-weight:900;text-align:center;border-bottom:1px solid #111;padding-bottom:3px">'+P+'</div>'+
 '<div style="font-size:11px;margin-top:4px">Opération : '+v('labelAction')+'</div>'+
 '<div style="font-size:11px">Date : '+new Date(d.value+'T12:00:00').toLocaleDateString('fr-FR')+' · '+v('labelTime')+'</div>'+
 '<div style="font-size:15px;font-weight:900;margin:5px 0">À consommer avant : '+outDate+'</div>'+
 (v('labelTemp')?'<div style="font-size:11px">Conservation : '+v('labelTemp')+'</div>':'')+
 (v('labelStorage')?'<div style="font-size:11px">Emplacement : '+v('labelStorage')+'</div>':'')+

 let v=id=>{let e=document.getElementById(id);return e?e.value:''};

function reception(){let cats=Object.keys(CAT).map(c=>`<option value="${c}">`).join('');app.innerHTML=`<h1>Réception</h1><div class="panel"><h2>Mode de saisie</h2><div class="row"><button class="btn primary" type="button" onclick="document.getElementById('labelPhoto').click()">📷 Scanner une étiquette</button><button class="btn" type="button" onclick="enableManualReception()">✍️ Saisie manuelle</button></div><input id="labelPhoto" type="file" accept="image/*" capture="environment" style="display:none" onchange="analyzeLabel(this)"><div class="note" style="margin-top:8px">Vous pouvez prendre plusieurs photos du même produit (face, dessus, côté). Les informations détectées sont regroupées sans remplacer une valeur déjà trouvée.</div><div id="scanStatus" class="note" style="margin-top:10px">Choisissez la photo de l’étiquette pour préremplir les champs, ou utilisez la saisie manuelle.</div></div><div class="panel"><div class="row"><div><label>Catégorie</label><input id="rc" list="categories-reception" placeholder="Choisir ou saisir une catégorie" onchange="updateReceptionProducts()" oninput="updateReceptionProducts()"><datalist id="categories-reception">${cats}</datalist><div class="note">Choisissez d'abord une catégorie.</div></div><div><label>Produit</label><input id="rp" list="produits-reception" placeholder="Choisir un produit" disabled><datalist id="produits-reception"></datalist><div id="rpnote" class="note">Les produits proposés dépendront automatiquement de la catégorie choisie.</div></div></div><div class="row"><div><label>Marque / fabricant</label><input id="rbrand" placeholder="Détecté sur l’étiquette ou saisie manuelle"></div><div><label>Quantité / poids</label><input id="rqty" placeholder="Ex. 5 kg"></div></div><div class="row"><div><label>Fournisseur</label><input id="rf" list="fournisseurs-reception" placeholder="Choisir un fournisseur enregistré"><datalist id="fournisseurs-reception">${S.suppliers.map(s=>`<option value="${typeof s==='string'?s:s.name}">`).join('')}</datalist><div class="note">Les fournisseurs se gèrent dans la rubrique « Fournisseurs ».</div></div><div><label>Lot</label><input id="rl"></div></div><div class="row"><div><label>Température °C</label><input id="rt" type="number" step=".1"></div><div><label>Date fabrication / conditionnement</label><input id="rfab" type="date"></div></div><div class="row"><div><label>DLC fabricant</label><input id="rd" type="date"></div><div><label>Code-barres <b>(obligatoire)</b></label><input id="rbarcode" inputmode="numeric" autocomplete="off" placeholder="À saisir manuellement" required><div class="note">Le code-barres n’est jamais rempli par l’OCR. Vérifiez les chiffres sur l’emballage.</div></div></div><div class="row"><div><label>Lecture OCR</label><input id="rocr" readonly placeholder="Aucune lecture effectuée"></div><div><label>Photos analysées</label><input id="rphotos" readonly value="0"></div></div><div id="detectedInfo" class="note" style="margin-top:10px"></div><div id="dateCandidates" style="margin-top:10px"></div><label>État emballage</label><select id="re"><option>Conforme</option><option>Non conforme</option></select><label>Photo de l'étiquette</label><input type="file" accept="image/*" capture="environment"><br><br>${B('Enregistrer la réception','saveRec()','primary')}</div>`}

function enableManualReception(){let n=document.getElementById('scanStatus');if(n)n.textContent='Mode saisie manuelle : complétez les champs puis validez la réception.';}

let receptionScanTexts=[],receptionPhotoCount=0;
function normText(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').trim()}
function isoDate(v){let m=(v||'').match(/(\d{1,2})[\.\/-](\d{1,2})[\.\/-](\d{2,4})/);if(!m)return'';let y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
function detectProduct(text){
 let nt=normText(text),best=null;
 Object.entries(CAT).forEach(([cat,subs])=>Object.values(subs).forEach(arr=>arr.forEach(([p])=>{
  let np=normText(p),score=np.split(' ').filter(w=>w.length>2&&nt.includes(w)).length;
  if(np&&nt.includes(np))score+=5;if(!best||score>best.score)best={cat,p,score};
 })));
 // Conservative Tunisia-oriented aliases: only fill when an explicit product word is present.
 const aliases=[
  {rx:/\b(lait|milk)\b|حليب/i,cat:'Produits laitiers',p:'Lait frais'},
  {rx:/\b(yaourt|yogurt)\b|ياغورت/i,cat:'Produits laitiers',p:'Yaourt nature'},
  {rx:/\b(poulet|chicken)\b|دجاج/i,cat:'Volailles',p:'Poulet entier frais'},
  {rx:/\b(tomate|tomato)\b|طماطم/i,cat:'Fruits & légumes',p:'Tomate'}
 ];
 let a=aliases.find(x=>x.rx.test(text));if(a&&(!best||best.score<2))best={...a,score:3};
 return best&&best.score>=2?best:null;
}
function detectBarcode(text){
 let compact=(text||'').replace(/[\s\-]/g,'');
 let hits=compact.match(/\d{12,14}/g)||[];
 return hits.find(x=>x.length===13)||hits[0]||'';
}
function extractDateCandidates(text){
 // Handles 14/08/26, 14-08-26, 14.08.26 and common OCR spacing/noise around separators.
 let cleaned=(text||'').replace(/[|Il]/g,'1').replace(/[Oo]/g,'0').replace(/[,:;]/g,'.');
 let rx=/(\d{1,2})\s*(?:[\.\/-]|\s)\s*(\d{1,2})\s*(?:[\.\/-]|\s)\s*(\d{2,4})/g,m,out=[];
 while((m=rx.exec(cleaned))){let d=+m[1],mo=+m[2],ys=m[3],y=+ys;if(d<1||d>31||mo<1||mo>12)continue;if(ys.length===2)y=2000+y;if(y<2020||y>2040)continue;let raw=m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+'/'+String(y),iso=String(y)+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(!out.some(x=>x.iso===iso))out.push({raw,iso});}
 return out;
}
function showDateCandidates(cands){
 let box=document.getElementById('dateCandidates');if(!box)return;
 if(!cands.length){box.innerHTML='';return}
 box.innerHTML='<div class="panel" style="margin-top:8px"><b>Date(s) plausible(s) détectée(s)</b><div class="note">Les lectures incohérentes sont maintenant éliminées. Touchez uniquement une date que vous voyez réellement sur l’étiquette.</div>'+cands.map(d=>'<div class="row" style="margin-top:8px"><button type="button" class="btn" onclick="rd.value=\''+d.iso+'\'">DLC : '+d.raw+(d.hits?' · '+d.hits+' lecture(s)':'')+'</button><button type="button" class="btn" onclick="rfab.value=\''+d.iso+'\'">Fabrication : '+d.raw+'</button></div>').join('')+'</div>';
}
function fillFromOCR(text){
 let lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean),joined=lines.join(' ');
 let found=[];
 let prod=detectProduct(text);
 if(prod){if(!rc.value){rc.value=prod.cat;updateReceptionProducts()}if(!rp.value)rp.value=prod.p;found.push('Produit')}
 // Brand aliases are explicit, never guessed from an arbitrary line.
 if(!rbrand.value){
   if(/d[eé]lice|دليس/i.test(text)){rbrand.value='Délice';found.push('Marque')}
 }
 let lot=joined.match(/(?:\blot\b|batch|n[°ºo]?\s*lot|رقم\s*(?:الدفعة|التشغيلة))\s*[:#.-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})/i);
 if(lot&&!rl.value){rl.value=lot[1];found.push('Lot')}
 let qty=joined.match(/(?:poids\s*(?:net)?|net\s*weight|quantit[eé]|الوزن\s*الصافي)?\s*[:.-]?\s*(\d+(?:[.,]\d+)?)\s*(kg|g|gr|ml|cl|l|كغ|غ|مل|لتر)\b/i);
 if(qty&&!rqty.value){rqty.value=qty[1].replace(',','.')+' '+qty[2];found.push('Quantité')}
 let cands=extractDateCandidates(text);showDateCandidates(cands);
 let dlc=joined.match(/(?:\bdlc\b|date\s*limite|a\s*consommer|exp(?:iry)?|use\s*by|انتهاء|الصلاحية)[\s\S]{0,60}?(\d{1,2}\s*[\.\/-]\s*\d{1,2}\s*[\.\/-]\s*\d{2,4})/i);
 if(dlc&&!rd.value&&cands.length===1){rd.value=isoDate(dlc[1]);found.push('DLC')}
 let fab=joined.match(/(?:fab(?:rique|rication)?|production|conditionne|prod(?:uction)?\s*date|الإنتاج|الصنع)[\s\S]{0,60}?(\d{1,2}\s*[\.\/-]\s*\d{1,2}\s*[\.\/-]\s*\d{2,4})/i);
 if(fab&&!rfab.value&&cands.length===1){rfab.value=isoDate(fab[1]);found.push('Fabrication')}
 if(cands.length)found.push(cands.length+' date(s) à confirmer')

 return found;
}
async function preprocessOCRImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
   const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
   const d=ctx.getImageData(0,0,cv.width,cv.height),p=d.data;
   // grayscale + stronger contrast helps dot-matrix dates and small printed text
   for(let i=0;i<p.length;i+=4){
    let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];
    g=(g-128)*1.65+128; g=Math.max(0,Math.min(255,g));
    p[i]=p[i+1]=p[i+2]=g;
   }
   ctx.putImageData(d,0,0);URL.revokeObjectURL(url);resolve(cv);
  };img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};img.src=url;
 });
}
async function makeDateOCRVariants(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const scale=Math.min(2,2200/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
   const base=document.createElement('canvas');base.width=w;base.height=h;let b=base.getContext('2d');b.drawImage(img,0,0,w,h);
   let src=b.getImageData(0,0,w,h),arr=[];
   [105,135,165,195].forEach(th=>{
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d'),d=x.createImageData(w,h);
    for(let i=0;i<src.data.length;i+=4){let g=.299*src.data[i]+.587*src.data[i+1]+.114*src.data[i+2],v=g<th?0:255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
    x.putImageData(d,0,0);arr.push(cv);
   });
   URL.revokeObjectURL(url);resolve(arr);
  };img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};img.src=url;
 });
}
function mergeDateCandidates(texts){
 let map={};
 texts.forEach(t=>extractDateCandidates(t).forEach(d=>{map[d.iso]=map[d.iso]||{...d,hits:0};map[d.iso].hits++}));
 return Object.values(map).filter(d=>{let y=+d.iso.slice(0,4);return y>=2020&&y<=2040}).sort((a,b)=>b.hits-a.hits);
}
async function analyzeLabel(input){
 let n=document.getElementById('scanStatus');if(!input.files||!input.files[0])return;
 window.currentReceptionLabel=input.files[0];
 if(typeof Tesseract==='undefined'){n.innerHTML='<b>OCR indisponible.</b> Utilisez la saisie manuelle.';return}
 try{
  receptionPhotoCount++;rphotos.value=receptionPhotoCount;
  n.innerHTML='<b>Analyse de la photo '+receptionPhotoCount+'…</b>';
  rocr.value='Analyse en cours…';
  // Arabic + French + English. The language data is downloaded by Tesseract in the browser.
  const enhanced=await preprocessOCRImage(input.files[0]);
  const opts={logger:m=>{if(m.status==='recognizing text'&&m.progress)n.innerHTML='<b>Lecture OCR :</b> '+Math.round(m.progress*100)+' %'}};
  const result=await Tesseract.recognize(input.files[0],'ara+fra+eng',opts);
  n.innerHTML='<b>Deuxième lecture optimisée…</b>';
  const result2=await Tesseract.recognize(enhanced,'ara+fra+eng');
  let texts=[result.data.text||'',result2.data.text||''];
  // Dedicated pass for stamped/dot-matrix dates. Multiple thresholds recover faint broken digits.
  n.innerHTML='<b>Recherche renforcée des dates…</b>';
  const variants=await makeDateOCRVariants(input.files[0]);
  for(let k=0;k<variants.length;k++){
    const dr=await Tesseract.recognize(variants[k],'eng');
    texts.push(dr.data.text||'');
  }
  const text=texts.join('\n');receptionScanTexts.push(text);
  let found=fillFromOCR(text);
  const dc=mergeDateCandidates(texts);showDateCandidates(dc);
  if(dc.length&&!found.some(x=>x.includes('date(s)')))found.push(dc.length+' date(s) à confirmer');
  rocr.value=Math.round(Math.max(result.data.confidence||0,result2.data.confidence||0))+' %';
  detectedInfo.innerHTML='<b>Photo '+receptionPhotoCount+' :</b> '+(found.length?'détecté : '+found.join(', '):'aucune donnée HACCP suffisamment certaine. Les cases restent vides.')+'<br>Vous pouvez scanner une autre face du même emballage.';
  n.innerHTML='<b>Lecture terminée.</b> Vérifiez toutes les données avant validation. <button class="btn" type="button" style="padding:8px 12px;margin-top:8px" onclick="document.getElementById(\'labelPhoto\').click()">📷 Ajouter une autre photo</button>';
  input.value='';
 }catch(e){rocr.value='Échec de lecture';n.innerHTML='<b>Lecture impossible.</b> Reprenez une photo nette ou utilisez la saisie manuelle.'}
}
function updateReceptionProducts(){let cat=rc.value.trim(),list=document.getElementById('produits-reception'),input=document.getElementById('rp'),note=document.getElementById('rpnote');if(!CAT[cat]){list.innerHTML='';input.value='';input.disabled=true;input.placeholder='Choisir d’abord une catégorie';note.textContent='Sélectionnez une catégorie valide pour afficher ses produits.';return;}let products=[...new Set(Object.values(CAT[cat]).flatMap(a=>a.map(p=>p[0])))].sort();list.innerHTML=products.map(p=>`<option value="${p}">`).join('');input.disabled=false;input.value='';input.placeholder='Choisir ou saisir un produit';note.textContent=products.length+' suggestion(s) pour '+cat+'. Vous pouvez aussi saisir un autre produit.';}
function suppliers(){let rows=S.suppliers.map((s,i)=>{let x=typeof s==='string'?{name:s,phone:'',plate:'',driver:''}:s;return `<div class="record"><b>${x.name}</b><br><span class="note">Téléphone : ${x.phone||'—'} · Immatriculation véhicule : ${x.plate||'—'} · Livreur / chauffeur : ${x.driver||'—'}</span><br><button class="btn" style="margin-top:8px;padding:8px 12px" onclick="deleteSupplier(${i})">Supprimer</button></div>`}).join('');app.innerHTML=`<h1>Fournisseurs</h1><div class="panel"><h2>Ajouter un fournisseur</h2><div class="row"><div><label>Nom du fournisseur</label><input id="sname" placeholder="Nom / société"></div><div><label>Numéro de téléphone</label><input id="sphone" type="tel" placeholder="+216 ..."></div></div><div class="row"><div><label>Plaque d'immatriculation du camion / véhicule</label><input id="splate" placeholder="Ex. 123 TU 4567"></div><div><label>Nom du livreur / chauffeur</label><input id="sdriver" placeholder="Nom et prénom"></div></div><br>${B('Enregistrer le fournisseur','saveSupplier()','primary')}</div><div class="panel"><h2>Fournisseurs enregistrés</h2>${rows||'<p class="empty">Aucun fournisseur enregistré.</p>'}</div>`}

function saveSupplier(){let name=sname.value.trim(),phone=sphone.value.trim(),plate=splate.value.trim(),driver=sdriver.value.trim();if(!name){alert('Veuillez saisir le nom du fournisseur.');return;}S.suppliers.push({name,phone,plate,driver});save();suppliers()}

function deleteSupplier(i){if(confirm('Supprimer ce fournisseur ?')){S.suppliers.splice(i,1);save();suppliers()}}

function saveRec(){if(!rbarcode.value.trim()){alert('Le code-barres est obligatoire et doit être saisi manuellement.');rbarcode.focus();return;}let x={category:rc.value,product:rp.value,brand:rbrand.value,quantity:rqty.value,supplier:rf.value,lot:rl.value,temp:rt.value,fabrication:rfab.value,dlc:rd.value,barcode:rbarcode.value.trim(),pack:re.value,ocr:rocr.value,date:new Date().toLocaleDateString('fr-FR')};S.stock.unshift(x);S.trace.unshift({type:'Réception',...x});save();stock()}
function temperatures(){let opts=S.equipment.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');app.innerHTML=`<h1>Contrôle des températures</h1><div class="cards"><div class="metric"><span>Équipements</span><b>${S.equipment.length}</b></div><div class="metric"><span>Relevés</span><b>${S.temps.length}</b></div><div class="metric"><span>Non conformes</span><b>${S.temps.filter(x=>!x.ok).length}</b></div></div><div class="panel"><h2>Nouveau relevé</h2><div class="row"><div><label>Équipement</label><select id="te">${opts}</select></div><div><label>Température °C</label><input id="tv" type="number" step=".1"></div></div><label>Opérateur</label><input id="to">${B('Enregistrer','saveTemp()','primary')}<h2>Ajouter un équipement</h2><div class="row"><input id="en" placeholder="Nom : Frigo pâtisserie"><input id="emin" type="number" placeholder="Minimum °C"></div><input id="emax" type="number" placeholder="Maximum °C">${B('Ajouter l’équipement','addEq()')}</div>`}
function saveTemp(){let e=S.equipment[+te.value],v=+tv.value,ok=v>=e.min&&v<=e.max,x={equipment:e.name,value:v,ok,operator:to.value,date:new Date().toLocaleString('fr-FR')};S.temps.unshift(x);S.trace.unshift({type:'Température',...x});save();temperatures()}
function addEq(){if(!en.value)return;S.equipment.push({name:en.value,min:+emin.value,max:+emax.value});save();temperatures()}
function cleaning(){app.innerHTML=`<h1>Nettoyage</h1><div class="panel"><div class="row"><div><label>Zone / équipement</label><input id="cz" list="zones-haccp" placeholder="Choisir ou saisir une zone"><datalist id="zones-haccp"><option value="Cuisine principale"><option value="Cuisine chaude"><option value="Cuisine froide"><option value="Zone de préparation"><option value="Plan de travail"><option value="Plonge"><option value="Laverie vaisselle"><option value="Réserve sèche"><option value="Économat / magasin"><option value="Chambre froide positive"><option value="Chambre froide négative"><option value="Réfrigérateur"><option value="Congélateur"><option value="Vitrine réfrigérée"><option value="Zone de réception marchandises"><option value="Quai de réception"><option value="Pâtisserie"><option value="Boulangerie"><option value="Bar"><option value="Cafétéria"><option value="Buffet petit-déjeuner"><option value="Buffet chaud"><option value="Buffet froid"><option value="Salle de restaurant"><option value="Terrasse"><option value="Office / passe"><option value="Machine à café"><option value="Machine à glaçons"><option value="Lave-vaisselle"><option value="Hotte aspirante"><option value="Four"><option value="Friteuse"><option value="Grill / plancha"><option value="Sol cuisine"><option value="Murs cuisine"><option value="Poubelles / local déchets"><option value="Sanitaires personnel"><option value="Vestiaires personnel"></datalist><div class="note">Suggestions adaptées aux restaurants, cafétérias et hôtels. Vous pouvez aussi saisir une autre zone.</div></div><div><label>Opérateur</label><input id="co"></div></div><label>Action réalisée</label><select id="ca"><option>Nettoyage</option><option>Désinfection</option><option>Nettoyage + désinfection</option></select><label>Observation</label><textarea id="cn"></textarea>${B('Valider le nettoyage','saveClean()','primary')}</div>`}
function saveClean(){let x={zone:cz.value,operator:co.value,action:ca.value,note:cn.value,date:new Date().toLocaleString('fr-FR')};S.clean.unshift(x);S.trace.unshift({type:'Nettoyage',product:x.zone,date:x.date});save();cleaning()}
function trace(){app.innerHTML=`<h1>Traçabilité</h1><div class="cards"><div class="metric"><span>Réceptions</span><b>${S.stock.length}</b></div><div class="metric"><span>Températures</span><b>${S.temps.length}</b></div><div class="metric"><span>Nettoyages</span><b>${S.clean.length}</b></div></div><div class="panel">${S.trace.length?S.trace.map(x=>`<div class="record"><b>${x.type}</b> — ${x.date||''}<br><span class="note">${x.product||x.equipment||''}</span></div>`).join(''):'Aucune opération enregistrée.'}</div>`}
let C='',SUB='',P='',DAYS=0;
function dlcCats(){app.innerHTML=`<h1>Imprimer DLC</h1><div class="panel"><p>Choisissez une catégorie.</p><div class="grid">${Object.keys(CAT).map(c=>B(c,`dlcSubs(${JSON.stringify(c)})`)).join('')}</div></div>`}
function dlcSubs(c){C=c;app.innerHTML=B('← Catégories','dlcCats()','back')+`<h1>${c}</h1><div class="panel"><div class="grid">${Object.keys(CAT[c]).map(s=>B(s,`dlcProducts(${JSON.stringify(s)})`)).join('')}</div></div>`}
function dlcProducts(s){SUB=s;app.innerHTML=B('← Sous-catégories','dlcSubs(C)','back')+`<h1>${s}</h1><div class="panel"><div class="grid">${CAT[C][s].map((p,i)=>B(p[0],`ticket(${i})`)).join('')}</div></div>`}
function ticket(i){[P,DAYS]=CAT[C][SUB][i];app.innerHTML=B('← Produits','dlcProducts(SUB)','back')+`<h1>Étiquette DLC</h1><div class="panel"><h2>${P}</h2><div class="row"><div><label>Préparé / ouvert le</label><input id="dd" type="date" onchange="calc()"></div><div><label>Durée paramétrée</label><input value="${DAYS} jour(s)" disabled></div></div><div class="result">À CONSOMMER AVANT LE<br><span id="out">—</span></div><p class="note">Paramètre de démonstration à valider dans le plan HACCP. Pour un produit préemballé, la date et les conditions du fabricant priment.</p>${B('Imprimer l’étiquette','window.print()','primary print-hide')}</div>`;dd.value=new Date().toISOString().slice(0,10);calc()}
function calc(){let d=new Date(dd.value+'T12:00:00');d.setDate(d.getDate()+DAYS);out.textContent=d.toLocaleDateString('fr-FR')}
reception();
</script></body></html>

function dashboardActivityDetail(i){

 let fields=[];

  add('Fournisseur',x.supplier);
  add('Lot',x.lot);
  add('Observation / action',x.note||x.observation||x.action||x.correctiveAction);
 }
 app.innerHTML=back+'<h1>Fiche activité</h1><div class="panel"><h2>'+esc(x.type||'Opération')+'</h2>'+fields.join('')+'</div>'
}

function showEditSuggestions(kind){
 let input=document.getElementById(kind==='category'?'ec':'esupplier'),box=document.getElementById(kind==='category'?'ecSuggestions':'esupplierSuggestions');
 if(!input||!box)return;
 let values=kind==='category'?Object.keys(CAT):S.suppliers.map(s=>typeof s==='string'?s:s.name).filter(Boolean);
 let norm=v=>normalizeSearch(v);

async function analyzeLabelFile(file,index,total){
 let n=document.getElementById('scanStatus');if(!file)return;
 window.currentReceptionLabel=file;
 if(typeof Tesseract==='undefined'){n.innerHTML='<b>OCR indisponible.</b> Utilisez la saisie manuelle.';return}
 try{
  receptionPhotoCount++;rphotos.value=receptionPhotoCount;
  n.innerHTML='<b>Analyse photo '+(index||receptionPhotoCount)+' / '+(total||1)+'…</b>';
  rocr.value='Analyse en cours…';
  // Arabic + French + English. The language data is downloaded by Tesseract in the browser.
  const enhanced=await preprocessOCRImage(file);
  const opts={logger:m=>{if(m.status==='recognizing text'&&m.progress)n.innerHTML='<b>Lecture OCR :</b> '+Math.round(m.progress*100)+' %'}};
  const result=await Tesseract.recognize(file,'ara+fra+eng',opts);
  n.innerHTML='<b>Deuxième lecture optimisée…</b>';
  const result2=await Tesseract.recognize(enhanced,'ara+fra+eng');
  let texts=[result.data.text||'',result2.data.text||''];
  // Extra rotated readings: expiry stamps are frequently printed vertically or sideways.
  const rotated=await makeRotatedOCRVariants(file);
  for(let r=0;r<rotated.length;r++){const rr=await Tesseract.recognize(rotated[r],'eng');texts.push(rr.data.text||'')}
  // Dedicated pass for stamped/dot-matrix dates. Multiple thresholds recover faint broken digits.
  n.innerHTML='<b>Recherche renforcée des dates…</b>';
  const variants=await makeDateOCRVariants(file);
  for(let k=0;k<variants.length;k++){
    const dr=await Tesseract.recognize(variants[k],'eng');
    texts.push(dr.data.text||'');
  }
  const text=texts.join('\n');receptionScanTexts.push(text);
  let found=fillFromOCR(text);
  const allReceptionTexts=receptionScanTexts.flatMap(t=>[t]),autoDates=autoFillReceptionDates(allReceptionTexts),dc=autoDates.cands;
  showDateCandidates(dc,autoDates);
  autoDates.filled.forEach(x=>{if(!found.includes(x))found.push(x+' remplie automatiquement')});
  // Only ask for manual confirmation when the OCR could not safely assign all detected dates.
  if((!autoDates.fab||!autoDates.dlc)&&dc.length){showDateCandidates(dc);if(!found.some(x=>x.includes('date(s)')))found.push(dc.length+' date(s) à confirmer')}
  else{let box=document.getElementById('dateCandidates');if(box)box.innerHTML='<div class="note"><b>Dates placées automatiquement.</b> Vérifiez-les avec la photo avant validation.</div>'}
  if(!autoDates.fab&&autoDates.dlc){detectedInfo.innerHTML='<b>DLC détectée, mais date de fabrication non reconnue.</b> Photographiez de plus près la zone FAB / MFG / production.'}
  if(autoDates.fab&&!autoDates.dlc){detectedInfo.innerHTML='<b>Date de fabrication détectée, mais DLC non reconnue.</b> Photographiez de plus près la zone DLC / EXP.'}
  rocr.value=Math.round(Math.max(result.data.confidence||0,result2.data.confidence||0))+' %';
  detectedInfo.innerHTML='<b>Photo '+receptionPhotoCount+' :</b> '+(found.length?'détecté : '+found.join(', '):'aucune donnée HACCP suffisamment certaine. Les cases restent vides.')+'<br>Vous pouvez scanner une autre face du même emballage.';
  n.innerHTML='<b>Photo '+(index||receptionPhotoCount)+' analysée.</b>';
 }catch(e){rocr.value='Échec de lecture';n.innerHTML='<b>Lecture impossible.</b> Reprenez une photo nette ou utilisez la saisie manuelle.'}
}

 if(!isAdmin&&!isManager){settings();return}

 const listBox=document.getElementById('usersList');

async function migrateLegacyUser(btn){
 const st=document.getElementById('migrationStatus'),say=(m,bad)=>{if(st){st.textContent=m;st.style.color=bad?'#a12622':'#20543e'}};
 if(currentUserProfile?.site!=='main'){say('Réservé à l’administrateur.',true);return}
 const uid=document.getElementById('migrationOldUser')?.value||'',username=(document.getElementById('migrationUsername')?.value||'').trim().toLowerCase(),password=document.getElementById('migrationPassword')?.value||'';
 if(!uid||!/^[a-z0-9._-]{3,30}$/.test(username)||password.length<8){say('Choisissez le compte, un nom d’utilisateur valide et un mot de passe de 8 caractères minimum.',true);return}
 if(btn){btn.disabled=true;btn.textContent='Migration…'}
 let creator=null;
 try{
  const oldSnap=await cloudDb.collection('users').doc(uid).get();if(!oldSnap.exists)throw new Error('Ancien profil introuvable.');
  const old=oldSnap.data()||{},site=old.site;if(!site||site==='main')throw new Error('Compte non migrable.');
  const email=username+'@'+site+'.mt-haccp.local';
  try{creator=firebase.app('mtUserCreator')}catch(e){creator=firebase.initializeApp(FIREBASE_CONFIG,'mtUserCreator')}
  const cred=await creator.auth().createUserWithEmailAndPassword(email,password);
  const profile={...old,uid:cred.user.uid,username,email,active:true,migratedFrom:uid,migratedAt:new Date().toISOString(),updatedBy:currentUserProfile.uid};
  await cloudDb.collection('users').doc(cred.user.uid).set(profile);
  await cloudDb.collection('users').doc(uid).update({active:false,migratedTo:cred.user.uid,migratedAt:new Date().toISOString(),updatedBy:currentUserProfile.uid});
  await creator.auth().signOut();say('Migration réussie : '+username+' peut maintenant se connecter avec son nom d’utilisateur.',false);
  document.getElementById('migrationUsername').value='';document.getElementById('migrationPassword').value='';await loadMigrationUsers();await loadAppUsers();
 }catch(e){console.error('migrateLegacyUser',e);try{if(creator)await creator.auth().signOut()}catch(_e){}say('Migration impossible : '+(e.code||e.message||e),true)}
 finally{if(btn){btn.disabled=false;btn.textContent='Migrer le compte'}}
}
function canManageUserProfile(u){if(!currentUserProfile)return false;if(currentUserProfile.site==='main')return true;return currentUserProfile.role==='responsable'&&currentUserProfile.site===SITE_ID&&u.site===SITE_ID&&u.role!=='admin'&&u.uid!==currentUserProfile.uid}
async function createAppUser(btn){
 const status=document.getElementById('createUserStatus'),say=(m,bad)=>{if(status){status.textContent=m;status.style.color=bad?'#a12622':'#20543e'}};
 if(!cloudDb||!currentUserProfile){say('Service indisponible.',true);return}
 const isAdmin=currentUserProfile.site==='main',isManager=currentUserProfile.role==='responsable'&&currentUserProfile.site===SITE_ID;
 if(!isAdmin&&!isManager){say('Accès non autorisé.',true);return}
 const name=(userName.value||'').trim(),username=(userEmail.value||'').trim().toLowerCase(),password=userPassword.value||'';
 let role=userRole.value,site=isManager?SITE_ID:userSite.value;
 const usernameOk=/^[a-z0-9._-]{3,30}$/.test(username);
 const email=username+'@'+site+'.mt-haccp.local';
 if(isManager&&!['responsable','haccp','employe'].includes(role)){say('Rôle non autorisé.',true);return}
 if(!name||!usernameOk||password.length<8){say('Vérifiez le nom, le nom d’utilisateur (3 à 30 caractères) et le mot de passe (8 caractères minimum).',true);return}
 if(btn){btn.disabled=true;btn.textContent='Création…'}
 try{
  let creator;try{creator=firebase.app('mtUserCreator')}catch(e){creator=firebase.initializeApp(FIREBASE_CONFIG,'mtUserCreator')}
  const cred=await creator.auth().createUserWithEmailAndPassword(email,password);
  const profile={uid:cred.user.uid,name,username,email,role,site,active:true,createdAt:new Date().toISOString(),createdBy:currentUserProfile.uid||firebase.auth().currentUser?.uid||''};
  await cloudDb.collection('users').doc(cred.user.uid).set(profile);await creator.auth().signOut();
  say('Compte créé avec succès.',false);userName.value='';userEmail.value='';userPassword.value='';await loadOtherAppUsers();
 }catch(e){say('Création impossible : '+(e.code||e.message||e),true)}
 finally{if(btn){btn.disabled=false;btn.textContent='Créer le compte'}}
}
function renderManagedUsers(box,rows,adminMode){const roleLabel=r=>r==='responsable'?'Responsable établissement':r==='haccp'?'Responsable HACCP / Qualité':r==='employe'?'Employé':r==='admin'?'Administrateur':(r||'Rôle non défini');if(!rows.length){box.innerHTML='<div class="note" style="padding:12px 0">Aucun compte enregistré.</div>';return}box.innerHTML='<div class="note" style="padding:4px 0 10px"><b>'+rows.length+'</b> compte'+(rows.length>1?'s':'')+' enregistré'+(rows.length>1?'s':'')+'</div>'+rows.map(u=>'<div class="record" style="display:block!important;visibility:visible!important;opacity:1!important;padding:14px 0;border-top:1px solid #e3e9ef"><b>'+esc(u.name||u.username||u.email||'Utilisateur')+'</b><br><span class="note">'+esc(u.username||u.email||'')+' · '+esc(roleLabel(u.role))+' · '+(u.active===false?'Désactivé':'Actif')+'</span>'+(adminMode?'<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="width:auto" onclick="editSupervisionUser('+JSON.stringify(u.uid)+')">Modifier</button><button class="btn" style="width:auto" onclick="toggleSupervisionUser('+JSON.stringify(u.uid)+','+(u.active!==false)+')">'+(u.active===false?'Réactiver':'Désactiver')+'</button></div>':(canManageUserProfile(u)&&u.uid!==currentUserProfile.uid?'<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="width:auto" onclick="editAppUser('+JSON.stringify(u.uid)+')">Modifier</button><button class="btn" style="width:auto" onclick="toggleAppUser('+JSON.stringify(u.uid)+','+(u.active!==false)+')">'+(u.active===false?'Réactiver':'Désactiver')+'</button></div>':''))+'</div>').join('')}
async function loadAppUsers(){const box=document.getElementById('usersList');if(!box)return;box.innerHTML='<div class="note" style="padding:10px 0">Chargement des comptes…</div>';if(!cloudDb||!currentUserProfile){box.innerHTML='<div style="color:#9e4545">Service utilisateurs indisponible.</div>';return}const site=currentUserProfile.site;try{const snap=await cloudDb.collection('users').where('site','==',site).get();let rows=[];snap.forEach(d=>rows.push({...(d.data()||{}),uid:d.id}));if(!rows.some(u=>u.uid===currentUserProfile.uid))rows.unshift({...currentUserProfile});rows.sort((a,b)=>String(a.name||a.username||a.email||'').localeCompare(String(b.name||b.username||b.email||''),'fr'));renderManagedUsers(box,rows,false)}catch(err){console.error('loadAppUsers',err);try{const own=await cloudDb.collection('users').doc(currentUserProfile.uid).get();let rows=own.exists?[{...(own.data()||{}),uid:own.id}]:[{...currentUserProfile}];renderManagedUsers(box,rows,false);box.insertAdjacentHTML('afterbegin','<div style="padding:8px;margin-bottom:8px;color:#8b2f2f"><b>Liste partielle :</b> '+esc(err.code||err.message||String(err))+'</div>')}catch(e2){box.innerHTML='<div style="color:#8b2f2f"><b>Erreur de chargement :</b> '+esc(e2.code||e2.message||String(e2))+'</div>'}}}
async function editAppUser(uid){
 if(!cloudDb)return;const ref=cloudDb.collection('users').doc(uid),snap=await ref.get();if(!snap.exists)return;const u=snap.data()||{};if(!canManageUserProfile(u)){alert('Accès non autorisé.');return}

function applyEquipmentPreset(){
 let s=document.getElementById('equipmentPreset'),ideal=document.getElementById('equipmentPresetIdeal');
 if(!s||s.value===''){if(ideal)ideal.innerHTML='';checkEquipmentRange();return}
 let x=EQUIPMENT_PRESETS[Number(s.value)];
 if(!x)return;
 let base=x.name;
 let normalizeName=v=>String(v||'').trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 let normalizedBase=normalizeName(base),used=new Set();
 S.equipment.forEach(e=>{
  let normalized=normalizeName(e&&e.name);
  if(normalized===normalizedBase)used.add(1);
  if(normalized.indexOf(normalizedBase+' ')===0){
   let suffix=normalized.slice(normalizedBase.length+1);
   if(/^\d+$/.test(suffix))used.add(Number(suffix))
  }
 });
 let next=1;
 while(used.has(next))next++;
 document.getElementById('en').value=base+' '+next;
 document.getElementById('emin').value=x.min;
 document.getElementById('emax').value=x.max;
 if(ideal)ideal.innerHTML='<b>Température idéale : '+esc(x.min)+' °C à '+esc(x.max)+' °C</b>';
 checkEquipmentRange()
}

 name=name.trim().replace(/\s+/g,' ');
 if(!name){alert('Le nom de l’équipement est obligatoire.');document.getElementById('en').focus();return}
 if(!operator){alert('Le nom de l’opérateur est obligatoire.');document.getElementById('eqOperator').focus();return}
 if(min===''||max===''){alert('Les températures minimum et maximum sont obligatoires.');(min===''?document.getElementById('emin'):document.getElementById('emax')).focus();return}
 let minValue=Number(min),maxValue=Number(max);
 if(!Number.isFinite(minValue)||!Number.isFinite(maxValue)){alert('Saisissez des températures minimum et maximum valides.');return}

function labelAutoRule(product,action){
 let r=LABEL_AUTO_RULES.find(x=>x.re.test(product||''));
 if(!r)return {days:7,temp:'≤ +5 °C',basis:'Plafond automatique par défaut pour préparation réfrigérée prête à consommer; à réduire si le plan HACCP, le procédé ou le fabricant l’exige',manufacturer:false};
 return r;
}

function normalizeSearch(v){
 return String(v||'').toLocaleLowerCase('fr').replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')
}
function normalizeProductSearch(v){return normalizeSearch(v)}
function labelAllProducts(){
 let rows=[];
 Object.keys(LABEL_CAT).forEach(function(cat){
   Object.keys(LABEL_CAT[cat]).forEach(function(sub){
     LABEL_CAT[cat][sub].forEach(function(item,i){rows.push({cat:cat,sub:sub,item:item,index:i})})
   })
 });
 return rows
}
function labelProductsForCategory(cat){
 return labelAllProducts().filter(function(x){return x.cat===cat})
}

function applyLabelAutoRule(){
 let a=document.getElementById('labelAction'),r=labelAutoRule(P,a?a.value:'Préparation'),days=document.getElementById('labelDays'),temp=document.getElementById('labelTemp'),note=document.getElementById('labelRuleNote');
 DAYS=r.days;
 let suggestion=document.getElementById('labelSuggestion');
 if(days){days.value='';days.placeholder='Nombre de jours'}
 if(suggestion)suggestion.innerHTML=r.manual?'⚠ Durée à définir selon une procédure HACCP validée.':('Conseil : à consommer de préférence sous <b>'+r.days+' jour'+(r.days>1?'s':'')+'</b>.');
 if(temp)temp.value=r.temp||'';
 if(note)note.innerHTML=r.basis+(r.manufacturer?' — <b>instruction fabricant prioritaire</b>':'');
 calcLabel();
}
function calcLabel(){
 let d=document.getElementById('labelDate'),days=document.getElementById('labelDays');if(!d||!days)return;
 let n=Number(days.value),has=days.value!==''&&Number.isFinite(n)&&n>=0;
 let exp=new Date(d.value+'T12:00:00');if(has)exp.setDate(exp.getDate()+n);
 outDate=has?exp.toLocaleDateString('fr-FR'):'À définir';
 let alertBox=document.getElementById('labelDlcAlert');
 if(alertBox){
   if(!has){alertBox.style.display='none';}
   else if(DAYS>0&&n>DAYS){
     alertBox.style.display='block';alertBox.style.background='#fde8e8';alertBox.style.border='2px solid #b42318';alertBox.style.color='#8a1c13';
     alertBox.innerHTML='⚠ ALERTE — La durée saisie ('+n+' jour'+(n>1?'s':'')+') dépasse la recommandation HACCP ('+DAYS+' jour'+(DAYS>1?'s':'')+'). Durée conseillée : '+DAYS+' jour'+(DAYS>1?'s':'')+'.';
   }else{
     alertBox.style.display='block';alertBox.style.background='#e8f5ed';alertBox.style.border='2px solid #2e6a50';alertBox.style.color='#20543e';
     alertBox.innerHTML='✓ Conforme à la recommandation HACCP.';
   }
 }

 S.trace.unshift({type:'Étiquette HACCP',overRecommendation:overRecommendation,recommendedDays:DAYS,product:P,category:C,subCategory:SUB,action:v('labelAction'),preparedAt:v('labelDate')+' '+v('labelTime'),durationDays:Number(v('labelDays')),dlc:outDate,temperature:v('labelTemp'),storage:v('labelStorage'),operator:v('labelOperator'),manufacturerInstruction:v('labelManufacturer'),date:new Date().toLocaleString('fr-FR')});

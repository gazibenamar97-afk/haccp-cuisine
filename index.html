<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HACCP Cuisine</title>
<style>
:root{--ink:#17251f;--muted:#52615a;--line:#c7d2cc;--bg:#f3f7f5;--card:#fff;--active:#e2ece7;--accent:#2e6a50;--danger:#9e4545}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}nav{height:88px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:5}
.brand{font-size:25px;font-weight:900;margin-right:12px;white-space:nowrap}.tab{border:0;background:transparent;color:#35433d;padding:18px 20px;border-radius:14px;font-size:18px;cursor:pointer}.tab:hover,.tab.active{background:var(--active);font-weight:800;color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:32px 26px 60px}h1{font-size:29px;margin:0 0 20px}h2{font-size:21px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric,.panel{background:var(--card);border:2px solid var(--line);border-radius:15px;padding:16px}.metric span{color:var(--muted)}.metric.clickable{cursor:pointer;transition:.15s}.metric.clickable:hover{background:var(--active);border-color:#aabbb2;transform:translateY(-1px)}.metric b{display:block;font-size:38px;margin-top:8px}
.panel{margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:17px;font-size:17px;text-align:left;cursor:pointer}.btn:hover{background:var(--active);border-color:#aabbb2}.primary{background:var(--accent);color:white;border-color:var(--accent);text-align:center;font-weight:800}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.back{margin-bottom:15px;width:auto;padding:11px 16px}label{display:block;margin:14px 0 6px;color:#39473f}input,select,textarea{width:100%;padding:15px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#edf5f1;border:2px solid #c6d9cf;border-radius:14px;padding:20px;text-align:center;font-size:24px;font-weight:900;margin:16px 0}.note{font-size:13px;color:var(--muted);line-height:1.45}.record{padding:13px 0;border-bottom:1px solid #d9e1dd}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar>div{min-width:250px}.empty{color:var(--muted);margin:22px 0}
@media(max-width:850px){nav{height:auto;overflow-x:auto;padding:10px}.brand{font-size:20px}.tab{white-space:nowrap;padding:14px}.cards,.grid{grid-template-columns:1fr 1fr}main{padding:22px 15px}}
@media(max-width:520px){.cards,.grid,.row{grid-template-columns:1fr}}
@media print{nav,.back,.print-hide{display:none}main{padding:0}.panel{border:0}}
</style><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body>
<nav><div class="brand">HACCP Cuisine</div>
<button class="tab" onclick="dashboard()">Tableau de bord</button><button class="tab" onclick="reception()">Réception</button><button class="tab" onclick="stock()">Stock</button><button class="tab" onclick="temperatures()">Températures</button><button class="tab" onclick="dlcCats()">Imprimer DLC</button><button class="tab" onclick="cleaning()">Nettoyage</button><button class="tab" onclick="suppliers()">Fournisseurs</button><button class="tab" onclick="trace()">Traçabilité</button><button class="tab" onclick="settings()">Paramètres</button>
</nav><main><div id="app"></div></main>
<script>
const CAT={
"Viandes":{
"Bœuf":[["Bœuf frais",3],["Entrecôte de bœuf",3],["Faux-filet de bœuf",3],["Filet de bœuf",3],["Jarret de bœuf",3],["Foie de bœuf",3]],
"Veau":[["Veau frais",3],["Escalope de veau",3],["Foie de veau",3]],
"Agneau & mouton":[["Agneau frais",3],["Gigot d'agneau",3],["Épaule d'agneau",3],["Côtelettes d'agneau",3],["Mouton",3],["Foie d'agneau",3]],
"Abats":[["Foie",3],["Cœur",2],["Rognons",2],["Tripes",2]],
"Préparations de viande":[["Viande hachée",1],["Merguez",2],["Kefta",1]]
},
"Volailles":{
"Poulet":[["Poulet entier frais",2],["Escalope de poulet",2],["Blanc de poulet",2],["Cuisses de poulet",2],["Ailes de poulet",2],["Foie de poulet",2]],
"Dinde":[["Dinde fraîche",2],["Escalope de dinde",2],["Blanc de dinde",2],["Cuisses de dinde",2]],
"Canard & autres":[["Canard frais",2],["Caille",2]]
},
"Poissons & fruits de mer":{
"Poissons":[["Daurade",1],["Loup / Bar",1],["Rouget",1],["Sardine",1],["Maquereau",1],["Thon frais",1],["Espadon",1],["Mérou",1],["Sole",1],["Merlan",1],["Saumon frais",1],["Anchois frais",1]],
"Fruits de mer":[["Crevettes fraîches",1],["Calamars frais",1],["Poulpe frais",1],["Seiche",1],["Moules fraîches",1],["Palourdes",1]]
},
"Produits laitiers":{
"Laits":[["Lait frais",3],["Lait ouvert",3],["Lait fermenté / Leben",3]],
"Yaourts":[["Yaourt nature",3],["Yaourt aromatisé",3]],
"Fromages":[["Fromage frais",3],["Mozzarella",3],["Ricotta",3],["Gruyère",3],["Fromage râpé",3]],
"Crèmes & matières grasses":[["Crème fraîche",3],["Crème liquide",3],["Beurre",7]]
},
"Fruits & légumes":{
"Légumes":[["Tomate",3],["Pomme de terre",5],["Carotte",5],["Oignon",7],["Ail",7],["Poivron",4],["Piment",4],["Courgette",4],["Aubergine",4],["Concombre",4],["Navet",5],["Courge",5],["Artichaut",4],["Fenouil",4],["Céleri",4],["Poireau",4],["Chou",5],["Chou-fleur",4],["Brocoli",4],["Haricots verts",3],["Petits pois",3],["Fèves",3],["Épinards",3],["Blette",3],["Salade / laitue",3],["Persil",3],["Coriandre",3],["Menthe fraîche",3]],
"Fruits":[["Orange",5],["Citron",7],["Mandarine",5],["Pomme",7],["Poire",5],["Banane",4],["Fraise",3],["Raisin",4],["Pastèque",4],["Melon",4],["Pêche",4],["Abricot",4],["Prune",4],["Grenade",5],["Figue",3],["Datte",7],["Coing",5]],
"Produits préparés":[["Tomates préparées",2],["Salade préparée",2],["Carottes préparées",2],["Fruits préparés",2]]
},
"Œufs & ovoproduits":{
"Œufs":[["Œufs frais",3],["Œufs durs préparés",2]],
"Ovoproduits":[["Blanc d'œuf liquide",3],["Jaune d'œuf liquide",3],["Œuf liquide pasteurisé",3]]
},
"Charcuterie":{
"Charcuterie":[["Jambon de dinde",3],["Jambon de poulet",3],["Mortadelle",3],["Salami",5],["Saucisson",7],["Bacon de bœuf",3]]
},
"Épicerie":{
"Céréales & féculents":[["Riz",30],["Semoule",30],["Couscous",30],["Pâtes",30],["Borghol / Boulgour",30],["Frik",30],["Farine",30]],
"Légumineuses":[["Pois chiches",30],["Lentilles",30],["Haricots secs",30],["Fèves sèches",30]],
"Conserves & condiments":[["Concentré de tomate",7],["Harissa",14],["Thon en conserve ouvert",3],["Olives",14],["Câpres",14],["Cornichons",14]],
"Huiles & sauces":[["Huile d'olive",30],["Huile végétale",30],["Mayonnaise ouverte",7],["Ketchup ouvert",14],["Moutarde ouverte",14]],
"Préparations cuites":[["Riz cuit",3],["Pâtes cuites",3],["Couscous cuit",2],["Sauce tomate préparée",3]]
},
"Surgelés":{
"Viandes & volailles":[["Viande surgelée ouverte",3],["Poulet surgelé",3],["Escalope surgelée",3]],
"Poissons & fruits de mer":[["Poisson surgelé ouvert",3],["Crevettes surgelées",3],["Calamars surgelés",3]],
"Légumes & autres":[["Légumes surgelés ouverts",3],["Frites surgelées",3],["Petits pois surgelés",3],["Pâte feuilletée surgelée",3]]
},
"Boulangerie & pâtisserie":{
"Pains":[["Pain",2],["Baguette",2],["Pain complet",2],["Pain tabouna",2],["Pain de mie",3]],
"Viennoiseries":[["Croissant",2],["Pain au chocolat",2],["Brioche",2]],
"Pâtisserie":[["Gâteau à la crème",2],["Tarte",2],["Mille-feuille",2],["Éclair",2],["Pâtisserie tunisienne",5]]
},
"Boissons":{
"Jus":[["Jus d'orange frais",1],["Jus de citron",1],["Jus de fraise",1],["Jus multifruits",2],["Jus conditionné ouvert",3]],
"Boissons":[["Eau minérale",7],["Eau gazeuse",7],["Soda ouvert",3]],
"Boissons chaudes":[["Café",30],["Thé",30]]
}
},app=document.getElementById('app');
const S=JSON.parse(localStorage.getItem('haccpV3')||'{"stock":[],"temps":[],"clean":[],"trace":[],"equipment":[{"name":"Frigo 1","min":0,"max":4},{"name":"Congélateur 1","min":-24,"max":-18}]}');
if(!Array.isArray(S.suppliers))S.suppliers=[];S.suppliers=S.suppliers.map(s=>typeof s==='string'?{name:s,phone:'',plate:'',driver:''}:s);
function save(){localStorage.setItem('haccpV3',JSON.stringify(S))}
function B(t,f,c=''){return `<button class="btn ${c}" onclick="${f}">${t}</button>`}
function authorizeStockEdit(i){let pin=localStorage.getItem('haccpAdminPin');if(!pin){alert('Aucun code PIN administrateur n’est configuré. Allez dans Paramètres → Sécurité pour le créer.');settings();return}let entered=prompt('Code PIN Responsable / Administrateur :');if(entered===null)return;if(entered!==pin){alert('Code PIN incorrect. Modification refusée.');return}editStock(i)}
function dashboard(){let today=new Date();today.setHours(0,0,0,0);let exp=0,soon=0,dlcToday=0;S.stock.forEach(x=>{if(!x.dlc)return;let d=new Date(x.dlc+'T00:00:00'),diff=Math.ceil((d-today)/86400000);if(diff<0)exp++;else if(diff===0)dlcToday++;else if(diff<=3)soon++});let tempNC=S.temps.filter(x=>!x.ok).length,packNC=S.stock.filter(x=>x.pack==='Non conforme').length,mods=S.trace.filter(x=>x.type==='Modification réception'),recent=S.trace.slice(0,10);let totalNC=tempNC+packNC;app.innerHTML=`<h1>Tableau de bord Direction</h1><p class="note">Vue synthétique pour le propriétaire, la direction générale et le responsable HACCP. Cliquez sur un indicateur pour voir le détail.</p><div class="cards"><div class="metric clickable" onclick="dashboardDetail('stock')"><span>Produits en stock</span><b>${S.stock.length}</b><span>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('dlc')"><span>Alertes DLC</span><b>${exp+dlcToday+soon}</b><span>${exp} expiré(s) · ${dlcToday} aujourd'hui · ${soon} sous 3 jours<br>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('nc')"><span>Non-conformités</span><b>${totalNC}</b><span>${tempNC} température(s) · ${packNC} réception(s)<br>Voir le détail →</span></div></div><div class="cards" style="margin-top:14px"><div class="metric clickable" onclick="dashboardDetail('receptions')"><span>Réceptions enregistrées</span><b>${S.stock.length}</b><span>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('temps')"><span>Contrôles température</span><b>${S.temps.length}</b><span>Voir le détail →</span></div><div class="metric clickable" onclick="dashboardDetail('clean')"><span>Nettoyages enregistrés</span><b>${S.clean.length}</b><span>Voir le détail →</span></div></div><div class="panel clickable" onclick="dashboardDetail('watch')"><h2>⚠️ Points à surveiller</h2>${exp?'<div class="record"><b>'+exp+' produit(s) avec DLC dépassée</b><br><span class="note">Action de contrôle requise.</span></div>':''}${tempNC?'<div class="record"><b>'+tempNC+' relevé(s) de température non conforme(s)</b><br><span class="note">À vérifier dans les contrôles de température.</span></div>':''}${packNC?'<div class="record"><b>'+packNC+' réception(s) avec emballage non conforme</b><br><span class="note">Consulter la traçabilité et les motifs enregistrés.</span></div>':''}${!totalNC&&!exp?'<p class="empty">Aucune alerte critique enregistrée actuellement.</p>':''}<span class="note">Voir tous les points à surveiller →</span></div><div class="panel"><h2>Supervision HACCP</h2><div class="grid">${B('Réceptions & stock','stock()')}${B('Températures','temperatures()')}${B('Nettoyage','cleaning()')}${B('Traçabilité complète','trace()')}${B('Fournisseurs','suppliers()')}${B('Paramètres & sécurité','settings()')}</div></div><div class="panel clickable" onclick="dashboardDetail('mods')"><h2>Modifications des réceptions</h2><div class="metric"><span>Corrections enregistrées</span><b>${mods.length}</b></div>${mods.length?mods.slice(0,5).map(x=>`<div class="record"><b>${esc(x.product||'Article')}</b> — ${esc(x.date||'')}<br><span class="note">Par : ${esc(x.modifiedBy||'—')} · Motif : ${esc(x.reason||'—')}</span></div>`).join(''):'<p class="empty">Aucune modification enregistrée.</p>'}</div><div class="panel clickable" onclick="dashboardDetail('activity')"><h2>Dernières activités</h2>${recent.length?recent.map(x=>`<div class="record"><b>${esc(x.type||'Opération')}</b> — ${esc(x.date||'')}<br><span class="note">${esc(x.product||x.equipment||'')}</span></div>`).join(''):'<p class="empty">Aucune activité enregistrée.</p>'}</div>`}

function dashboardDetail(type){let back=B('← Tableau de bord','dashboard()','back'),title='',intro='',rows='';let now=new Date();now.setHours(0,0,0,0);
 if(type==='stock'){title='Produits en stock';intro='Liste des produits issus des réceptions enregistrées.';rows=S.stock.map(x=>`<div class="record"><b>${esc(x.product)}</b><br><span class="note">Catégorie : ${esc(x.category||'—')} · Fournisseur : ${esc(x.supplier||'—')} · Lot : ${esc(x.lot||'—')} · DLC : ${esc(x.dlc||'—')}</span></div>`).join('')}
 if(type==='dlc'){title='Alertes DLC';intro='Produits dont la DLC est dépassée, arrive aujourd’hui ou dans les 3 prochains jours.';rows=S.stock.filter(x=>{if(!x.dlc)return false;let d=new Date(x.dlc+'T00:00:00'),n=Math.ceil((d-now)/86400000);return n<=3}).map(x=>{let d=new Date(x.dlc+'T00:00:00'),n=Math.ceil((d-now)/86400000),s=n<0?'EXPIRÉE':n===0?'AUJOURD’HUI':'Dans '+n+' jour(s)';return `<div class="record"><b>${esc(x.product)} — ${s}</b><br><span class="note">DLC : ${esc(x.dlc)} · Lot : ${esc(x.lot||'—')} · Fournisseur : ${esc(x.supplier||'—')}</span></div>`}).join('')}
 if(type==='nc'||type==='watch'){title=type==='nc'?'Non-conformités':'Points à surveiller';intro=type==='nc'?'Détail des contrôles enregistrés comme non conformes.':'Alertes qui nécessitent l’attention de la direction ou du responsable HACCP.';let a=[];S.temps.filter(x=>!x.ok).forEach(x=>a.push(`<div class="record"><b>Température non conforme — ${esc(x.equipment)}</b><br><span class="note">${esc(x.value)} °C · ${esc(x.date||'')} · Opérateur : ${esc(x.operator||'—')}</span></div>`));S.stock.filter(x=>x.pack==='Non conforme').forEach(x=>a.push(`<div class="record"><b>Réception non conforme — ${esc(x.product)}</b><br><span class="note">Motif : ${esc(x.nonConformityReason||'—')} · Fournisseur : ${esc(x.supplier||'—')}</span></div>`));if(type==='watch')S.stock.filter(x=>x.dlc&&new Date(x.dlc+'T00:00:00')<now).forEach(x=>a.push(`<div class="record"><b>DLC dépassée — ${esc(x.product)}</b><br><span class="note">DLC : ${esc(x.dlc)} · Lot : ${esc(x.lot||'—')}</span></div>`));rows=a.join('')}
 if(type==='receptions'){title='Réceptions enregistrées';intro='Historique synthétique des marchandises réceptionnées.';rows=S.stock.map(x=>`<div class="record"><b>${esc(x.product)}</b> — ${esc(x.date||'')}<br><span class="note">Fournisseur : ${esc(x.supplier||'—')} · Lot : ${esc(x.lot||'—')} · Emballage : ${esc(x.pack||'—')}</span></div>`).join('')}
 if(type==='temps'){title='Contrôles de température';intro='Tous les relevés de température avec leur statut de conformité.';rows=S.temps.map(x=>`<div class="record"><b>${esc(x.equipment)} — ${esc(x.value)} °C — ${x.ok?'Conforme':'NON CONFORME'}</b><br><span class="note">${esc(x.date||'')} · Opérateur : ${esc(x.operator||'—')}</span></div>`).join('')}
 if(type==='clean'){title='Nettoyages enregistrés';intro='Historique des opérations de nettoyage et de désinfection.';rows=S.clean.map(x=>`<div class="record"><b>${esc(x.zone||'Zone')} — ${esc(x.action||'')}</b><br><span class="note">${esc(x.date||'')} · Opérateur : ${esc(x.operator||'—')} · ${esc(x.note||'')}</span></div>`).join('')}
 if(type==='mods'){title='Modifications des réceptions';intro='Journal des corrections effectuées sur les articles réceptionnés.';rows=S.trace.filter(x=>x.type==='Modification réception').map(x=>`<div class="record"><b>${esc(x.product||'Article')}</b> — ${esc(x.date||'')}<br><span class="note">Par : ${esc(x.modifiedBy||'—')} · Motif : ${esc(x.reason||'—')}</span></div>`).join('')}
 if(type==='activity'){title='Historique des activités';intro='Dernières opérations enregistrées dans l’application.';rows=S.trace.map(x=>`<div class="record"><b>${esc(x.type||'Opération')}</b> — ${esc(x.date||'')}<br><span class="note">${esc(x.product||x.equipment||'')}</span></div>`).join('')}
 app.innerHTML=back+`<h1>${title}</h1><p class="note">${intro}</p><div class="panel">${rows||'<p class="empty">Aucune donnée à afficher.</p>'}</div>`;
}

function stock(){let now=new Date();now.setHours(0,0,0,0),exp=0,today=0,soon=0;S.stock.forEach(x=>{if(!x.dlc)return;let d=new Date(x.dlc+'T00:00:00'),diff=Math.ceil((d-now)/86400000);if(diff<0)exp++;else if(diff===0)today++;else if(diff<=3)soon++});app.innerHTML=`<h1>Stock et DLC</h1><div class="cards"><div class="metric"><span>Expirés</span><b>${exp}</b></div><div class="metric"><span>Aujourd'hui</span><b>${today}</b></div><div class="metric"><span>Sous 3 jours</span><b>${soon}</b></div></div><div class="toolbar"><div><label>Format d'étiquette</label><select><option>50 × 30 mm</option><option>60 × 40 mm</option><option>70 × 40 mm</option></select></div></div>${S.stock.length?`<div class="panel">${S.stock.map((x,i)=>`<div class="record"><b>${x.product}</b> — Lot ${x.lot||'—'} — DLC ${x.dlc||'—'}<br><span class="note">${x.supplier||''} · reçu le ${x.date}</span><br><button class="btn" style="margin-top:8px;padding:8px 12px" onclick="authorizeStockEdit(${i})">Modifier</button></div>`).join('')}</div>`:`<p class="empty">Aucun produit en stock. Enregistrez une réception.</p>`}`}

function editStock(i){let x=S.stock[i],cats=Object.keys(CAT).map(c=>`<option value="${c}">`).join(''),sup=S.suppliers.map(s=>`<option value="${typeof s==='string'?s:s.name}">`).join('');app.innerHTML=`<button class="btn back" onclick="stock()">← Stock</button><h1>Modifier l'article réceptionné</h1><div class="panel"><div class="row"><div><label>Catégorie *</label><input id="ec" list="edit-cats" value="${esc(x.category)}"><datalist id="edit-cats">${cats}</datalist></div><div><label>Produit *</label><input id="ep" value="${esc(x.product)}"></div></div><div class="row"><div><label>Marque / fabricant</label><input id="ebrand" value="${esc(x.brand)}"></div><div><label>Quantité / poids</label><input id="eqty" value="${esc(x.quantity)}"></div></div><div class="row"><div><label>Fournisseur *</label><input id="esupplier" list="edit-sup" value="${esc(x.supplier)}"><datalist id="edit-sup">${sup}</datalist></div><div><label>Lot</label><input id="elot" value="${esc(x.lot)}"></div></div><div class="row"><div><label>Température °C</label><input id="etemp" type="number" step=".1" value="${esc(x.temp)}"></div><div><label>Date fabrication / conditionnement</label><input id="efab" type="date" value="${esc(x.fabrication)}"><label class="note"><input id="efabNA" type="checkbox" ${x.fabricationNA?'checked':''}> Non applicable / non indiquée</label></div></div><div class="row"><div><label>DLC / DDM fabricant</label><input id="edlc" type="date" value="${esc(x.dlc)}"><label class="note"><input id="edlcNA" type="checkbox" ${x.dlcNA?'checked':''}> Non applicable / non indiquée</label></div><div><label>Code-barres</label><input id="ebarcode" inputmode="numeric" value="${esc(x.barcode)}"><div class="note">Saisie manuelle uniquement.</div></div></div><label>État emballage *</label><select id="epack"><option ${x.pack==='Conforme'?'selected':''}>Conforme</option><option ${x.pack==='Non conforme'?'selected':''}>Non conforme</option></select><label>Motif de non-conformité</label><textarea id="ereason">${esc(x.nonConformityReason)}</textarea><label>Observation</label><textarea id="eobs">${esc(x.observation)}</textarea><div class="row"><div><label>Modifié par *</label><input id="emodby" placeholder="Nom du responsable"></div><div><label>Motif de la modification *</label><input id="emodreason" placeholder="Ex. erreur de saisie"></div></div><br>${B('Enregistrer les modifications',`saveStockEdit(${i})`,'primary')}</div>`}

function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function detectProduct(text){
 let nt=normText(text),best=null;
 Object.entries(CAT).forEach(([cat,subs])=>Object.values(subs).forEach(arr=>arr.forEach(([p])=>{
  let np=normText(p),score=np.split(' ').filter(w=>w.length>2&&nt.includes(w)).length;
  if(np&&nt.includes(np))score+=5;if(!best||score>best.score)best={cat,p,score};
 })));
 // Conservative Tunisia-oriented aliases: only fill when an explicit product word is present.
 const aliases=[
  {rx:/\b(lait|milk)\b|حليب/i,cat:'Produits laitiers',p:'Lait frais'},
  {rx:/\b(yaourt|yogurt)\b|ياغورت/i,cat:'Produits laitiers',p:'Yaourt nature'},
  {rx:/\b(poulet|chicken)\b|دجاج/i,cat:'Volailles',p:'Poulet entier frais'},
  {rx:/\b(tomate|tomato)\b|طماطم/i,cat:'Fruits & légumes',p:'Tomate'}

function detectBarcode(text){

function extractDateCandidates(text){

function showDateCandidates(cands){

 if(!cands.length){box.innerHTML='';return}
 box.innerHTML='<div class="panel" style="margin-top:8px"><b>Date(s) plausible(s) détectée(s)</b><div class="note">Les lectures incohérentes sont maintenant éliminées. Touchez uniquement une date que vous voyez réellement sur l’étiquette.</div>'+cands.map(d=>'<div class="row" style="margin-top:8px"><button type="button" class="btn" onclick="rd.value=\''+d.iso+'\'">DLC : '+d.raw+(d.hits?' · '+d.hits+' lecture(s)':'')+'</button><button type="button" class="btn" onclick="rfab.value=\''+d.iso+'\'">Fabrication : '+d.raw+'</button></div>').join('')+'</div>';

function fillFromOCR(text){

 if(prod){if(!rc.value){rc.value=prod.cat;updateReceptionProducts()}if(!rp.value)rp.value=prod.p;found.push('Produit')}
 // Brand aliases are explicit, never guessed from an arbitrary line.
 if(!rbrand.value){
   if(/d[eé]lice|دليس/i.test(text)){rbrand.value='Délice';found.push('Marque')}
 }
 let lot=joined.match(/(?:\blot\b|batch|n[°ºo]?\s*lot|رقم\s*(?:الدفعة|التشغيلة))\s*[:#.-]?\s*([A-Z0-9][A-Z0-9\-\/\.]{2,})/i);

 let qty=joined.match(/(?:poids\s*(?:net)?|net\s*weight|quantit[eé]|الوزن\s*الصافي)?\s*[:.-]?\s*(\d+(?:[.,]\d+)?)\s*(kg|g|gr|ml|cl|l|كغ|غ|مل|لتر)\b/i);

async function preprocessOCRImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
   const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
   const d=ctx.getImageData(0,0,cv.width,cv.height),p=d.data;
   // grayscale + stronger contrast helps dot-matrix dates and small printed text
   for(let i=0;i<p.length;i+=4){
    let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];
    g=(g-128)*1.65+128; g=Math.max(0,Math.min(255,g));
    p[i]=p[i+1]=p[i+2]=g;
   }
   ctx.putImageData(d,0,0);URL.revokeObjectURL(url);resolve(cv);
  };img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};img.src=url;
 });
}
async function makeDateOCRVariants(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const scale=Math.min(2,2200/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
   const base=document.createElement('canvas');base.width=w;base.height=h;let b=base.getContext('2d');b.drawImage(img,0,0,w,h);
   let src=b.getImageData(0,0,w,h),arr=[];
   [105,135,165,195].forEach(th=>{
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d'),d=x.createImageData(w,h);
    for(let i=0;i<src.data.length;i+=4){let g=.299*src.data[i]+.587*src.data[i+1]+.114*src.data[i+2],v=g<th?0:255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
    x.putImageData(d,0,0);arr.push(cv);

 });

function mergeDateCandidates(texts){

function settings(){let hasPin=!!localStorage.getItem('haccpAdminPin');app.innerHTML=`<h1>Paramètres</h1><div class="panel"><h2>🔒 Sécurité</h2><p class="note">Le code PIN protège les modifications des articles déjà réceptionnés.</p><div class="result" style="font-size:18px">${hasPin?'Code PIN administrateur configuré ✅':'Aucun code PIN configuré'}</div>${hasPin?`<h2>Modifier le code PIN</h2><label>Code PIN actuel</label><input id="oldPin" type="password" inputmode="numeric" maxlength="8" placeholder="Code actuel"><div class="row"><div><label>Nouveau code PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="8" placeholder="4 à 8 chiffres"></div><div><label>Confirmer le nouveau PIN</label><input id="confirmPin" type="password" inputmode="numeric" maxlength="8" placeholder="Répéter le nouveau code"></div></div><br>${B('Modifier le code PIN','changeAdminPin()','primary')}`:`<h2>Créer le code PIN administrateur</h2><div class="row"><div><label>Nouveau code PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="8" placeholder="4 à 8 chiffres"></div><div><label>Confirmer le code PIN</label><input id="confirmPin" type="password" inputmode="numeric" maxlength="8" placeholder="Répéter le code"></div></div><br>${B('Créer le code PIN','createAdminPin()','primary')}`}</div>`}

function validPin(p){return /^\d{4,8}$/.test(p)}
function createAdminPin(){let p=newPin.value.trim(),c=confirmPin.value.trim();if(!validPin(p)){alert('Le code PIN doit contenir uniquement 4 à 8 chiffres.');return}if(p!==c){alert('Les deux codes PIN ne correspondent pas.');return}localStorage.setItem('haccpAdminPin',p);S.trace.unshift({type:'Sécurité',product:'Code PIN administrateur créé',date:new Date().toLocaleString('fr-FR')});save();alert('Code PIN administrateur créé.');settings()}
function changeAdminPin(){let current=localStorage.getItem('haccpAdminPin'),old=oldPin.value.trim(),p=newPin.value.trim(),c=confirmPin.value.trim();if(old!==current){alert('Le code PIN actuel est incorrect.');return}if(!validPin(p)){alert('Le nouveau code PIN doit contenir uniquement 4 à 8 chiffres.');return}if(p!==c){alert('Les deux nouveaux codes PIN ne correspondent pas.');return}localStorage.setItem('haccpAdminPin',p);S.trace.unshift({type:'Sécurité',product:'Code PIN administrateur modifié',date:new Date().toLocaleString('fr-FR')});save();alert('Code PIN modifié.');settings()}

function temperatures(){let opts=S.equipment.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');app.innerHTML=`<h1>Contrôle des températures</h1><div class="cards"><div class="metric"><span>Équipements</span><b>${S.equipment.length}</b></div><div class="metric"><span>Relevés</span><b>${S.temps.length}</b></div><div class="metric"><span>Non conformes</span><b>${S.temps.filter(x=>!x.ok).length}</b></div></div><div class="panel"><h2>Nouveau relevé</h2><div class="row"><div><label>Équipement</label><select id="te">${opts}</select></div><div><label>Température °C</label><input id="tv" type="number" step=".1"></div></div><label>Opérateur</label><input id="to">${B('Enregistrer','saveTemp()','primary')}<h2>Ajouter un équipement</h2><div class="row"><input id="en" placeholder="Nom : Frigo pâtisserie"><input id="emin" type="number" placeholder="Minimum °C"></div><input id="emax" type="number" placeholder="Maximum °C">${B('Ajouter l’équipement','addEq()')}</div>`}
function saveTemp(){let e=S.equipment[+te.value],v=+tv.value,ok=v>=e.min&&v<=e.max,x={equipment:e.name,value:v,ok,operator:to.value,date:new Date().toLocaleString('fr-FR')};S.temps.unshift(x);S.trace.unshift({type:'Température',...x});save();temperatures()}
function addEq(){if(!en.value)return;S.equipment.push({name:en.value,min:+emin.value,max:+emax.value});save();temperatures()}
function cleaning(){app.innerHTML=`<h1>Nettoyage</h1><div class="panel"><div class="row"><div><label>Zone / équipement</label><input id="cz" list="zones-haccp" placeholder="Choisir ou saisir une zone"><datalist id="zones-haccp"><option value="Cuisine principale"><option value="Cuisine chaude"><option value="Cuisine froide"><option value="Zone de préparation"><option value="Plan de travail"><option value="Plonge"><option value="Laverie vaisselle"><option value="Réserve sèche"><option value="Économat / magasin"><option value="Chambre froide positive"><option value="Chambre froide négative"><option value="Réfrigérateur"><option value="Congélateur"><option value="Vitrine réfrigérée"><option value="Zone de réception marchandises"><option value="Quai de réception"><option value="Pâtisserie"><option value="Boulangerie"><option value="Bar"><option value="Cafétéria"><option value="Buffet petit-déjeuner"><option value="Buffet chaud"><option value="Buffet froid"><option value="Salle de restaurant"><option value="Terrasse"><option value="Office / passe"><option value="Machine à café"><option value="Machine à glaçons"><option value="Lave-vaisselle"><option value="Hotte aspirante"><option value="Four"><option value="Friteuse"><option value="Grill / plancha"><option value="Sol cuisine"><option value="Murs cuisine"><option value="Poubelles / local déchets"><option value="Sanitaires personnel"><option value="Vestiaires personnel"></datalist><div class="note">Suggestions adaptées aux restaurants, cafétérias et hôtels. Vous pouvez aussi saisir une autre zone.</div></div><div><label>Opérateur</label><input id="co"></div></div><label>Action réalisée</label><select id="ca"><option>Nettoyage</option><option>Désinfection</option><option>Nettoyage + désinfection</option></select><label>Observation</label><textarea id="cn"></textarea>${B('Valider le nettoyage','saveClean()','primary')}</div>`}
function saveClean(){let x={zone:cz.value,operator:co.value,action:ca.value,note:cn.value,date:new Date().toLocaleString('fr-FR')};S.clean.unshift(x);S.trace.unshift({type:'Nettoyage',product:x.zone,date:x.date});save();cleaning()}
function trace(){app.innerHTML=`<h1>Traçabilité</h1><div class="cards"><div class="metric"><span>Réceptions</span><b>${S.stock.length}</b></div><div class="metric"><span>Températures</span><b>${S.temps.length}</b></div><div class="metric"><span>Nettoyages</span><b>${S.clean.length}</b></div></div><div class="panel">${S.trace.length?S.trace.map(x=>`<div class="record"><b>${x.type}</b> — ${x.date||''}<br><span class="note">${x.product||x.equipment||''}${x.type==='Modification réception'?'<br>Par : '+esc(x.modifiedBy||'—')+' · Motif : '+esc(x.reason||'—'):''}</span></div>`).join(''):'Aucune opération enregistrée.'}</div>`}
let C='',SUB='',P='',DAYS=0;
function dlcCats(){app.innerHTML=`<h1>Imprimer DLC</h1><div class="panel"><p>Choisissez une catégorie.</p><div class="grid">${Object.keys(CAT).map(c=>B(c,`dlcSubs(${JSON.stringify(c)})`)).join('')}</div></div>`}
function dlcSubs(c){C=c;app.innerHTML=B('← Catégories','dlcCats()','back')+`<h1>${c}</h1><div class="panel"><div class="grid">${Object.keys(CAT[c]).map(s=>B(s,`dlcProducts(${JSON.stringify(s)})`)).join('')}</div></div>`}
function dlcProducts(s){SUB=s;app.innerHTML=B('← Sous-catégories','dlcSubs(C)','back')+`<h1>${s}</h1><div class="panel"><div class="grid">${CAT[C][s].map((p,i)=>B(p[0],`ticket(${i})`)).join('')}</div></div>`}
function ticket(i){[P,DAYS]=CAT[C][SUB][i];app.innerHTML=B('← Produits','dlcProducts(SUB)','back')+`<h1>Étiquette DLC</h1><div class="panel"><h2>${P}</h2><div class="row"><div><label>Préparé / ouvert le</label><input id="dd" type="date" onchange="calc()"></div><div><label>Durée paramétrée</label><input value="${DAYS} jour(s)" disabled></div></div><div class="result">À CONSOMMER AVANT LE<br><span id="out">—</span></div><p class="note">Paramètre de démonstration à valider dans le plan HACCP. Pour un produit préemballé, la date et les conditions du fabricant priment.</p>${B('Imprimer l’étiquette','window.print()','primary print-hide')}</div>`;dd.value=new Date().toISOString().slice(0,10);calc()}
function calc(){let d=new Date(dd.value+'T12:00:00');d.setDate(d.getDate()+DAYS);out.textContent=d.toLocaleDateString('fr-FR')}
dashboard();
</script></body></html>

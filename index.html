    const ks=String(t.postes||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean),r=String(s.role||'').toLowerCase();
    return ks.some(k=>r.includes(k));
  }
  return !!lastOk(s,t);
}
function st(s,t){
  if(!applies(s,t))return {k:'na',txt:''};
  const d=lastOk(s,t);
  if(!d)return {k:'none',txt:'Non réalisée'};
  if(!t.months)return {k:'ok',date:d,txt:'Valide (sans échéance)'};
  const exp=addMonths(d,Number(t.months)),n=days(today(),exp);
  if(n<0)return {k:'late',date:d,exp,txt:'Expirée depuis '+(-n)+' j'};
  if(n<=30)return {k:'soon',date:d,exp,txt:'Expire dans '+n+' j'};
  return {k:'ok',date:d,exp,txt:'Valide jusqu’au '+fd(exp)};
}
function habState(h){
  if(!h.expires)return {k:'ok',txt:'Sans échéance'};
  const n=days(today(),h.expires);
  if(n<0)return {k:'late',txt:'Expirée depuis '+(-n)+' j'};
  if(n<=30)return {k:'soon',txt:'Expire dans '+n+' j'};
  return {k:'ok',txt:'Valide jusqu’au '+fd(h.expires)};
}
function cls(k){return k==='ok'?'ok':k==='soon'?'warn':k==='late'||k==='none'?'bad':'muted'}
function gaps(list){
  const out=[];
  (list||activeStaff()).forEach(s=>T().catalog.forEach(t=>{const r=st(s,t);if(['late','none','soon'].includes(r.k))out.push({s,t,r})}));
  (list||activeStaff()).forEach(s=>(s.habil||[]).forEach(h=>{const r=habState(h);if(r.k==='late'||r.k==='soon')out.push({s,t:{title:'Habilitation : '+h.title},r})}));
  const w={late:0,none:1,soon:2};
  out.sort((a,b)=>(w[a.r.k]-w[b.r.k])||String(a.s.name).localeCompare(String(b.s.name)));
  return out;
}

function render(){
  const root=$('app');if(!root)return;
  let body='';
  try{
    body=view==='overview'?vOverview():view==='staff'?vStaff():view==='staffForm'?vStaffForm():view==='matrix'?vMatrix():view==='sessions'?vSessions():view==='sessForm'?vSessForm():view==='catalog'?vCatalog():view==='catForm'?vCatForm():'';
  }catch(err){console.error('Formation',err);body='<div class="panel"><p>Erreur d’affichage : '+e(err&&err.message||err)+'</p></div>'}
  const act={staffForm:'staff',sessForm:'sessions',catForm:'catalog'}[view]||view;
  const tabs=TABS.map(([k,l])=>'<button type="button" class="mt-pest-tab'+(act===k?' active':'')+'" onclick="mtTrain.go(\''+k+'\')">'+e(l)+'</button>').join('');
  root.innerHTML='<section class="mt-pest-view mt-train-view"><button class="btn back" onclick="home()">← Accueil</button><h1>Formation du personnel</h1><div class="mt-pest-tabs">'+tabs+'</div>'+body+'</section>';
}
function open(){
  if(typeof SITE_ID!=='undefined'&&SITE_ID==='main'){alert('Module réservé aux établissements');return}
  if(typeof CURRENT_VIEW!=='undefined')CURRENT_VIEW='train';
  document.body.classList.remove('on-home','mt-premium-active','on-login');
  const legacy=document.querySelector('body > nav');if(legacy)legacy.style.display='none';
  T();view='overview';render();window.scrollTo(0,0);
}
function go(k){view=k;cur='';q='';render();window.scrollTo(0,0)}

/* ---------- Vue d'ensemble ---------- */
function vOverview(){
  const mg=canManage(),list=mg?activeStaff():myStaff().filter(s=>s.active!==false);
  const g=gaps(list);
  const late=g.filter(x=>x.r.k==='late'),none=g.filter(x=>x.r.k==='none'),soon=g.filter(x=>x.r.k==='soon');
  let total=0,okc=0;
  list.forEach(s=>T().catalog.forEach(t=>{const r=st(s,t);if(r.k!=='na'){total++;if(r.k==='ok')okc++}}));
  const pct=total?Math.round(okc*100/total):null;
  const pastPlanned=T().sessions.filter(x=>x.status==='Prévue'&&x.date<today());
  const next=T().sessions.filter(x=>x.status==='Prévue'&&x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));
  const alerts=[];
  if(late.length)alerts.push(['bad',late.length+' formation(s) ou habilitation(s) expirée(s).','matrix']);
  if(none.length)alerts.push(['bad',none.length+' formation(s) obligatoire(s) jamais réalisée(s).','matrix']);
  if(soon.length)alerts.push(['warn',soon.length+' échéance(s) dans les 30 jours.','matrix']);
  if(mg&&pastPlanned.length)alerts.push(['warn',pastPlanned.length+' session(s) prévue(s) dont la date est passée (à confirmer ou replanifier).','sessions']);
  const ah=alerts.length?alerts.map(a=>'<button type="button" class="mt-pest-alert '+a[0]+'" onclick="mtTrain.go(\''+a[2]+'\')">'+e(a[1])+'<span>Voir →</span></button>').join(''):'<div class="mt-pest-alert ok">Formations à jour.</div>';
  const todo=g.slice(0,12).map(x=>'<div class="record" style="cursor:pointer" onclick="mtTrain.openStaff(\''+x.s.id+'\')"><b>'+e(x.s.name)+'</b> · '+e(x.t.title)+' '+badge(x.r.txt,cls(x.r.k))+'</div>').join('');
  const nx=next.slice(0,5).map(x=>{const t=trainOf(x.trainingId);return '<div class="record" style="cursor:pointer" onclick="mtTrain.openSess(\''+x.id+'\')"><b>'+fd(x.date)+'</b> · '+e(t?t.title:'Formation')+' <span class="note">· '+(x.participants||[]).length+' participant(s)</span></div>'}).join('');
  const none0=!T().catalog.length&&mg?'<div class="panel"><h2>Pour commencer</h2><p class="note">Créez d’abord le catalogue des formations (hygiène, HACCP, allergènes…), puis les fiches du personnel, avec ou sans compte.</p><div class="mt-pest-actions"><button class="btn primary" onclick="mtTrain.addAllStd()">Créer le catalogue type</button><button class="btn" onclick="mtTrain.importAccounts()">Importer les comptes de l’établissement</button><button class="btn" onclick="mtTrain.newStaff()">Nouvelle fiche</button></div></div>':'';
  return '<div class="cards mt-pest-cards"><div class="metric"><span>Personnel actif</span><b>'+list.length+'</b></div><div class="metric"><span>Formations à jour</span><b class="'+(pct==null?'':pct>=90?'':pct>=60?'mt-pest-orange':'mt-pest-red')+'">'+(pct==null?'—':pct+' %')+'</b></div><div class="metric"><span>À renouveler</span><b class="'+(soon.length?'mt-pest-orange':'')+'">'+soon.length+'</b></div><div class="metric"><span>Expirées / manquantes</span><b class="'+(late.length+none.length?'mt-pest-red':'')+'">'+(late.length+none.length)+'</b></div></div>'
   +none0
   +'<div class="panel"><h2>À traiter</h2>'+ah+(todo?'<div style="margin-top:10px">'+todo+'</div>':'')+(mg?'<div class="mt-pest-actions"><button class="btn primary" onclick="mtTrain.newSess()">Enregistrer une session</button><button class="btn" onclick="mtTrain.newStaff()">Nouvelle fiche</button><button class="btn" onclick="mtTrain.printRegister()">Imprimer le registre</button></div>':'')+'</div>'
   +(nx?'<div class="panel"><h2>Prochaines sessions prévues</h2>'+nx+'</div>':'');
}

/* ---------- Personnel ---------- */
function vStaff(){
  const mg=canManage();let list=scopeStaff();
  if(q){const k=q.toLowerCase();list=list.filter(s=>(s.name+' '+(s.role||'')).toLowerCase().includes(k))}
  if(fSt==='Parti')list=list.filter(s=>s.active===false);else list=list.filter(s=>s.active!==false);
  list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr'));
  const rows=list.map(s=>{
    let late=0,none=0,soon=0;T().catalog.forEach(t=>{const r=st(s,t);if(r.k==='late')late++;else if(r.k==='none')none++;else if(r.k==='soon')soon++});
    (s.habil||[]).forEach(h=>{const r=habState(h);if(r.k==='late')late++;else if(r.k==='soon')soon++});
    const b=(late?badge(late+' expirée(s)','bad')+' ':'')+(none?badge(none+' manquante(s)','bad')+' ':'')+(soon?badge(soon+' à renouveler','warn')+' ':'')+(!late&&!none&&!soon?badge('À jour','ok'):'');
    return '<div class="record" style="cursor:pointer" onclick="mtTrain.openStaff(\''+s.id+'\')"><b>'+e(s.name)+'</b> · '+e(s.role||'Poste non renseigné')+' '+(s.uid?badge('Compte','muted'):badge('Sans compte','muted'))+'<br>'+b+'</div>';
  }).join('')||'<p class="note">'+(mg?'Aucune fiche. Ajoutez-en une ou importez les comptes de l’établissement.':'Aucune fiche ne vous est rattachée. Demandez au responsable de lier votre compte.')+'</p>';
  const fl=[['','Actifs'],['Parti','Partis']].map(x=>'<button type="button" class="mt-pest-chip'+(fSt===x[0]?' active':'')+'" onclick="mtTrain.filter(\''+x[0]+'\')">'+x[1]+'</button>').join('');
  return '<div class="panel"><div class="mt-pest-headrow"><h2>Personnel</h2>'+(mg?'<span class="mt-pest-actions" style="margin:0"><button class="btn primary" onclick="mtTrain.newStaff()">+ Nouvelle fiche</button><button class="btn" onclick="mtTrain.importAccounts()">Importer les comptes</button></span>':'')+'</div>'
   +'<input id="tr-q" placeholder="Rechercher (nom, poste)" value="'+e(q)+'" oninput="mtTrain.search(this.value)"><div class="mt-pest-chips">'+fl+'</div>'+rows+'</div>';
}
function newStaff(pre){
  if(!canManage()){alert('Action réservée aux responsables.');return}
  window.__trDraft=Object.assign({id:'',name:'',role:'',hired:'',active:true,uid:'',notes:'',habil:[]},pre||{});
  cur='new';view='staffForm';render();window.scrollTo(0,0);
}
function openStaff(id){const s=staffOf(id);if(!s)return;window.__trDraft=JSON.parse(JSON.stringify(s));cur=id;view='staffForm';render();window.scrollTo(0,0)}
function vStaffForm(){
  const d=window.__trDraft||{},isNew=cur==='new',mg=canManage(),dis=mg?'':' disabled';
  const dl='<datalist id="tr-postes">'+POSTES.map(p=>'<option value="'+e(p)+'">').join('')+'</datalist>';
  const ed='<label>Nom et prénom</label><input id="tr-name" value="'+e(d.name)+'"'+dis+'><div class="row"><div><label>Poste</label><input id="tr-role" list="tr-postes" value="'+e(d.role||'')+'"'+dis+'>'+dl+'</div><div><label>Date d’entrée</label><input id="tr-hired" type="date" value="'+e(d.hired||'')+'"'+dis+'></div><div><label>Statut</label><select id="tr-active"'+dis+'><option value="1"'+(d.active!==false?' selected':'')+'>Actif</option><option value="0"'+(d.active===false?' selected':'')+'>Parti</option></select></div></div>'
   +'<p class="note">'+(d.uid?'Cette fiche est liée à un compte de l’application.':'Fiche sans compte : le salarié n’a pas d’accès à l’application.')+'</p><label>Remarques</label><textarea id="tr-notes" rows="2"'+dis+'>'+e(d.notes||'')+'</textarea>';
  const acts=mg?'<div class="mt-pest-actions"><button class="btn primary" onclick="mtTrain.saveStaff()">Enregistrer</button>'+(!isNew?'<button class="btn" onclick="mtTrain.newSess(\''+d.id+'\')">Enregistrer une formation</button><button class="btn" onclick="mtTrain.printStaff()">Imprimer la fiche</button><button class="btn danger" onclick="mtTrain.removeStaff()">Supprimer</button>':'')+'</div>':'<div class="mt-pest-actions"><button class="btn" onclick="mtTrain.printStaff()">Imprimer ma fiche</button></div>';
  let trn='',hab='';
  if(!isNew){
    const s=staffOf(d.id)||d;
    const rows=T().catalog.map(t=>{const r=st(s,t);if(r.k==='na')return '';return '<tr><td>'+e(t.title)+'</td><td>'+(r.date?fd(r.date):'—')+'</td><td>'+(r.exp?fd(r.exp):'—')+'</td><td>'+badge(r.txt,cls(r.k))+'</td></tr>'}).join('');
    trn='<div class="panel"><h3>Formations</h3>'+(rows?'<div class="mt-pest-tablewrap"><table class="mt-pest-table"><thead><tr><th>Formation</th><th>Dernière session</th><th>Échéance</th><th>État</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="note">Aucune formation applicable. Vérifiez le poste et le catalogue.</p>')+'</div>';
    const hr=(d.habil||[]).map((h,i)=>{const r=habState(h);return '<div class="record"><b>'+e(h.title)+'</b> '+badge(r.txt,cls(r.k))+'<br><span class="note">Accordée le '+fd(h.date)+(h.expires?' · échéance '+fd(h.expires):'')+(h.note?' · '+e(h.note):'')+'</span>'+(mg?' <button class="btn danger" style="padding:4px 10px" onclick="mtTrain.delHab('+i+')">Retirer</button>':'')+'</div>'}).join('');
    hab='<div class="panel"><h3>Habilitations</h3>'+(hr||'<p class="note">Aucune habilitation.</p>')+(mg?'<div class="row"><div><label>Habilitation</label><input id="tr-h-title" placeholder="Ex. utilisation du trancheur"></div><div><label>Accordée le</label><input id="tr-h-date" type="date" value="'+today()+'"></div><div><label>Échéance (facultatif)</label><input id="tr-h-exp" type="date"></div></div><label>Remarque</label><input id="tr-h-note"><div class="mt-pest-actions"><button class="btn" onclick="mtTrain.addHab()">Ajouter l’habilitation</button></div>':'')+'</div>';
  }
  return '<div class="panel"><button class="btn back" onclick="mtTrain.go(\'staff\')">← Personnel</button><h2>'+(isNew?'Nouvelle fiche':e(d.name))+'</h2>'+ed+acts+'</div>'+trn+hab;
}
function readStaff(){
  const d=window.__trDraft;
  return Object.assign(d,{name:v('tr-name'),role:v('tr-role'),hired:v('tr-hired'),active:v('tr-active')!=='0',notes:v('tr-notes')});
}
function saveStaff(){
  if(!canManage())return;
  const d=readStaff();
  if(!d.name){alert('Indiquez le nom de l’employé.');return}
  if(cur==='new'){d.id=uid();T().staff.push(d);trace('Fiche personnel créée : '+d.name,'',who(),d.role||'')}
  else{const o=staffOf(cur);if(!o)return;Object.assign(o,d)}
  save();view='staff';cur='';render();
}
function removeStaff(){
  if(!canManage())return;const o=staffOf(cur);if(!o)return;
  if(!confirm('Supprimer la fiche de « '+o.name+' » ? Pour garder l’historique, préférez le statut Parti.'))return;
  T().staff=T().staff.filter(x=>x.id!==cur);
  T().sessions.forEach(x=>{x.participants=(x.participants||[]).filter(p=>p.staffId!==cur)});
  trace('Fiche personnel supprimée : '+o.name,'',who(),'');save();view='staff';cur='';render();
}
function addHab(){
  if(!canManage())return;const o=staffOf(cur);if(!o)return;
  const t=v('tr-h-title');if(!t){alert('Indiquez l’habilitation.');return}
  const h={id:uid(),title:t,date:v('tr-h-date')||today(),expires:v('tr-h-exp'),note:v('tr-h-note')};
  if(h.expires&&h.expires<h.date){alert('L’échéance doit être postérieure à la date d’octroi.');return}
  const keep=readStaff();Object.assign(o,{name:keep.name||o.name,role:keep.role,hired:keep.hired,active:keep.active,notes:keep.notes});
  o.habil=(o.habil||[]).concat([h]);trace('Habilitation accordée : '+o.name,'',who(),t);save();openStaff(o.id);
}
function delHab(i){
  if(!canManage())return;const o=staffOf(cur);if(!o||!o.habil||!o.habil[i])return;
  if(!confirm('Retirer cette habilitation ?'))return;
  const t=o.habil[i].title;o.habil.splice(i,1);trace('Habilitation retirée : '+o.name,'',who(),t);save();openStaff(o.id);
}
async function importAccounts(){
  if(!canManage())return;
  if(typeof cloudDb==='undefined'||!cloudDb){alert('Connexion indisponible. Réessayez en ligne.');return}
  try{
    const site=(typeof SITE_ID!=='undefined')?SITE_ID:'';
    const snap=await cloudDb.collection('users').where('site','==',site).get({source:'server'});
    let n=0;
    snap.forEach(d=>{
      const u=d.data()||{};if(u.active===false)return;
      if(T().staff.some(s=>s.uid===d.id))return;
      const name=u.name||u.displayName||u.username||(u.email?String(u.email).split('@')[0]:'');if(!name)return;
      T().staff.push({id:uid(),name:name,role:'',hired:'',active:true,uid:d.id,notes:'',habil:[]});n++;
    });
    if(n){trace('Comptes importés dans la formation : '+n,'',who(),'');save()}
    alert(n?n+' fiche(s) créée(s) depuis les comptes. Pensez à renseigner le poste de chacun.':'Aucun nouveau compte à importer.');
    render();
  }catch(err){console.error('Formation import',err);alert('Impossible de lire les comptes ('+(err&&(err.code||err.message)||'erreur')+'). Vous pouvez créer les fiches manuellement.')}
}

/* ---------- Matrice ---------- */
function vMatrix(){
  const mg=canManage(),staff=scopeStaff().filter(s=>s.active!==false).sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr')),cat=T().catalog;
  if(!staff.length||!cat.length)return '<div class="panel"><h2>Matrice de compétences</h2><p class="note">La matrice apparaît dès qu’il y a au moins une fiche et une formation au catalogue.</p></div>';
  const head='<tr><th>Employé</th>'+cat.map(t=>'<th>'+e(t.title)+'</th>').join('')+'</tr>';
  const rows=staff.map(s=>'<tr><td><b>'+e(s.name)+'</b><br><span class="note">'+e(s.role||'')+'</span></td>'+cat.map(t=>{
    const r=st(s,t);
    if(r.k==='na')return '<td style="text-align:center;color:#9aa8a0">—</td>';
    const lab=r.k==='ok'?'Valide':r.k==='soon'?'À renouveler':r.k==='late'?'Expirée':'Manquante';
    return '<td style="text-align:center;cursor:pointer" onclick="mtTrain.openStaff(\''+s.id+'\')" title="'+e(r.txt)+'">'+badge(lab,cls(r.k))+(r.exp?'<br><span class="note">'+fd(r.exp)+'</span>':'')+'</td>';
  }).join('')+'</tr>').join('');
  return '<div class="panel"><div class="mt-pest-headrow"><h2>Matrice de compétences</h2><button class="btn" onclick="mtTrain.printMatrix()">Imprimer</button></div><p class="note">« — » : formation non applicable à ce poste. La date indiquée est l’échéance.</p><div class="mt-pest-tablewrap"><table class="mt-pest-table mt-train-matrix"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------- Sessions ---------- */
function vSessions(){
  const mg=canManage();let list=T().sessions.slice();
  if(!mg){const mine=myStaff().map(s=>s.id);list=list.filter(x=>(x.participants||[]).some(p=>mine.includes(p.staffId)))}
  if(fSess)list=list.filter(x=>x.status===fSess);
  list.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const rows=list.map(x=>{const t=trainOf(x.trainingId);return '<div class="record" style="cursor:pointer" onclick="mtTrain.openSess(\''+x.id+'\')"><b>'+fd(x.date)+'</b> · '+e(t?t.title:'Formation supprimée')+' '+badge(x.status,x.status==='Réalisée'?'ok':(x.date<today()?'bad':'warn'))+'<br><span class="note">'+(mg?(x.participants||[]).length+' participant(s)':'')+(x.trainer?(mg?' · ':'')+e(x.trainer):'')+(x.hours?' · '+e(x.hours)+' h':'')+'</span></div>'}).join('')||'<p class="note">Aucune session.</p>';
  const fl=[['','Toutes'],['Prévue','Prévues'],['Réalisée','Réalisées']].map(x=>'<button type="button" class="mt-pest-chip'+(fSess===x[0]?' active':'')+'" onclick="mtTrain.fsess(\''+x[0]+'\')">'+x[1]+'</button>').join('');
  return '<div class="panel"><div class="mt-pest-headrow"><h2>Sessions de formation</h2>'+(mg?'<span class="mt-pest-actions" style="margin:0"><button class="btn primary" onclick="mtTrain.newSess()">+ Nouvelle session</button><button class="btn" onclick="mtTrain.printRegister()">Imprimer le registre</button></span>':'')+'</div><div class="mt-pest-chips">'+fl+'</div>'+rows+'</div>';
}
function newSess(staffId){
  if(!canManage()){alert('Action réservée aux responsables.');return}
  if(!T().catalog.length){alert('Créez d’abord au moins une formation dans le catalogue.');view='catalog';render();return}
  window.__trDraft={id:'',trainingId:T().catalog[0].id,date:today(),status:'Réalisée',trainer:'',hours:'',notes:'',proof:'',participants:staffId?[{staffId:staffId,result:'Acquis'}]:[]};
  cur='new';view='sessForm';render();window.scrollTo(0,0);
}
function openSess(id){const s=T().sessions.find(x=>x.id===id);if(!s)return;window.__trDraft=JSON.parse(JSON.stringify(s));cur=id;view='sessForm';render();window.scrollTo(0,0)}
function vSessForm(){
  const d=window.__trDraft||{},isNew=cur==='new',mg=canManage(),dis=mg?'':' disabled';
  const tr=T().catalog.map(t=>'<option value="'+t.id+'"'+(t.id===d.trainingId?' selected':'')+'>'+e(t.title)+'</option>').join('');
  const people=(mg?T().staff.filter(s=>s.active!==false||(d.participants||[]).some(p=>p.staffId===s.id)):[]).sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr')).map(s=>{
    const p=(d.participants||[]).find(p=>p.staffId===s.id);
    return '<div class="record" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="display:flex;gap:8px;align-items:center;flex:1;min-width:180px;margin:0"><input type="checkbox" id="tr-p-'+s.id+'"'+(p?' checked':'')+dis+' style="width:auto"> <span><b>'+e(s.name)+'</b> <span class="note">'+e(s.role||'')+'</span></span></label><select id="tr-r-'+s.id+'" style="max-width:150px"'+dis+'>'+opt(['Acquis','Non acquis'],p?p.result:'Acquis')+'</select></div>';
  }).join('')||(mg?'<p class="note">Aucune fiche personnel. Créez d’abord des fiches dans l’onglet Personnel.</p>':'');
  const proof=d.proof?'<p><img src="'+d.proof+'" alt="Attestation" style="max-width:260px;border:1px solid #c5d6cc;border-radius:8px;display:block"></p>'+(mg?'<button class="btn" type="button" onclick="mtTrain.clearProof()">Retirer l’attestation</button>':''):'';
  const ed='<label>Formation</label><select id="tr-s-train"'+dis+'>'+tr+'</select><div class="row"><div><label>Date</label><input id="tr-s-date" type="date" value="'+e(d.date||'')+'"'+dis+'></div><div><label>Statut</label><select id="tr-s-status"'+dis+'>'+opt(['Prévue','Réalisée'],d.status)+'</select></div><div><label>Durée (heures)</label><input id="tr-s-hours" type="number" min="0" step="0.5" value="'+e(d.hours||'')+'"'+dis+'></div></div>'
   +'<label>Formateur ou organisme</label><input id="tr-s-trainer" value="'+e(d.trainer||'')+'"'+dis+'>'
   +(mg?'<h3>Participants et résultat</h3>'+people:'')
   +'<label>Remarques</label><textarea id="tr-s-notes" rows="2"'+dis+'>'+e(d.notes||'')+'</textarea>'
   +'<label>Attestation ou feuille de présence (photo)</label>'+(mg?'<input id="tr-s-file" type="file" accept="image/*" onchange="mtTrain.pickProof(this)">':'')+proof;
  const acts=mg?'<div class="mt-pest-actions"><button class="btn primary" onclick="mtTrain.saveSess()">Enregistrer</button>'+(!isNew?'<button class="btn" onclick="mtTrain.printSess()">Feuille d’émargement</button><button class="btn danger" onclick="mtTrain.removeSess()">Supprimer</button>':'')+'</div>':'';
  return '<div class="panel"><button class="btn back" onclick="mtTrain.go(\'sessions\')">← Sessions</button><h2>'+(isNew?'Nouvelle session':'Session du '+fd(d.date))+'</h2>'+ed+acts+'</div>';
}
function readSess(){
  const d=window.__trDraft,parts=[];
  T().staff.forEach(s=>{const c=$('tr-p-'+s.id);if(c&&c.checked)parts.push({staffId:s.id,result:v('tr-r-'+s.id)||'Acquis'})});
  return Object.assign(d,{trainingId:v('tr-s-train'),date:v('tr-s-date'),status:v('tr-s-status'),hours:v('tr-s-hours'),trainer:v('tr-s-trainer'),notes:v('tr-s-notes'),participants:parts});
}
function saveSess(){
  if(!canManage())return;
  const d=readSess();
  if(!d.trainingId||!trainOf(d.trainingId)){alert('Choisissez la formation.');return}
  if(!d.date){alert('Indiquez la date.');return}
  if(d.status==='Réalisée'&&!d.participants.length){alert('Cochez au moins un participant pour une session réalisée.');return}
  const t=trainOf(d.trainingId);
  if(cur==='new'){d.id=uid();T().sessions.push(d);trace('Formation enregistrée : '+t.title,d.status,who(),(d.participants.length)+' participant(s)')}
  else{const o=T().sessions.find(x=>x.id===cur);if(!o)return;Object.assign(o,d);trace('Formation modifiée : '+t.title,d.status,who(),fd(d.date))}
  save();view='sessions';cur='';render();
}
function removeSess(){
  if(!canManage())return;const o=T().sessions.find(x=>x.id===cur);if(!o)return;
  if(!confirm('Supprimer cette session ? Les validités des participants seront recalculées.'))return;
  T().sessions=T().sessions.filter(x=>x.id!==cur);trace('Session supprimée','',who(),fd(o.date));save();view='sessions';cur='';render();
}
function pickProof(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){alert('Choisissez une image.');inp.value='';return}
  compress(f,1000,.55,function(url){
    if(!roomFor(url)){noRoom();return}
    const keep=readSess();keep.proof=url;render();
  });
}
function clearProof(){readSess();window.__trDraft.proof='';render()}

/* ---------- Catalogue ---------- */
function vCatalog(){
  const mg=canManage();
  const have=n=>T().catalog.some(t=>t.title.toLowerCase()===n.toLowerCase());
  const missing=STD.filter(x=>!have(x[0]));
  const rows=T().catalog.slice().sort((a,b)=>(a.category+a.title).localeCompare(b.category+b.title,'fr')).map(t=>'<div class="record"'+(mg?' style="cursor:pointer" onclick="mtTrain.openCat(\''+t.id+'\')"':'')+'><b>'+e(t.title)+'</b> '+badge(t.required,t.required==='Facultative'?'muted':'warn')+'<br><span class="note">'+e(t.category)+' · '+(t.months?'Recyclage tous les '+t.months+' mois':'Sans recyclage')+(t.required==='Postes concernés'&&t.postes?' · Postes : '+e(t.postes):'')+'</span></div>').join('')||'<p class="note">Catalogue vide.</p>';
  return '<div class="panel"><div class="mt-pest-headrow"><h2>Catalogue des formations</h2>'+(mg?'<span class="mt-pest-actions" style="margin:0"><button class="btn primary" onclick="mtTrain.newCat()">+ Nouvelle formation</button>'+(missing.length?'<button class="btn" onclick="mtTrain.addAllStd()">Ajouter les '+missing.length+' formations types</button>':'')+'</span>':'')+'</div><p class="note">Le recyclage définit la durée de validité. Une formation « Tout le personnel » ou « Postes concernés » est obligatoire pour les personnes visées.</p>'+rows+'</div>';
}
function newCat(){
  if(!canManage())return;
  window.__trDraft={id:'',title:'',category:CATS[0],months:12,required:REQ[0],postes:''};cur='new';view='catForm';render();window.scrollTo(0,0);
}
function openCat(id){if(!canManage())return;const t=trainOf(id);if(!t)return;window.__trDraft=JSON.parse(JSON.stringify(t));cur=id;view='catForm';render();window.scrollTo(0,0)}
function vCatForm(){
  const d=window.__trDraft||{},isNew=cur==='new';
  return '<div class="panel"><button class="btn back" onclick="mtTrain.go(\'catalog\')">← Catalogue</button><h2>'+(isNew?'Nouvelle formation':e(d.title))+'</h2><label>Intitulé</label><input id="tr-c-title" value="'+e(d.title)+'"><div class="row"><div><label>Catégorie</label><select id="tr-c-cat">'+opt(CATS,d.category)+'</select></div><div><label>Recyclage tous les (mois, 0 = aucun)</label><input id="tr-c-months" type="number" min="0" max="120" value="'+e(d.months||0)+'"></div><div><label>Concerne</label><select id="tr-c-req" onchange="mtTrain.reqChange(this.value)">'+opt(REQ,d.required)+'</select></div></div><div id="tr-c-postes-wrap"'+(d.required==='Postes concernés'?'':' hidden')+'><label>Postes concernés (mots séparés par des virgules)</label><input id="tr-c-postes" placeholder="Ex. cuisinier, commis, chef" value="'+e(d.postes||'')+'"></div>'
   +'<div class="mt-pest-actions"><button class="btn primary" onclick="mtTrain.saveCat()">Enregistrer</button>'+(!isNew?'<button class="btn danger" onclick="mtTrain.removeCat()">Supprimer</button>':'')+'</div></div>';
}
function reqChange(val){const w=$('tr-c-postes-wrap');if(w)w.hidden=val!=='Postes concernés'}
function saveCat(){
  if(!canManage())return;
  const d=window.__trDraft;Object.assign(d,{title:v('tr-c-title'),category:v('tr-c-cat'),months:Math.max(0,Number(v('tr-c-months'))||0),required:v('tr-c-req'),postes:v('tr-c-postes')});
  if(!d.title){alert('Indiquez l’intitulé.');return}
  if(T().catalog.some(t=>t.id!==d.id&&t.title.toLowerCase()===d.title.toLowerCase())){alert('Cette formation existe déjà.');return}
  if(cur==='new'){d.id=uid();T().catalog.push(d)}else{const o=trainOf(cur);if(!o)return;Object.assign(o,d)}
  save();view='catalog';cur='';render();
}
function removeCat(){
  if(!canManage())return;const o=trainOf(cur);if(!o)return;
  const n=T().sessions.filter(x=>x.trainingId===cur).length;
  if(!confirm('Supprimer « '+o.title+' » ?'+(n?' '+n+' session(s) liée(s) seront aussi supprimées.':'')))return;
  T().catalog=T().catalog.filter(t=>t.id!==cur);T().sessions=T().sessions.filter(x=>x.trainingId!==cur);save();view='catalog';cur='';render();
}
function addAllStd(){
  if(!canManage())return;
  const have=n=>T().catalog.some(t=>t.title.toLowerCase()===n.toLowerCase());
  const miss=STD.filter(x=>!have(x[0]));if(!miss.length)return;
  if(!confirm('Ajouter '+miss.length+' formations types au catalogue ?'))return;
  miss.forEach(x=>T().catalog.push({id:uid(),title:x[0],category:x[1],months:x[2],required:x[3],postes:x[4]}));
  trace('Catalogue de formations type créé','',who(),miss.length+' formation(s)');save();render();
}

/* ---------- Impressions ---------- */
function printWin(title,body){
  const site=(typeof siteDisplayName!=='undefined'&&siteDisplayName)||(typeof SITE_ID!=='undefined'?SITE_ID:'');
  const w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres contextuelles pour imprimer.');return}
  w.document.open();
  w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>'+e(title)+'</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:24px;color:#17251f}h1{color:#0d4a36;font-size:22px;margin:0 0 4px}.sub{color:#4a5c53;font-size:13px;margin-bottom:14px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #b8c7bf;padding:5px 7px;text-align:left;vertical-align:top}th{background:#e8f1ec}.sign{display:flex;gap:30px;margin-top:40px}.sign div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:12px}.ok{color:#126b3a}.warn{color:#8a5a00}.bad{color:#a52020;font-weight:700}@media print{.bar{display:none}}</style></head><body><div class="bar"><button onclick="window.print()">Imprimer</button></div><h1>'+e(title)+'</h1><div class="sub">'+e(site)+' · édité le '+new Date().toLocaleDateString('fr-FR')+' par '+e(who())+'</div>'+body+'<div class="sign"><div>Responsable HACCP</div><div>Direction</div></div></body></html>');
  w.document.close();
}
function printRegister(){
  const rows=T().sessions.filter(x=>x.status==='Réalisée').sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>{const t=trainOf(x.trainingId);return '<tr><td>'+fd(x.date)+'</td><td>'+e(t?t.title:'')+'</td><td>'+e(x.trainer||'')+'</td><td>'+e(x.hours||'')+'</td><td>'+(x.participants||[]).map(p=>{const s=staffOf(p.staffId);return e(s?s.name:'?')+(p.result==='Non acquis'?' (non acquis)':'')}).join(', ')+'</td></tr>'}).join('');
  printWin('Registre des formations du personnel','<table><thead><tr><th>Date</th><th>Formation</th><th>Formateur / organisme</th><th>Heures</th><th>Participants</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5">Aucune session réalisée.</td></tr>')+'</tbody></table>');
}
function printMatrix(){
  const staff=scopeStaff().filter(s=>s.active!==false).sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr')),cat=T().catalog;
  const head='<tr><th>Employé</th>'+cat.map(t=>'<th>'+e(t.title)+'</th>').join('')+'</tr>';
  const rows=staff.map(s=>'<tr><td>'+e(s.name)+'<br>'+e(s.role||'')+'</td>'+cat.map(t=>{const r=st(s,t);if(r.k==='na')return '<td>—</td>';return '<td class="'+cls(r.k)+'">'+e(r.k==='ok'?'Valide':r.k==='soon'?'À renouveler':r.k==='late'?'Expirée':'Manquante')+(r.exp?'<br>'+fd(r.exp):'')+'</td>'}).join('')+'</tr>').join('');
  printWin('Matrice de compétences du personnel','<table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>');
}
function printStaff(){
  const s=staffOf(cur);if(!s)return;
  const rows=T().catalog.map(t=>{const r=st(s,t);if(r.k==='na')return '';return '<tr><td>'+e(t.title)+'</td><td>'+fd(r.date)+'</td><td>'+fd(r.exp)+'</td><td class="'+cls(r.k)+'">'+e(r.txt)+'</td></tr>'}).join('');
  const hab=(s.habil||[]).map(h=>'<tr><td>'+e(h.title)+'</td><td>'+fd(h.date)+'</td><td>'+fd(h.expires)+'</td><td>'+e(habState(h).txt)+'</td></tr>').join('');
  printWin('Fiche individuelle de formation — '+s.name,'<p>Poste : <b>'+e(s.role||'—')+'</b> · Entrée : '+fd(s.hired)+'</p><h3>Formations</h3><table><thead><tr><th>Formation</th><th>Dernière session</th><th>Échéance</th><th>État</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4">Aucune formation applicable.</td></tr>')+'</tbody></table><h3>Habilitations</h3><table><thead><tr><th>Habilitation</th><th>Accordée le</th><th>Échéance</th><th>État</th></tr></thead><tbody>'+(hab||'<tr><td colspan="4">Aucune.</td></tr>')+'</tbody></table>');
}
function printSess(){
  const x=T().sessions.find(y=>y.id===cur);if(!x)return;const t=trainOf(x.trainingId);
  const rows=(x.participants||[]).map(p=>{const s=staffOf(p.staffId);return '<tr><td>'+e(s?s.name:'?')+'</td><td>'+e(s?s.role||'':'')+'</td><td style="height:34px"></td></tr>'}).join('');
  printWin('Feuille d’émargement — '+(t?t.title:'Formation'),'<p>Date : <b>'+fd(x.date)+'</b> · Durée : '+e(x.hours||'—')+' h · Formateur / organisme : '+e(x.trainer||'—')+'</p><table><thead><tr><th>Nom et prénom</th><th>Poste</th><th style="width:30%">Signature</th></tr></thead><tbody>'+(rows||'<tr><td colspan="3">Aucun participant.</td></tr>')+'</tbody></table>');
}

window.mtTrain={go:go,openStaff:openStaff,newStaff:function(){newStaff()},saveStaff:saveStaff,removeStaff:removeStaff,addHab:addHab,delHab:delHab,importAccounts:importAccounts,
  newSess:newSess,openSess:openSess,saveSess:saveSess,removeSess:removeSess,pickProof:pickProof,clearProof:clearProof,
  newCat:newCat,openCat:openCat,saveCat:saveCat,removeCat:removeCat,reqChange:reqChange,addAllStd:addAllStd,
  printRegister:printRegister,printMatrix:printMatrix,printStaff:printStaff,printSess:printSess,
  filter:function(k){fSt=k;render()},fsess:function(k){fSess=k;render()},search:function(s){q=s;render();const i=$('tr-q');if(i){i.focus();i.setSelectionRange(s.length,s.length)}}};
window.mtTrainAlerts=function(){const mg=canManage(),list=mg?activeStaff():myStaff().filter(x=>x.active!==false),g=gaps(list);return {late:g.filter(x=>x.r.k==='late').length,none:g.filter(x=>x.r.k==='none').length,soon:g.filter(x=>x.r.k==='soon').length}};
window.mtTrainOpen=open;
})();

</script>
<script id="mt-notify-module">
/* Notifications : centre d'alertes (cloche), bandeau à l'ouverture et notifications du téléphone tant que l'application est ouverte.
   Aucune donnée envoyée à un serveur : les alertes sont calculées sur les données déjà chargées. Réglages enregistrés sur l'appareil. */
(function(){
'use strict';
const CATS=[['dlc','Produits : DLC dépassée ou proche'],['temp','Températures non conformes et relevé du jour'],['train','Formations et habilitations'],['docs','Documents à réviser'],['pest','Visite du prestataire nuisibles']];
const KEY='mtNotifPrefs',SEEN='mtNotifSeen',SENT='mtNotifSent';
let panel=null,bell=null,toast=null,timer=null,lastSig='';
function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(_){return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
function e(x){return typeof esc==='function'?esc(x):String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function prof(){return (typeof currentUserProfile!=='undefined'&&currentUserProfile)||null}
function canManage(){const p=prof();return !!p&&['admin','responsable','haccp'].includes(p.role)}
function prefs(){const p=ls(KEY,{});CATS.forEach(c=>{if(typeof p[c[0]]!=='boolean')p[c[0]]=true});return p}
function ready(){return typeof S!=='undefined'&&S&&prof()&&typeof SITE_ID!=='undefined'&&SITE_ID!=='main'&&!document.body.classList.contains('on-login')}

function compute(){
  const out=[],t=today(),P=prefs(),now=new Date();now.setHours(0,0,0,0);
  if(P.dlc){
    let exp=0,td=0,soon=0;
    (Array.isArray(S.stock)?S.stock:[]).forEach(x=>{if(!x||!x.dlc)return;const n=Math.ceil((new Date(x.dlc+'T00:00:00')-now)/86400000);if(n<0)exp++;else if(n===0)td++;else if(n<=3)soon++});
    if(exp)out.push({id:'dlc-exp-'+exp,cat:'dlc',lvl:'bad',title:exp+' produit(s) avec DLC dépassée',detail:'À retirer ou à traiter immédiatement.',go:'stock()'});
    if(td)out.push({id:'dlc-td-'+td,cat:'dlc',lvl:'bad',title:td+' produit(s) à consommer aujourd’hui',detail:'DLC atteinte aujourd’hui.',go:'stock()'});
    if(soon)out.push({id:'dlc-soon-'+soon,cat:'dlc',lvl:'warn',title:soon+' produit(s) avec DLC dans 3 jours ou moins',detail:'Prévoir leur utilisation.',go:'stock()'});
  }
  if(P.temp){
    const temps=Array.isArray(S.temps)?S.temps:[];
    const recent=temps.filter(x=>x&&x.ok===false&&x.createdAt&&(Date.now()-new Date(x.createdAt).getTime())<24*3600*1000);
    if(recent.length)out.push({id:'temp-nc-'+recent.length+'-'+(recent[0].id||''),cat:'temp',lvl:'bad',title:recent.length+' température(s) non conforme(s) ces dernières 24 h',detail:recent.slice(0,2).map(x=>x.equipment+' : '+x.value+' °C').join(' · '),go:'temperatures()'});
    const eq=(Array.isArray(S.equipment)?S.equipment:[]).filter(x=>x&&!x.outOfService);
    const doneToday=temps.some(x=>x&&x.createdAt&&String(x.createdAt).slice(0,10)===t);
    if(eq.length&&!doneToday&&now.getTime()<=Date.now()&&new Date().getHours()>=11)out.push({id:'temp-today-'+t,cat:'temp',lvl:'warn',title:'Aucun relevé de température aujourd’hui',detail:'Pensez à relever vos équipements.',go:'temperatures()'});
  }
  if(P.train&&typeof window.mtTrainAlerts==='function'){
    try{const a=window.mtTrainAlerts();
      if(a.late+a.none)out.push({id:'train-bad-'+a.late+'-'+a.none,cat:'train',lvl:'bad',title:(a.late+a.none)+' formation(s) ou habilitation(s) expirée(s) ou manquante(s)',detail:'Ouvrez Formation du personnel pour planifier une session.',go:'mtTrainOpen()'});
      if(a.soon)out.push({id:'train-soon-'+a.soon,cat:'train',lvl:'warn',title:a.soon+' échéance(s) de formation dans 30 jours',detail:'À renouveler prochainement.',go:'mtTrainOpen()'});
    }catch(_){}
  }
  if(P.docs&&canManage()){
    const items=(S.docs&&Array.isArray(S.docs.items))?S.docs.items.filter(d=>d.status==='En vigueur'&&d.nextReview):[];
    const late=items.filter(d=>days(t,d.nextReview)<0).length,soon=items.filter(d=>{const n=days(t,d.nextReview);return n>=0&&n<=30}).length;
    if(late)out.push({id:'docs-late-'+late,cat:'docs',lvl:'bad',title:late+' document(s) à réviser en retard',detail:'Ouvrez Gestion documentaire.',go:'mtDocsOpen()'});
    if(soon)out.push({id:'docs-soon-'+soon,cat:'docs',lvl:'warn',title:soon+' document(s) à réviser sous 30 jours',detail:'Révision à prévoir.',go:'mtDocsOpen()'});
  }
  if(P.pest&&canManage()&&S.pest&&S.pest.provider&&S.pest.provider.nextVisit){
    const n=days(t,S.pest.provider.nextVisit);
    if(n<0)out.push({id:'pest-late-'+S.pest.provider.nextVisit,cat:'pest',lvl:'bad',title:'Visite du prestataire nuisibles en retard',detail:'Prévue le '+new Date(S.pest.provider.nextVisit+'T12:00:00').toLocaleDateString('fr-FR')+'.',go:'mtPestOpen()'});
    else if(n<=7)out.push({id:'pest-soon-'+S.pest.provider.nextVisit,cat:'pest',lvl:'warn',title:n===0?'Visite du prestataire nuisibles aujourd’hui':'Visite du prestataire nuisibles dans '+n+' jour(s)',detail:'Préparez le registre et l’accès aux locaux.',go:'mtPestOpen()'});
  }
  out.sort((a,b)=>(a.lvl===b.lvl?0:a.lvl==='bad'?-1:1));
  return out;
}
function seenMap(){const m=ls(SEEN,{});return m.day===today()?m:{day:today(),ids:{}}}
function unseen(list){const m=seenMap();return list.filter(a=>!(m.ids||{})[a.id])}

function css(){

  const s=document.createElement('style');s.id='mt-notify-css';
  s.textContent='.mtn-bell{position:fixed;z-index:99978;width:50px;height:50px;border-radius:50%;border:0;background:#0f6b45;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;right:22px;bottom:22px;zoom:1}'

  +'.mtn-badge.warn{background:#e08a00}.mtn-badge[hidden]{display:none}'
  +'.mtn-overlay{position:fixed;inset:0;z-index:99990;background:rgba(10,30,22,.5);display:flex;align-items:flex-end;justify-content:center;zoom:1}'
  +'.mtn-sheet{background:#fff;width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));font-family:system-ui,Segoe UI,Arial,sans-serif;color:#17251f;box-sizing:border-box}'
  +'@media(min-width:851px){.mtn-overlay{align-items:center}.mtn-sheet{border-radius:16px}}'
  +'.mtn-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.mtn-head h2{margin:0;font-size:19px;color:#0d4a36}'
  +'.mtn-x{border:0;background:#eef3f0;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}'
  +'.mtn-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-left:5px solid #e08a00;background:#fff7e6;border-radius:10px;padding:11px 12px;margin:8px 0;font:inherit;color:inherit;cursor:pointer}'
  +'.mtn-item.bad{border-color:#c62828;background:#fdecec}.mtn-item b{display:block;font-size:15px}.mtn-item span{font-size:13px;color:#4a5c53}.mtn-item.seen{opacity:.6}'
  +'.mtn-ok{padding:14px;background:#e8f6ee;border-left:5px solid #1b8a4b;border-radius:10px;margin:8px 0;font-weight:600}'
  +'.mtn-set{border-top:1px solid #dfe8e2;margin-top:14px;padding-top:10px}.mtn-set h3{font-size:15px;margin:0 0 6px}'
  +'.mtn-set label{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}.mtn-set input{width:20px;height:20px}'
  +'.mtn-btn{border:0;border-radius:10px;padding:10px 14px;background:#0f6b45;color:#fff;font:600 14px system-ui,Arial,sans-serif;cursor:pointer;margin:4px 6px 4px 0}.mtn-btn.alt{background:#eef3f0;color:#17594a}'
  +'.mtn-note{font-size:12.5px;color:#5a6b62;margin:6px 0}'
  +'.mtn-toast{position:fixed;z-index:99995;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:520px;margin:0 auto;background:#143d30;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 26px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font:14px system-ui,Arial,sans-serif;zoom:1}'
  +'.mtn-toast b{display:block;font-size:15px}.mtn-toast button{border:0;border-radius:9px;padding:8px 12px;font:600 13px system-ui,Arial,sans-serif;cursor:pointer;background:#fff;color:#0d4a36}.mtn-toast .x{background:transparent;color:#fff;font-size:20px;padding:2px 8px}';
  document.head.appendChild(s);
}
function ensureBell(){
  css();
  if(!bell){
    bell=document.createElement('button');bell.type='button';bell.className='mtn-bell';bell.setAttribute('aria-label','Notifications');
    bell.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 0 0 4 0"/></svg><span class="mtn-badge" hidden></span>';
    bell.onclick=openPanel;document.documentElement.appendChild(bell);
  }
}
function updateBell(list){
  if(!bell)return;
  const u=unseen(list),b=bell.querySelector('.mtn-badge');
  b.hidden=!u.length;b.textContent=u.length;b.className='mtn-badge'+(u.some(a=>a.lvl==='bad')?'':' warn');
}
function hideBell(){if(bell){bell.style.display='none'}if(toast){toast.remove();toast=null}}
function showBell(){if(bell)bell.style.display=''}

function permState(){return ('Notification' in window)?Notification.permission:'unsupported'}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function standalone(){return window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function sysNotify(a){
  if(permState()!=='granted')return;
  const opts={body:a.detail||'',icon:'icon.svg',badge:'icon.svg',tag:'mt-'+a.cat,renotify:false,data:{go:a.go}};
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.showNotification)r.showNotification(a.title,opts);else new Notification(a.title,opts)}).catch(()=>{try{new Notification(a.title,opts)}catch(_){}});
    }else new Notification(a.title,opts);
  }catch(_){}
}
function showToast(list){
  if(toast){toast.remove();toast=null}
  const bad=list.filter(a=>a.lvl==='bad').length;
  toast=document.createElement('div');toast.className='mtn-toast';
  toast.innerHTML='<div style="flex:1"><b>'+list.length+' alerte(s) à traiter</b>'+e(list[0].title)+(list.length>1?' …':'')+'</div><button type="button" class="v">Voir</button><button type="button" class="x" aria-label="Fermer">×</button>';
  toast.querySelector('.v').onclick=function(){toast.remove();toast=null;openPanel()};
  toast.querySelector('.x').onclick=function(){toast.remove();toast=null};
  document.documentElement.appendChild(toast);
  setTimeout(function(){if(toast){toast.remove();toast=null}},9000);
}
function check(){
  if(!ready()){hideBell();return}
  ensureBell();showBell();
  const list=compute(),u=unseen(list);
  updateBell(list);
  const sent=ls(SENT,{});const day=today();const ids=sent.day===day?sent.ids||[]:[];
  const fresh=u.filter(a=>ids.indexOf(a.id)<0);
  if(fresh.length){
    showToast(u);
    fresh.forEach(sysNotify);
    ss(SENT,{day:day,ids:ids.concat(fresh.map(a=>a.id))});
  }
  const sig=list.map(a=>a.id).join('|');
  if(panel&&sig!==lastSig){lastSig=sig;renderPanel()}
}
function closePanel(){if(panel){panel.remove();panel=null}}
function openPanel(){
  if(panel)return;
  if(toast){toast.remove();toast=null}
  panel=document.createElement('div');panel.className='mtn-overlay';
  panel.onclick=function(ev){if(ev.target===panel)closePanel()};
  document.documentElement.appendChild(panel);renderPanel();
}
function renderPanel(){
  if(!panel)return;
  const list=compute(),seen=seenMap(),P=prefs();
  const items=list.map((a,i)=>'<button type="button" class="mtn-item '+a.lvl+((seen.ids||{})[a.id]?' seen':'')+'" data-i="'+i+'"><div><b>'+e(a.title)+'</b><span>'+e(a.detail||'')+'</span></div></button>').join('')||'<div class="mtn-ok">Aucune alerte. Tout est à jour.</div>';
  const ps=permState();
  let sys='';
  if(ps==='unsupported')sys='<p class="mtn-note">'+(isIOS()&&!standalone()?'Sur iPhone, ajoutez d’abord l’application à l’écran d’accueil (Partager puis « Sur l’écran d’accueil »), ouvrez-la depuis l’icône, puis activez les notifications ici.':'Les notifications du téléphone ne sont pas disponibles sur ce navigateur. Les alertes restent visibles ici.')+'</p>';
  else if(ps==='granted')sys='<p class="mtn-note">Notifications du téléphone activées (tant que l’application est ouverte).</p><button type="button" class="mtn-btn alt" id="mtn-test">Envoyer un test</button>';
  else if(ps==='denied')sys='<p class="mtn-note">Notifications bloquées dans les réglages du téléphone ou du navigateur. Autorisez-les pour ce site puis revenez ici.</p>';
  else sys='<button type="button" class="mtn-btn" id="mtn-perm">Activer les notifications du téléphone</button><p class="mtn-note">'+(isIOS()&&!standalone()?'Sur iPhone, cela ne fonctionne que si l’application est ajoutée à l’écran d’accueil (iOS 16.4 ou plus).':'Une fenêtre du téléphone va vous demander l’autorisation.')+'</p>';
  const checks=CATS.map(c=>'<label><input type="checkbox" data-c="'+c[0]+'"'+(P[c[0]]?' checked':'')+'> '+e(c[1])+'</label>').join('');
  panel.innerHTML='<div class="mtn-sheet" role="dialog" aria-label="Notifications"><div class="mtn-head"><h2>Notifications</h2><button type="button" class="mtn-x" aria-label="Fermer">×</button></div>'+items+(list.length?'<button type="button" class="mtn-btn alt" id="mtn-seen">Marquer tout comme vu</button>':'')
   +'<div class="mtn-set"><h3>Téléphone</h3>'+sys+'<h3 style="margin-top:12px">Alertes souhaitées</h3>'+checks+'<p class="mtn-note">Ces réglages sont enregistrés sur cet appareil. Les alertes apparaissent quand l’application est ouverte.</p></div></div>';
  panel.querySelector('.mtn-x').onclick=closePanel;
  panel.querySelectorAll('.mtn-item').forEach(function(b){b.onclick=function(){const a=list[+b.dataset.i];if(!a)return;const m=seenMap();m.ids=m.ids||{};m.ids[a.id]=1;ss(SEEN,m);closePanel();try{(new Function(a.go))()}catch(_){}check()}});
  const sn=panel.querySelector('#mtn-seen');if(sn)sn.onclick=function(){const m=seenMap();m.ids=m.ids||{};list.forEach(a=>{m.ids[a.id]=1});ss(SEEN,m);renderPanel();updateBell(list)};
  const pm=panel.querySelector('#mtn-perm');if(pm)pm.onclick=function(){try{const r=Notification.requestPermission(function(){renderPanel();check()});if(r&&r.then)r.then(function(){renderPanel();check()})}catch(_){renderPanel()}};
  const ts=panel.querySelector('#mtn-test');if(ts)ts.onclick=function(){sysNotify({cat:'test',title:'Notifications activées',detail:'Vous recevrez ici les alertes de M&T HACCP.',go:''})};
  panel.querySelectorAll('input[data-c]').forEach(function(c){c.onchange=function(){const p=prefs();p[c.dataset.c]=c.checked;ss(KEY,p);renderPanel();check()}});
}
window.mtNotify={open:openPanel,check:check,compute:compute};
function start(){check();if(!timer)timer=setInterval(check,5000);document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});window.addEventListener('focus',check)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

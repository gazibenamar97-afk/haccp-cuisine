<script id="mt-pest-module">
/* Module : Plan de lutte contre les nuisibles
   Données : S.pest = { plan, traps[], activity[], inspections[], interventions[], followups[], provider{} }
   Synchronisées avec le reste de l'état (localStorage + Firestore) via save(). */
(function(){
'use strict';
const TABS=[['overview','Vue d’ensemble'],['plan','Plan des pièges'],['rounds','Relevés d’activité'],['inspections','Inspections'],['provider','Prestataire'],['followups','Fiches de suivi']];
const TRAP_TYPES=['Boîte d’appâtage (rongeurs)','Piège à glu (rongeurs)','Piège mécanique (rongeurs)','Lampe UV (insectes volants)','Piège à phéromones (mites)','Piège à glu (insectes rampants)','Autre dispositif'];
const ACTIVITY=['Aucune activité','Activité détectée','Capture','Appât consommé','Piège endommagé ou déplacé','Piège manquant'];
const POINTS=['Traces ou excréments de rongeurs','Insectes rampants (blattes, fourmis…)','Insectes volants (mouches, mites…)','Points d’entrée ouverts (portes, aérations, trous)','Stockage des denrées et emballages (surélevés, fermés)','Déchets et local poubelles','Propreté sous et derrière les équipements','Pièges en place, accessibles et en bon état'];
const ZONES=['Cuisine principale','Réserve sèche','Chambre froide','Zone de réception','Local poubelles','Plonge / laverie','Restaurant / salle','Vestiaires et sanitaires','Extérieur / abords','Autre'];
const INT_TYPES=['Contrôle préventif','Dératisation','Désinsectisation','Désinfection','Intervention curative','Autre'];
const PESTS=['Rongeurs','Blattes','Mouches / insectes volants','Mites alimentaires','Fourmis','Oiseaux','Autre'];
const SEVERITY=['Mineure','Majeure','Critique'];
const FSTATUS=['Ouverte','En cours','Clôturée'];
let curPlan='',tab='overview',placing='',fFilter='Toutes',editFiche='',photos={},openInsp='';

function $(id){return document.getElementById(id)}
function v(id){const e=$(id);return e?String(e.value||'').trim():''}
function e(x){return typeof esc==='function'?esc(x):String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function P(){
  if(!S.pest||typeof S.pest!=='object')S.pest={};
  const p=S.pest;
  ['traps','activity','inspections','interventions','followups'].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[]});
  if(!p.provider||typeof p.provider!=='object')p.provider={};
  if(!Array.isArray(p.plans))p.plans=[];
  if(!p.plans.length&&(p.plan||(p.planData&&p.planData.length))){p.plans.push({id:'plan1',name:'Plan principal',image:p.plan||'',data:p.planData||[]});p.traps.forEach(t=>{if(!t.planId&&typeof t.x==='number')t.planId='plan1'})}
  delete p.plan;delete p.planData;
  return p;
}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fd(s){if(!s)return '—';if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const d=new Date(s+'T12:00:00');return d.toLocaleDateString('fr-FR')}const d=new Date(s);return isNaN(d)?e(s):d.toLocaleString('fr-FR')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function prof(){return (typeof currentUserProfile!=='undefined'&&currentUserProfile)||{}}
function who(){const p=prof();const n=p.displayName||p.name||p.username||p.email||'';return n.includes('@')?n.split('@')[0]:n}
function canManage(){return ['admin','responsable','haccp'].includes(prof().role)}
function stamp(o){const p=prof();o.actorUid=p.uid||'';o.actorRole=p.role||'';o.createdAt=new Date().toISOString();return o}
function trace(summary,status,operator,note){
  if(!Array.isArray(S.trace))S.trace=[];
  S.trace.unshift({type:'Nuisibles',product:summary,date:new Date().toLocaleString('fr-FR'),status:status||'',operator:operator||'',note:note||''});
}
function persist(){save()}
function days(from,to){return Math.round((new Date(to+'T12:00:00')-new Date(from+'T12:00:00'))/86400000)}
function badge(txt,cls){return '<span class="mt-pest-badge '+cls+'">'+e(txt)+'</span>'}
function optList(list,sel,placeholder){return (placeholder?'<option value="">'+e(placeholder)+'</option>':'')+list.map(x=>'<option'+(x===sel?' selected':'')+'>'+e(x)+'</option>').join('')}
function activeTraps(){return P().traps.filter(t=>t.active!==false)}
function lastReading(trapId){
  let best=null;
  P().activity.forEach(a=>{if(a.trapId===trapId&&(!best||(a.date+a.createdAt)>(best.date+best.createdAt)))best=a});
  return best;
}
function trapState(t){
  const l=lastReading(t.id),freq=Number(t.freq)||7;
  if(!l)return {l:null,late:true,txt:'Jamais relevé',cls:'warn'};
  const age=days(l.date,today());
  const abnormal=l.status!==ACTIVITY[0];
  return {l,late:age>freq,txt:fd(l.date)+(abnormal?' · '+l.status:''),cls:abnormal?'bad':(age>freq?'warn':'ok'),age};
}
function openFollowups(){return P().followups.filter(f=>f.status!=='Clôturée')}
function nextRef(){const n=1+P().followups.reduce((m,f)=>Math.max(m,Number(String(f.reference||'').replace('NUI-',''))||0),0);return 'NUI-'+String(n).padStart(4,'0')}

/* ---------- photos ---------- */
function compress(file,maxW,q,done){
  if(!file)return;
  const r=new FileReader();
  r.onload=function(){const im=new Image();im.onload=function(){
    const s=Math.min(1,maxW/im.width,maxW/im.height),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(im,0,0,w,h);
    done(cv.toDataURL('image/webp',q));
  };im.src=r.result};
  r.readAsDataURL(file);
}
function roomFor(url){try{return JSON.stringify(S).length+String(url).length<900000}catch(_){return true}}
function noRoom(){alert('Espace de stockage de l’établissement presque plein : cette image n’a pas été ajoutée. Utilisez une image plus petite ou supprimez d’anciennes photos.')}
function pickPhoto(key,file){
  compress(file,800,.55,function(url){if(!roomFor(url)){noRoom();return}photos[key]=url;const p=$('pst-prev-'+key);if(p)p.innerHTML='<img src="'+url+'" alt="Photo jointe" style="max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:6px"><button type="button" class="btn" style="margin-top:6px;padding:6px 10px" onclick="mtPest.dropPhoto(\''+key+'\')">Retirer la photo</button>'});
}
function dropPhoto(key){delete photos[key];const p=$('pst-prev-'+key);if(p)p.innerHTML=''}
function photoField(key,label){return '<label>'+e(label)+'</label><input type="file" accept="image/*" onchange="mtPest.pickPhoto(\''+key+'\',this.files[0])"><div id="pst-prev-'+key+'">'+(photos[key]?'<img src="'+photos[key]+'" alt="Photo jointe" style="max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:6px">':'')+'</div>'}
function thumb(url,alt){return url?'<img src="'+url+'" alt="'+e(alt)+'" style="max-width:130px;max-height:90px;border-radius:8px;cursor:zoom-in;margin-top:6px" onclick="mtPest.zoom(this.src)">':''}
function zoom(src){if(typeof haccpEnlargePhoto==='function'){haccpEnlargePhoto(src);return}const w=window.open('','_blank');if(w){w.document.write('<img src="'+src+'" style="max-width:100%">');w.document.close()}}

/* ---------- affichage ---------- */
function shell(body){
  const n=openFollowups().length;
  const tabs=TABS.map(([k,l])=>'<button type="button" class="mt-pest-tab'+(k===tab?' active':'')+'" onclick="mtPest.tab(\''+k+'\')">'+e(l)+(k==='followups'&&n?' <span class="mt-pest-count">'+n+'</span>':'')+'</button>').join('');
  return '<section class="mt-pest-view"><button class="btn back" onclick="home()">← Accueil</button><h1>Plan de lutte contre les nuisibles</h1><div class="mt-pest-tabs" role="tablist">'+tabs+'</div>'+body+'</section>';
}
function render(){
  const root=$('app');if(!root)return;
  let body='';
  try{
    body=tab==='plan'?vPlan():tab==='rounds'?vRounds():tab==='inspections'?vInspections():tab==='provider'?vProvider():tab==='followups'?vFollowups():vOverview();
  }catch(err){console.error('Nuisibles',err);body='<div class="panel"><p>Erreur d’affichage : '+e(err&&err.message||err)+'</p></div>'}
  root.innerHTML=shell(body);
}
function open(){
  if(typeof SITE_ID!=='undefined'&&SITE_ID==='main'){alert('Module réservé aux établissements');return}
  if(typeof CURRENT_VIEW!=='undefined')CURRENT_VIEW='pest';
  document.body.classList.remove('on-home','mt-premium-active','on-login');
  const legacy=document.querySelector('body > nav');if(legacy)legacy.style.display='none';
  const ps=$('mtPcShell');if(ps)ps.hidden=false;
  P();render();window.scrollTo(0,0);
}
function setTab(k){tab=k;if(k!=='plan')placing='';if(k!=='followups')editFiche='';render();window.scrollTo(0,0)}

/* ----- vue d'ensemble ----- */
function vOverview(){
  const p=P(),t=today(),traps=activeTraps();
  const since=addDays(t,-30);
  const act30=p.activity.filter(a=>a.date>=since&&a.status!==ACTIVITY[0]).length;
  const open=openFollowups();
  const late=open.filter(f=>f.due&&f.due<t).length;
  const next=p.provider.nextVisit||'';
  const nextLate=next&&next<t;
  const toCheck=traps.filter(x=>trapState(x).late);
  const lastInsp=p.inspections.reduce((m,i)=>i.date>m?i.date:m,'');
  const alerts=[];
  if(!traps.length)alerts.push(['warn','Aucun piège défini. Commencez par le plan des pièges.','plan']);
  if(toCheck.length)alerts.push(['warn',toCheck.length+' piège(s) à relever : '+toCheck.slice(0,6).map(x=>e(x.code)).join(', ')+(toCheck.length>6?'…':''),'rounds']);
  if(nextLate)alerts.push(['bad','Visite du prestataire en retard (prévue le '+fd(next)+').','provider']);
  else if(!next)alerts.push(['warn','Prochaine visite du prestataire non planifiée.','provider']);
  if(!lastInsp||days(lastInsp,t)>30)alerts.push(['warn','Aucune inspection interne depuis plus de 30 jours.','inspections']);
  if(late)alerts.push(['bad',late+' fiche(s) de suivi en retard.','followups']);
  const alertHtml=alerts.length?alerts.map(a=>'<button type="button" class="mt-pest-alert '+a[0]+'" onclick="mtPest.tab(\''+a[2]+'\')">'+a[1]+'<span>Voir →</span></button>').join(''):'<div class="mt-pest-alert ok">Tout est à jour.</div>';
  const events=[];
  p.activity.filter(a=>a.status!==ACTIVITY[0]).forEach(a=>events.push({d:a.date,c:a.createdAt||'',t:'Relevé',s:(a.trapCode||'')+' · '+a.status+(a.count?' ('+a.count+')':''),k:'bad'}));
  p.inspections.forEach(i=>events.push({d:i.date,c:i.createdAt||'',t:'Inspection',s:(i.zone||'')+' · '+i.status,k:i.status==='Conforme'?'ok':'bad'}));
  p.interventions.forEach(i=>events.push({d:i.date,c:i.createdAt||'',t:'Prestataire',s:(i.type||'')+(i.technician?' · '+i.technician:''),k:'muted'}));
  p.followups.forEach(f=>events.push({d:f.opened,c:f.createdAt||'',t:'Fiche '+(f.reference||''),s:(f.title||'')+' · '+f.status,k:f.status==='Clôturée'?'ok':'warn'}));
  events.sort((a,b)=>(b.d+b.c).localeCompare(a.d+a.c));
  const rec=events.slice(0,8).map(x=>'<div class="record"><b>'+e(x.t)+'</b> — '+fd(x.d)+'<br><span class="note">'+e(x.s)+'</span></div>').join('')||'<p class="note">Aucun évènement enregistré.</p>';
  return '<div class="cards mt-pest-cards">'
   +'<div class="metric"><span>Pièges actifs</span><b>'+traps.length+'</b></div>'
   +'<div class="metric"><span>Activité sur 30 jours</span><b class="'+(act30?'mt-pest-red':'')+'">'+act30+'</b></div>'
   +'<div class="metric"><span>Fiches ouvertes</span><b class="'+(open.length?'mt-pest-orange':'')+'">'+open.length+'</b></div>'
   +'<div class="metric"><span>Prochaine visite</span><b class="mt-pest-small '+(nextLate?'mt-pest-red':'')+'">'+(next?fd(next):'À planifier')+'</b></div></div>'
   +'<div class="panel"><h2>À traiter</h2>'+alertHtml+'<div class="mt-pest-actions"><button class="btn primary" onclick="mtPest.tab(\'rounds\')">Faire un relevé</button><button class="btn" onclick="mtPest.tab(\'inspections\')">Nouvelle inspection</button><button class="btn" onclick="mtPest.newFiche()">Ouvrir une fiche de suivi</button></div></div>'
   +'<div class="panel"><h2>Derniers évènements</h2>'+rec+'</div>';
}

/* ----- plan des pièges ----- */
function curP(){const pl=P().plans;return pl.find(x=>x.id===curPlan)||pl[0]||null}
function planName(id){const x=P().plans.find(z=>z.id===id);return x?x.name:'—'}
function roomsOf(id){const pl=P().plans.find(x=>x.id===id);return pl?Array.from(new Set((pl.data||[]).filter(x=>x.t==='room'&&x.label).map(x=>x.label))):[]}
const OTHER='Autre local…';
function localOpts(id){return optList(roomsOf(id).concat([OTHER]),'','Choisir un local')}
function vPlan(){
  const p=P(),mg=canManage(),traps=p.traps,pl=curP();
  const chips=p.plans.map(x=>'<button type="button" class="mt-pest-chip'+(pl&&x.id===pl.id?' active':'')+'" onclick="mtPest.selPlan(\''+x.id+'\')">'+e(x.name)+'</button>').join('')+(mg?'<button type="button" class="mt-pest-chip" onclick="mtPest.newPlan()">+ Nouveau plan</button>':'');
  let plan='';
  if(!pl){plan='<p class="note">Aucun plan. '+(mg?'Créez un plan par lieu (ex. Cuisine centrale, Restaurant, Annexe, Réserve extérieure).':'')+'</p>'}
  else{
    if(pl.image){
      const markers=traps.filter(t=>t.planId===pl.id&&t.active!==false&&typeof t.x==='number').map(t=>{const s=trapState(t);return '<span class="mt-pest-marker '+s.cls+(placing===t.id?' placing':'')+'" style="left:'+t.x+'%;top:'+t.y+'%" title="'+e(t.code+' · '+t.location)+'">'+e(t.code)+'</span>'}).join('');
      plan='<div class="mt-pest-planbox'+(placing?' placing':'')+'" onclick="mtPest.planClick(event)"><img src="'+pl.image+'" alt="'+e(pl.name)+'" id="pst-planimg">'+markers+'</div>'
        +(placing?'<p class="note"><b>Touchez le plan</b> pour placer le piège '+e((traps.find(t=>t.id===placing)||{}).code||'')+'. <button class="btn" style="padding:6px 10px" onclick="mtPest.cancelPlace()">Annuler</button></p>':'<p class="note">Les pastilles montrent l’état du dernier relevé : vert conforme, orange à relever, rouge activité détectée.</p>');
    }else plan='<p class="note">Ce plan est vide. '+(mg?'Dessinez-le ou importez une image.':'')+'</p>';
    if(mg)plan+='<div class="mt-pest-actions" style="margin:0 0 10px"><button class="btn primary" onclick="mtPest.draw()">'+((pl.data&&pl.data.length)?'Modifier le dessin':'Dessiner ce plan')+'</button><button class="btn" onclick="mtPest.renamePlan()">Renommer</button><button class="btn" onclick="mtPest.removePlan()">Supprimer ce plan</button></div><label>'+(pl.image?'Remplacer par une image importée':'Ou importer une image')+'</label><input type="file" accept="image/*" onchange="mtPest.uploadPlan(this.files[0])">';
  }
  const rows=traps.map(t=>{
    const s=t.active===false?{txt:'Retiré le '+fd(t.removedAt),cls:'muted'}:trapState(t);
    return '<tr class="'+(t.active===false?'mt-pest-muted':'')+'"><td><b>'+e(t.code)+'</b></td><td>'+e(t.type)+'</td><td>'+e(planName(t.planId))+'</td><td>'+e(t.location)+'</td><td>'+(Number(t.freq)||7)+' j</td><td>'+badge(s.txt,s.cls)+'</td><td class="mt-pest-rowact">'
      +(mg&&t.active!==false?'<button class="btn" onclick="mtPest.place(\''+t.id+'\')">'+(typeof t.x==='number'?'Déplacer':'Placer')+'</button><button class="btn" onclick="mtPest.removeTrap(\''+t.id+'\')">Retirer</button>':'')+'</td></tr>';
  }).join('');
  const table=traps.length?'<div class="mt-pest-tablewrap"><table class="mt-pest-table"><thead><tr><th>Code</th><th>Type</th><th>Plan</th><th>Local</th><th>Relevé tous les</th><th>Dernier relevé</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="note">Aucun piège enregistré.</p>';
  let form='<p class="note">Seuls les responsables peuvent modifier le plan des pièges.</p>';
  if(mg){
    form='';
  }
  return '<div class="panel"><div class="mt-pest-headrow"><h2>Plans des locaux</h2>'+(mg?'<button class="btn primary" onclick="mtPest.addTrapStart()">+ Ajouter un piège</button>':'')+'</div><div class="mt-pest-chips">'+chips+'</div>'+plan+'</div><div class="panel"><div class="mt-pest-headrow"><h2>Registre des pièges</h2><button class="btn" onclick="mtPest.printRegister()">Imprimer le registre</button></div>'+table+'</div>'+form;
}
function addTrapStart(){
  if(!canManage()){alert('Action réservée aux responsables.');return}
  if(!P().plans.length){newPlan();if(!P().plans.length)return}
  const pl=curP();
  drOpen((pl.data&&pl.data.some(x=>x.t==='room'))||pl.image?'trap':'room');
}
function selPlan(id){curPlan=id;placing='';render()}
function newPlan(){
  if(!canManage())return;
  const n=prompt('Nom du plan (ex. Cuisine centrale, Restaurant, Annexe, Réserve extérieure) :');
  if(!n||!n.trim())return;
  const pl={id:uid(),name:n.trim(),image:'',data:[]};
  P().plans.push(pl);curPlan=pl.id;persist();render();
}
function renamePlan(){
  const pl=curP();if(!pl||!canManage())return;
  const n=prompt('Nouveau nom du plan :',pl.name);
  if(!n||!n.trim())return;pl.name=n.trim();persist();render();
}
function planChanged(){const id=v('pst-t-plan');curPlan=id;const l=$('pst-t-loc');if(l)l.innerHTML=localOpts(id);const o=$('pst-t-loc2');if(o)o.style.display='none'}
function locChanged(){const l=$('pst-t-loc'),o=$('pst-t-loc2');if(l&&o)o.style.display=l.value===OTHER?'block':'none'}
function guessCode(type){
  const pre=/rongeurs/.test(type)?'R':/UV/.test(type)?'U':/phéromones/.test(type)?'M':/rampants/.test(type)?'B':'D';
  const n=1+P().traps.filter(t=>String(t.code).startsWith(pre+'-')).reduce((m,t)=>Math.max(m,Number(String(t.code).split('-')[1])||0),0);
  return pre+'-'+String(n).padStart(2,'0');
}
function typeChanged(){const c=$('pst-t-code'),t=$('pst-t-type');if(c&&t){c.value=guessCode(t.value);const f=$('pst-t-freq');if(f)f.value=/UV/.test(t.value)?30:7}}
function addTrap(){
  if(!canManage()){alert('Action réservée aux responsables.');return}
  const planId=v('pst-t-plan'),code=v('pst-t-code'),type=v('pst-t-type'),freq=Number(v('pst-t-freq'))||7;
  let loc=v('pst-t-loc');if(loc===OTHER)loc=v('pst-t-loc2');
  if(!planId){alert('Choisissez le plan.');return}
  if(!code){alert('Indiquez le code du piège.');return}
  if(!loc){alert('Choisissez ou indiquez le local du piège.');return}
  if(P().traps.some(t=>t.active!==false&&t.code.toLowerCase()===code.toLowerCase())){alert('Ce code existe déjà.');return}
  P().traps.push(stamp({id:uid(),code,type,planId,location:loc,freq,active:true,addedAt:today()}));
  trace('Piège ajouté : '+code+' · '+planName(planId)+' · '+loc,'',who(),type);
  curPlan=planId;persist();render();
}
function removeTrap(id){
  if(!canManage())return;
  const t=P().traps.find(x=>x.id===id);if(!t)return;
  if(!confirm('Retirer le piège '+t.code+' du plan ? Son historique de relevés est conservé.'))return;
  t.active=false;t.removedAt=today();
  trace('Piège retiré : '+t.code,'',who(),t.location);
  persist();render();
}
function place(id){
  const t=P().traps.find(x=>x.id===id);if(!t)return;
  const pl=P().plans.find(x=>x.id===t.planId)||curP();
  if(!pl||!pl.image){alert('Dessinez ou importez d’abord le plan de ce lieu.');return}
  curPlan=pl.id;placing=id;render();const b=document.querySelector('.mt-pest-planbox');if(b)b.scrollIntoView({behavior:'smooth',block:'center'});
}
function cancelPlace(){placing='';render()}
function planClick(ev){
  if(!placing)return;
  const img=$('pst-planimg');if(!img)return;
  const r=img.getBoundingClientRect();
  const x=Math.round(((ev.clientX-r.left)/r.width)*1000)/10,y=Math.round(((ev.clientY-r.top)/r.height)*1000)/10;
  if(x<0||x>100||y<0||y>100)return;
  const t=P().traps.find(z=>z.id===placing);if(!t)return;
  t.x=x;t.y=y;t.planId=curP().id;placing='';persist();render();
}
function uploadPlan(file){
  const pl=curP();
  if(!file||!pl||!canManage())return;
  compress(file,1100,.55,function(url){if(!roomFor(url)){noRoom();return}pl.image=url;pl.data=[];P().traps.forEach(t=>{if(t.planId===pl.id){delete t.x;delete t.y}});persist();render()});
}
function removePlan(){
  const pl=curP();if(!pl||!canManage())return;
  if(!confirm('Supprimer le plan « '+pl.name+' » ? Ses pièges restent dans le registre mais ne seront plus placés.'))return;
  const p=P();p.plans=p.plans.filter(x=>x.id!==pl.id);
  p.traps.forEach(t=>{if(t.planId===pl.id){delete t.planId;delete t.x;delete t.y}});
  curPlan='';placing='';persist();render();
}

function roundChanged(id){const s=$('pst-r-s-'+id);if(s&&s.value!==ACTIVITY[0]){const n=$('pst-r-n-'+id);if(n&&!n.value)n.focus()}}
function saveRound(){
  const date=v('pst-r-date')||today(),op=v('pst-r-op');
  if(date>today()){alert('La date du relevé ne peut pas être dans le futur.');return}
  if(!op){alert('Indiquez l’opérateur.');return}
  const traps=activeTraps(),recs=[];
  for(const t of traps){
    const st=v('pst-r-s-'+t.id)||ACTIVITY[0],cnt=v('pst-r-n-'+t.id),note=v('pst-r-o-'+t.id);
    if(st!==ACTIVITY[0]&&!note&&!cnt){alert('Piège '+t.code+' : indiquez un nombre ou une observation pour une activité détectée.');return}
    recs.push(stamp({id:uid(),trapId:t.id,trapCode:t.code,location:t.location,date,status:st,count:cnt?Number(cnt):0,note,operator:op}));
  }
  const bad=recs.filter(r=>r.status!==ACTIVITY[0]);
  P().activity.push(...recs);
  trace('Relevé de pièges : '+recs.length+' contrôlé(s), '+bad.length+' avec activité',bad.length?'Non conforme':'Conforme',op,bad.map(b=>b.trapCode+' : '+b.status).join(' ; '));
  persist();render();
  if(bad.length&&confirm(bad.length+' piège(s) avec activité. Ouvrir une fiche de suivi maintenant ?')){
    newFiche({source:'Relevé d’activité',title:'Activité détectée : '+bad.map(b=>b.trapCode).join(', '),description:bad.map(b=>b.trapCode+' ('+b.location+') : '+b.status+(b.count?', '+b.count:'')+(b.note?' — '+b.note:'')).join('\n'),zone:bad[0].location});
  }
}

  if(status==='Clôturée'&&!note&&!v('pst-f-cor')){alert('Pour clôturer, indiquez l’action réalisée ou la vérification effectuée.');return}
  const data={title,opened:v('pst-f-opened')||today(),severity:sev,pest:v('pst-f-pest'),zone:v('pst-f-zone'),description:desc,immediate:v('pst-f-imm'),corrective:v('pst-f-cor'),owner:v('pst-f-owner'),due:v('pst-f-due'),status};
  const by=who();
  if(isNew){
    const rec=stamp(Object.assign({},f,data,{id:uid(),reference:nextRef(),events:[{at:new Date().toISOString(),by,action:'Création de la fiche',note:''}]}));
    if(status==='Clôturée')rec.closedAt=today();
    P().followups.push(rec);
    trace('Fiche nuisibles '+rec.reference+' : '+title,'Ouverte',by,desc.slice(0,200));
  }else{
    const rec=P().followups.find(x=>x.id===editFiche);if(!rec)return;
    const old=rec.status;
    Object.assign(rec,data);
    rec.events=rec.events||[];
    rec.events.push({at:new Date().toISOString(),by,action:old!==status?'Statut : '+old+' → '+status:'Mise à jour',note});
    if(status==='Clôturée'&&old!=='Clôturée'){rec.closedAt=today();rec.closedBy=by;trace('Fiche nuisibles clôturée '+rec.reference,'Clôturée',by,note)}
    if(status!=='Clôturée'){delete rec.closedAt;delete rec.closedBy}
  }
  persist();closeForm();
}

function printRegister(){
  const p=P();

  const rows=p.traps.map(t=>{const s=t.active===false?{txt:'Retiré le '+fd(t.removedAt)}:trapState(t);return '<tr><td>'+e(t.code)+'</td><td>'+e(t.type)+'</td><td>'+e(planName(t.planId))+'</td><td>'+e(t.location)+'</td><td>'+(Number(t.freq)||7)+' j</td><td>'+e(s.txt)+'</td></tr>'}).join('');

/* ----- éditeur de plan 2D ----- */
let dr=null;
const GRID=20,VW=1000,VH=640;
function trapIcon(x,hl){
  const ty=x.type||'',c=/UV/.test(ty)?'#d9a400':/phéromones/.test(ty)?'#7a4fd1':/rampants/.test(ty)?'#2f7de1':/glu/.test(ty)?'#c77700':/mécanique/.test(ty)?'#8a5a2b':'#1b8a4b';
  let g;
  if(/UV/.test(ty))g='<circle r="13" fill="'+c+'" stroke="#fff" stroke-width="3"/><path d="M2 -9L-5 2H0L-2 10L5 -1H0Z" fill="#fff"/>';
  else if(/phéromones/.test(ty))g='<path d="M0 -14L14 11H-14Z" fill="'+c+'" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>';
  else if(/rampants/.test(ty))g='<path d="M0 -15L15 0L0 15L-15 0Z" fill="'+c+'" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>';
  else if(/Autre/.test(ty))g='<circle r="12" fill="'+c+'" stroke="#fff" stroke-width="3"/>';
  else g='<rect x="-13" y="-13" width="26" height="26" rx="5" fill="'+c+'" stroke="#fff" stroke-width="3"/><circle r="4" fill="#fff"/>';
  return '<g transform="translate('+x.x+' '+x.y+')">'+g+'<text y="28" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#17251f" stroke="#fff" stroke-width="3" paint-order="stroke">'+e(x.code)+'</text></g>';
}
function drSvg(els,sel,forExport){
  let o='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+VW+' '+VH+'" width="'+VW+'" height="'+VH+'"><rect width="'+VW+'" height="'+VH+'" fill="#fff"/>';
  if(!forExport){o+='<defs><pattern id="pstg" width="'+GRID+'" height="'+GRID+'" patternUnits="userSpaceOnUse"><path d="M'+GRID+' 0H0V'+GRID+'" fill="none" stroke="#e3ebe6" stroke-width="1"/></pattern></defs><rect width="'+VW+'" height="'+VH+'" fill="url(#pstg)"/>'}
  els.forEach((x,i)=>{
    const hl=(sel===i&&!forExport)?' stroke-dasharray="6 4"':'';
    if(x.t==='room')o+='<rect x="'+x.x+'" y="'+x.y+'" width="'+x.w+'" height="'+x.h+'" fill="#eef6f1" stroke="#0d4a36" stroke-width="4"'+hl+'/><text x="'+(x.x+x.w/2)+'" y="'+(x.y+x.h/2)+'" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0d4a36">'+e(x.label||'')+'</text>';
    else if(x.t==='wall')o+='<line x1="'+x.x1+'" y1="'+x.y1+'" x2="'+x.x2+'" y2="'+x.y2+'" stroke="#0d4a36" stroke-width="'+(hl?7:5)+'" stroke-linecap="round"/>';
    else if(x.t==='door')o+='<rect x="'+(x.x-14)+'" y="'+(x.y-6)+'" width="28" height="12" fill="#fff" stroke="#c77700" stroke-width="3"'+hl+'/>';
    else if(x.t==='text')o+='<text x="'+x.x+'" y="'+x.y+'" text-anchor="middle" font-family="Arial" font-size="16" fill="#17251f">'+e(x.s)+'</text>';
    else if(x.t==='trap'&&!forExport)o+=trapIcon(x,sel===i);
  });
  return o+'</svg>';
}
function drOpen(tool){
  if(typeof tool!=='string')tool='';
  if(!canManage()){alert('Action réservée aux responsables.');return}
  const p=P(),pl0=curP();
  if(!pl0){alert('Créez d’abord un plan.');return}
  dr={planId:pl0.id,els:JSON.parse(JSON.stringify(pl0.data||[])).filter(x=>x.t!=='trap'),tool:tool||'room',sel:-1,cur:null,hist:[],ttype:TRAP_TYPES[0],had:[]};
  p.traps.forEach(t=>{if(t.active!==false&&t.planId===pl0.id&&typeof t.x==='number'){dr.els.push({t:'trap',x:Math.round(t.x/100*VW/GRID)*GRID,y:Math.round(t.y/100*VH/GRID)*GRID,code:t.code,type:t.type,trapId:t.id});dr.had.push(t.id)}});
  const ov=document.createElement('div');ov.id='pst-draw';ov.className='mt-pest-draw';
  ov.innerHTML='<div class="mt-pest-draw-box"><div class="mt-pest-draw-bar"><b>Dessiner : '+e(pl0.name)+'</b><span id="pst-dr-tools"></span></div><div id="pst-dr-hint" class="note"></div><div class="mt-pest-draw-canvas" id="pst-dr-canvas"></div><div class="mt-pest-actions"><button class="btn primary" onclick="mtPest.drSave()">Enregistrer le plan</button><button class="btn" onclick="mtPest.drClose()">Annuler</button></div></div>';
  document.documentElement.appendChild(ov);
  const c=$('pst-dr-canvas');
  c.addEventListener('pointerdown',drDown);c.addEventListener('pointermove',drMove);c.addEventListener('pointerup',drUp);
  drRefresh();
}
function drClose(){const o=$('pst-draw');if(o)o.remove();dr=null}
function drTools(){
  const T=[['room','Pièce'],['wall','Mur'],['door','Porte'],['text','Texte'],['trap','Piège'],['erase','Gomme']];
  const hints={room:'Glissez pour dessiner une pièce rectangulaire, puis donnez-lui un nom.',wall:'Glissez pour tracer un mur.',door:'Touchez pour placer une porte.',trap:'Choisissez le type de piège, puis touchez le plan à l’endroit voulu (autant de fois que nécessaire), puis enregistrez : les pièges sont ajoutés au registre.',text:'Touchez pour ajouter un texte.',erase:'Touchez un élément pour le supprimer.'};
  $('pst-dr-tools').innerHTML=T.map(t=>'<button type="button" class="mt-pest-chip'+(dr.tool===t[0]?' active':'')+'" onclick="mtPest.drTool(\''+t[0]+'\')">'+t[1]+'</button>').join('')+(dr.tool==='trap'?'<select id="pst-dr-ttype" onchange="mtPest.drType(this.value)">'+optList(TRAP_TYPES,dr.ttype)+'</select>':'')+'<button type="button" class="mt-pest-chip" onclick="mtPest.drUndo()">Annuler le dernier</button>';
  $('pst-dr-hint').textContent=hints[dr.tool];
}
function drRefresh(){if(!dr)return;const els=dr.cur?dr.els.concat([dr.cur]):dr.els;$('pst-dr-canvas').innerHTML=drSvg(els,-1,false);drTools()}
function drTool(t){dr.tool=t;drRefresh()}
function drType(v){dr.ttype=v}
function drUndo(){if(dr&&dr.els.length){dr.els.pop();drRefresh()}}
function drPt(ev){
  const svg=$('pst-dr-canvas').querySelector('svg'),r=svg.getBoundingClientRect();
  const sn=v=>Math.round(v/GRID)*GRID;
  return {x:Math.max(0,Math.min(VW,sn((ev.clientX-r.left)/r.width*VW))),y:Math.max(0,Math.min(VH,sn((ev.clientY-r.top)/r.height*VH)))};
}
function drHit(pt){
  for(let i=dr.els.length-1;i>=0;i--){const x=dr.els[i];
    if(x.t==='room'&&pt.x>=x.x-12&&pt.x<=x.x+x.w+12&&pt.y>=x.y-12&&pt.y<=x.y+x.h+12)return i;
    if(x.t==='wall'){const dx=x.x2-x.x1,dy=x.y2-x.y1,l=dx*dx+dy*dy||1;let k=((pt.x-x.x1)*dx+(pt.y-x.y1)*dy)/l;k=Math.max(0,Math.min(1,k));if(Math.hypot(pt.x-(x.x1+k*dx),pt.y-(x.y1+k*dy))<16)return i}
    if((x.t==='door'||x.t==='text')&&Math.abs(pt.x-x.x)<30&&Math.abs(pt.y-x.y)<20)return i
    if(x.t==='trap'&&Math.abs(pt.x-x.x)<22&&Math.abs(pt.y-x.y)<22)return i}
  return -1;
}
function drDown(ev){
  if(!dr)return;ev.preventDefault();const pt=drPt(ev);
  if(dr.tool==='erase'){const i=drHit(pt);if(i>=0){dr.els.splice(i,1);drRefresh()}return}
  if(dr.tool==='door'){dr.els.push({t:'door',x:pt.x,y:pt.y});drRefresh();return}
  if(dr.tool==='trap'){
    const ty=dr.ttype||TRAP_TYPES[0],pre=/rongeurs/.test(ty)?'R':/UV/.test(ty)?'U':/phéromones/.test(ty)?'M':/rampants/.test(ty)?'B':'D';
    const codes=P().traps.map(t=>t.code).concat(dr.els.filter(z=>z.t==='trap').map(z=>z.code));
    let n=1+codes.filter(c=>String(c).startsWith(pre+'-')).reduce((m,c)=>Math.max(m,Number(String(c).split('-')[1])||0),0);
    dr.els.push({t:'trap',x:pt.x,y:pt.y,code:pre+'-'+String(n).padStart(2,'0'),type:ty});drRefresh();return}
  if(dr.tool==='text'){const s=prompt('Texte à afficher :');if(s&&s.trim()){dr.els.push({t:'text',x:pt.x,y:pt.y,s:s.trim()});drRefresh()}return}
  dr.start=pt;dr.cur=dr.tool==='room'?{t:'room',x:pt.x,y:pt.y,w:0,h:0}:{t:'wall',x1:pt.x,y1:pt.y,x2:pt.x,y2:pt.y};
  try{$('pst-dr-canvas').setPointerCapture(ev.pointerId)}catch(_){}
}
function drMove(ev){
  if(!dr||!dr.cur)return;const pt=drPt(ev),s=dr.start;
  if(dr.cur.t==='room'){dr.cur.x=Math.min(s.x,pt.x);dr.cur.y=Math.min(s.y,pt.y);dr.cur.w=Math.abs(pt.x-s.x);dr.cur.h=Math.abs(pt.y-s.y)}
  else{dr.cur.x2=pt.x;dr.cur.y2=pt.y}
  drRefresh();
}
function drUp(){
  if(!dr||!dr.cur)return;const c=dr.cur;dr.cur=null;
  if(c.t==='room'){if(c.w>=GRID&&c.h>=GRID){const l=prompt('Nom de la pièce (ex. Cuisine, Réserve) :');if(l===null){drRefresh();return}c.label=l.trim();dr.els.push(c)}}
  else if(Math.hypot(c.x2-c.x1,c.y2-c.y1)>=GRID)dr.els.push(c);
  drRefresh();
}
function drSave(){
  if(!dr||!dr.els.length){alert('Dessinez au moins une pièce ou un mur.');return}
  const xml=drSvg(dr.els,-1,true),els=dr.els.filter(x=>x.t!=='trap'),tels=dr.els.filter(x=>x.t==='trap'),had=dr.had.slice();
  const rooms=els.filter(x=>x.t==='room');
  const roomOf=pt=>{const r=rooms.filter(q=>pt.x>=q.x&&pt.x<=q.x+q.w&&pt.y>=q.y&&pt.y<=q.y+q.h).sort((a,b)=>a.w*a.h-b.w*b.h)[0];return r&&r.label?r.label:'Plan des locaux'};
  const keep=[],plId=dr.planId;
  const im=new Image();
  im.onload=function(){
    const cv=document.createElement('canvas');cv.width=VW;cv.height=VH;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,VW,VH);c.drawImage(im,0,0,VW,VH);
    const p=P(),pl=p.plans.find(x=>x.id===plId);if(!pl){drClose();return}
    const url=cv.toDataURL('image/webp',.7);if(!roomFor(url)){noRoom();return}
    pl.image=url;pl.data=els;
    tels.forEach(q=>{
      let t=q.trapId?p.traps.find(z=>z.id===q.trapId):p.traps.find(z=>z.active!==false&&z.code===q.code);
      if(!t){t=stamp({id:uid(),code:q.code,type:q.type,planId:plId,location:roomOf(q),freq:/UV/.test(q.type)?30:7,active:true,addedAt:today()});p.traps.push(t);trace('Piège ajouté : '+t.code+' · '+t.location,'',who(),t.type)}
      t.planId=plId;t.x=Math.round(q.x/VW*1000)/10;t.y=Math.round(q.y/VH*1000)/10;keep.push(t.id);
    });
    had.forEach(id=>{if(keep.indexOf(id)<0){const t=p.traps.find(z=>z.id===id);if(t){delete t.x;delete t.y}}});
    trace('Plan dessiné : '+pl.name,'',who(),els.filter(x=>x.t==='room').map(x=>x.label).join(', '));
    persist();drClose();render();
  };
  im.onerror=function(){alert('Enregistrement impossible, réessayez.')};
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
}

window.mtPest={open:open,draw:drOpen,addTrapStart:addTrapStart,selPlan:selPlan,newPlan:newPlan,renamePlan:renamePlan,planChanged:planChanged,locChanged:locChanged,drType:drType,drClose:drClose,drTool:drTool,drUndo:drUndo,drSave:drSave,tab:setTab,addTrap:addTrap,removeTrap:removeTrap,place:place,cancelPlace:cancelPlace,planClick:planClick,uploadPlan:uploadPlan,removePlan:removePlan,typeChanged:typeChanged,roundChanged:roundChanged,saveRound:saveRound,zoneChanged:zoneChanged,toggleInsp:toggleInsp,saveInspection:saveInspection,saveProvider:saveProvider,saveIntervention:saveIntervention,filter:setFilter,newFiche:newFiche,editFiche:openFiche,closeForm:closeForm,saveFiche:saveFiche,printFiche:printFiche,printRegister:printRegister,pickPhoto:pickPhoto,dropPhoto:dropPhoto,zoom:zoom};

})();

/* Module : Gestion des déchets alimentaires

(function(){
'use strict';
const TABS=[['overview','Vue d’ensemble'],['entry','Saisie'],['collect','Collectes'],['register','Registre']];
const CATS=['Restes d’assiettes (clients)','Épluchures et parures de préparation','Produits périmés ou DLC dépassée','Surproduction (plats non servis)','Huiles de friture usagées','Graisses (bac à graisse)','Autres biodéchets'];

const ZONES=['Cuisine principale','Pâtisserie','Restaurant / salle','Plonge / laverie','Réserve / stockage','Réception','Buffet','Autre'];

let tab='overview',period=30,fMonth='';
function $(id){return document.getElementById(id)}
function v(id){const x=$(id);return x?String(x.value||'').trim():''}
function e(x){return typeof esc==='function'?esc(x):String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function fd(s){if(!s)return '—';const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)?s+'T12:00:00':s);return isNaN(d)?e(s):d.toLocaleDateString('fr-FR')}

function stamp(o){const p=prof();o.actorUid=p.uid||'';o.actorRole=p.role||'';o.createdAt=new Date().toISOString();return o}
function trace(summary,status,operator,note){
  if(!Array.isArray(S.trace))S.trace=[];
  S.trace.unshift({type:'Déchets',product:summary,date:new Date().toLocaleString('fr-FR'),status:status||'',operator:operator||'',note:note||''});
}
function opt(list,sel,ph){return (ph?'<option value="">'+e(ph)+'</option>':'')+list.map(x=>'<option'+(x===sel?' selected':'')+'>'+e(x)+'</option>').join('')}
function badge(t,c){return '<span class="mt-pest-badge '+c+'">'+e(t)+'</span>'}
function kg(n){return (Math.round(n*10)/10).toLocaleString('fr-FR')+' kg'}
function sumKg(list){return list.filter(x=>x.unit!=='L').reduce((s,x)=>s+(Number(x.qty)||0),0)}
function sumL(list){return list.filter(x=>x.unit==='L').reduce((s,x)=>s+(Number(x.qty)||0),0)}
function inRange(list,from,to){return list.filter(x=>x.date>=from&&x.date<=to)}
function compress(file,maxW,q,done){
  if(!file)return;const r=new FileReader();
  r.onload=function(){const im=new Image();im.onload=function(){const s=Math.min(1,maxW/im.width,maxW/im.height),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(im,0,0,w,h);done(cv.toDataURL('image/webp',q))};im.src=r.result};
  r.readAsDataURL(file);
}
let photo='';
function roomFor(url){try{return JSON.stringify(S).length+String(url).length<900000}catch(_){return true}}
function noRoom(){alert('Espace de stockage de l’établissement presque plein : cette image n’a pas été ajoutée. Utilisez une image plus petite ou supprimez d’anciennes photos.')}
function pickPhoto(file){compress(file,800,.55,function(u){if(!roomFor(u)){noRoom();return}photo=u;const p=$('wst-prev');if(p)p.innerHTML='<img src="'+u+'" alt="Bordereau" style="max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:6px">'})}
function zoom(src){if(typeof haccpEnlargePhoto==='function'){haccpEnlargePhoto(src);return}const w=window.open('','_blank');if(w){w.document.write('<img src="'+src+'" style="max-width:100%">');w.document.close()}}

function render(){
  const root=$('app');if(!root)return;
  let body='';
  try{body=tab==='entry'?vEntry():tab==='collect'?vCollect():tab==='register'?vRegister():vOverview()}
  catch(err){console.error('Déchets',err);body='<div class="panel"><p>Erreur d’affichage : '+e(err&&err.message||err)+'</p></div>'}
  const tabs=TABS.map(([k,l])=>'<button type="button" class="mt-pest-tab'+(k===tab?' active':'')+'" onclick="mtWaste.tab(\''+k+'\')">'+e(l)+'</button>').join('');
  root.innerHTML='<section class="mt-pest-view mt-waste-view"><button class="btn back" onclick="home()">← Accueil</button><h1>Gestion des déchets alimentaires</h1><div class="mt-pest-tabs" role="tablist">'+tabs+'</div>'+body+'</section>';
}
function open(){
  if(typeof SITE_ID!=='undefined'&&SITE_ID==='main'){alert('Module réservé aux établissements');return}
  if(typeof CURRENT_VIEW!=='undefined')CURRENT_VIEW='waste';
  document.body.classList.remove('on-home','mt-premium-active','on-login');
  const legacy=document.querySelector('body > nav');if(legacy)legacy.style.display='none';
  W();render();window.scrollTo(0,0);
}
function setTab(k){tab=k;render();window.scrollTo(0,0)}

function bars(map,unit){
  const rows=Object.keys(map).filter(k=>map[k]>0).sort((a,b)=>map[b]-map[a]);
  if(!rows.length)return '<p class="note">Aucune donnée sur la période.</p>';
  const max=map[rows[0]];
  return rows.map(k=>'<div class="mt-waste-bar"><span class="mt-waste-barlabel">'+e(k)+'</span><span class="mt-waste-bartrack"><i style="width:'+Math.max(3,Math.round(map[k]/max*100))+'%"></i></span><b>'+kg(map[k])+'</b></div>').join('');
}
function vOverview(){
  const w=W(),t=today();
  const from=addDays(t,-(period-1)),pf=addDays(from,-period),pt=addDays(from,-1);
  const cur=inRange(w.entries,from,t),prev=inRange(w.entries,pf,pt);
  const kc=sumKg(cur),kp=sumKg(prev),lc=sumL(cur);
  const diff=kp>0?Math.round((kc-kp)/kp*100):null;
  const byCat={},byReason={};
  cur.filter(x=>x.unit!=='L').forEach(x=>{byCat[x.category]=(byCat[x.category]||0)+(Number(x.qty)||0);byReason[x.reason||'—']=(byReason[x.reason||'—']||0)+(Number(x.qty)||0)});
  const avoid=cur.filter(x=>x.unit!=='L'&&['Surproduction','DLC dépassée','Erreur de préparation','Rupture de la chaîne du froid','Produit non conforme à la réception'].includes(x.reason)).reduce((s,x)=>s+(Number(x.qty)||0),0);
  const pr=w.provider,next=pr.nextCollection||'';
  const alerts=[];
  const last=w.entries.reduce((m,x)=>x.date>m?x.date:m,'');
  if(!last)alerts.push(['warn','Aucune pesée enregistrée. Commencez par la saisie.','entry']);
  else if(days(last,t)>=3)alerts.push(['warn','Aucune saisie depuis '+days(last,t)+' jours.','entry']);
  if(next&&next<t)alerts.push(['bad','Collecte en retard (prévue le '+fd(next)+').','collect']);
  else if(!next)alerts.push(['warn','Prochaine collecte non planifiée.','collect']);
  const lastGrease=w.collections.filter(c=>c.type==='Vidange bac à graisse').reduce((m,c)=>c.date>m?c.date:m,'');
  if(lastGrease&&days(lastGrease,t)>90)alerts.push(['warn','Bac à graisse non vidangé depuis plus de 90 jours.','collect']);
  const ah=alerts.length?alerts.map(a=>'<button type="button" class="mt-pest-alert '+a[0]+'" onclick="mtWaste.tab(\''+a[2]+'\')">'+e(a[1])+'<span>Voir →</span></button>').join(''):'<div class="mt-pest-alert ok">Tout est à jour.</div>';
  const pbtn=[7,30,90].map(n=>'<button type="button" class="mt-pest-chip'+(n===period?' active':'')+'" onclick="mtWaste.period('+n+')">'+n+' jours</button>').join('');
  return '<div class="mt-pest-chips">'+pbtn+'</div><div class="cards mt-pest-cards">'
   +'<div class="metric"><span>Déchets sur '+period+' jours</span><b>'+kg(kc)+'</b></div>'
   +'<div class="metric"><span>Évolution</span><b class="mt-pest-small '+(diff!==null&&diff>0?'mt-pest-red':'')+'">'+(diff===null?'—':(diff>0?'+':'')+diff+' %')+'</b></div>'
   +'<div class="metric"><span>Gaspillage évitable</span><b class="mt-pest-small">'+kg(avoid)+'</b></div>'
   +'<div class="metric"><span>Huiles usagées</span><b class="mt-pest-small">'+(Math.round(lc*10)/10).toLocaleString('fr-FR')+' L</b></div></div>'
   +'<div class="panel"><h2>À traiter</h2>'+ah+'<div class="mt-pest-actions"><button class="btn primary" onclick="mtWaste.tab(\'entry\')">Saisir une pesée</button><button class="btn" onclick="mtWaste.tab(\'collect\')">Enregistrer une collecte</button></div></div>'
   +'<div class="panel"><h2>Par catégorie</h2>'+bars(byCat)+'</div>'
   +'<div class="panel"><h2>Par cause</h2>'+bars(byReason)+'<p class="note">Le gaspillage évitable regroupe surproduction, DLC dépassée, erreurs de préparation, rupture de la chaîne du froid et produits non conformes.</p></div>';
}

function vEntry(){
  const t=today();
  const recent=W().entries.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,8).map(x=>'<div class="record"><b>'+e(x.category)+'</b> — '+(Math.round(x.qty*10)/10)+' '+e(x.unit||'kg')+' <span class="note">· '+fd(x.date)+' · '+e(x.zone||'')+(x.reason?' · '+e(x.reason):'')+'</span></div>').join('')||'<p class="note">Aucune saisie.</p>';
  return '<div class="panel"><h2>Nouvelle saisie</h2><div class="row"><div><label>Date</label><input id="wst-date" type="date" value="'+t+'" max="'+t+'"></div><div><label>Service / zone</label><select id="wst-zone">'+opt(ZONES,'','Choisir')+'</select></div></div>'
   +'<div class="row"><div><label>Catégorie</label><select id="wst-cat" onchange="mtWaste.catChanged()">'+opt(CATS,'','Choisir')+'</select></div><div><label>Cause</label><select id="wst-reason">'+opt(REASONS,'','Choisir')+'</select></div></div>'
   +'<div class="row"><div><label>Quantité</label><input id="wst-qty" type="number" min="0" step="0.1" placeholder="Ex. 12.5"></div><div><label>Unité</label><select id="wst-unit"><option>kg</option><option>L</option></select></div><div><label>Destination</label><select id="wst-dest">'+opt(DEST,'','Choisir')+'</select></div></div>'
   +'<div class="row"><div><label>Opérateur</label><input id="wst-op" value="'+e(who())+'"></div><div><label>Remarque</label><input id="wst-note" placeholder="Facultatif"></div></div>'
   +'<button class="btn primary" onclick="mtWaste.saveEntry()">Enregistrer la pesée</button></div>'
   +'<div class="panel"><h2>Dernières saisies</h2>'+recent+'</div>';
}
function catChanged(){
  const c=v('wst-cat'),u=$('wst-unit'),d=$('wst-dest'),r=$('wst-reason');
  if(/Huiles/.test(c)){if(u)u.value='L';if(d)d.value='Huile recyclée (collecteur)';if(r&&!r.value)r.value='Parure normale de préparation'}
  else if(u)u.value='kg';
  if(/Restes/.test(c)&&r&&!r.value)r.value='Reste client';
  if(/périmés/.test(c)&&r&&!r.value)r.value='DLC dépassée';
  if(/Surproduction/.test(c)&&r&&!r.value)r.value='Surproduction';
}
function saveEntry(){
  const date=v('wst-date')||today(),zone=v('wst-zone'),cat=v('wst-cat'),reason=v('wst-reason'),qty=Number(v('wst-qty')),unit=v('wst-unit')||'kg',dest=v('wst-dest'),op=v('wst-op'),note=v('wst-note');
  if(date>today()){alert('La date ne peut pas être dans le futur.');return}
  if(!zone){alert('Choisissez le service ou la zone.');return}
  if(!cat){alert('Choisissez la catégorie.');return}
  if(!reason){alert('Indiquez la cause.');return}
  if(!(qty>0)){alert('Indiquez une quantité supérieure à 0.');return}
  if(qty>2000){alert('Quantité anormalement élevée, vérifiez la saisie.');return}
  if(!dest){alert('Indiquez la destination.');return}
  if(!op){alert('Indiquez l’opérateur.');return}
  const rec=stamp({id:uid(),date,zone,category:cat,reason,qty,unit,destination:dest,operator:op,note});
  W().entries.push(rec);
  if(/périmés/.test(cat))trace('Déchet : '+cat+' '+qty+' '+unit,'Perte',op,zone+(note?' · '+note:''));
  save();render();
  const el=document.querySelector('.mt-waste-view .panel');if(el)el.insertAdjacentHTML('afterbegin','<div class="mt-pest-alert ok">Pesée enregistrée : '+e(cat)+', '+qty+' '+e(unit)+'.</div>');
}

function vCollect(){
  const w=W(),pr=w.provider,mg=canManage(),t=today(),next=pr.nextCollection||'';
  const info=mg?'<div class="row"><div><label>Collecteur / société</label><input id="wst-p-name" value="'+e(pr.name||'')+'"></div><div><label>Téléphone</label><input id="wst-p-phone" value="'+e(pr.phone||'')+'"></div></div><div class="row"><div><label>N° de contrat ou agrément</label><input id="wst-p-contract" value="'+e(pr.contract||'')+'"></div><div><label>Fréquence</label><input id="wst-p-freq" value="'+e(pr.frequency||'')+'" placeholder="Ex. 2 fois par semaine"></div><div><label>Prochaine collecte</label><input id="wst-p-next" type="date" value="'+e(next)+'"></div></div><button class="btn primary" onclick="mtWaste.saveProvider()">Enregistrer</button>'
    :'<p><b>'+e(pr.name||'Non renseigné')+'</b><br><span class="note">'+e(pr.phone||'')+(pr.frequency?' · '+e(pr.frequency):'')+'</span></p>';
  const nt=next?(next<t?badge('Collecte en retard : '+fd(next),'bad'):badge('Prochaine collecte : '+fd(next),'ok')):badge('Prochaine collecte non planifiée','warn');
  const form='<div class="panel"><h2>Enregistrer une collecte ou un enlèvement</h2><div class="row"><div><label>Date</label><input id="wst-c-date" type="date" value="'+t+'" max="'+t+'"></div><div><label>Type</label><select id="wst-c-type">'+opt(CTYPES,CTYPES[0])+'</select></div></div><div class="row"><div><label>Quantité</label><input id="wst-c-qty" type="number" min="0" step="0.1"></div><div><label>Unité</label><select id="wst-c-unit"><option>kg</option><option>L</option></select></div><div><label>Chauffeur / collecteur</label><input id="wst-c-who"></div></div><div class="row"><div><label>N° de bordereau</label><input id="wst-c-slip" placeholder="Obligatoire pour huiles et graisses"></div><div><label>Prochaine collecte</label><input id="wst-c-next" type="date"></div></div><label>Photo du bordereau (facultative)</label><input type="file" accept="image/*" onchange="mtWaste.pickPhoto(this.files[0])"><div id="wst-prev"></div><br><button class="btn primary" onclick="mtWaste.saveCollect()">Enregistrer la collecte</button></div>';
  const hist=w.collections.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).map(c=>'<div class="record"><b>'+e(c.type)+'</b> — '+fd(c.date)+' · '+(Math.round(c.qty*10)/10)+' '+e(c.unit)+'<br><span class="note">'+(c.collector?'Collecteur : '+e(c.collector)+' · ':'')+(c.slip?'Bordereau '+e(c.slip):'Sans bordereau')+'</span>'+(c.photo?'<br><img src="'+c.photo+'" alt="Bordereau" style="max-width:130px;max-height:90px;border-radius:8px;cursor:zoom-in;margin-top:6px" onclick="mtWaste.zoom(this.src)">':'')+'</div>').join('')||'<p class="note">Aucune collecte enregistrée.</p>';
  return '<div class="panel"><h2>Collecteur de déchets</h2>'+nt+'<div style="margin-top:10px">'+info+'</div></div>'+form+'<div class="panel"><h2>Historique des collectes</h2>'+hist+'</div>';
}
function saveProvider(){
  if(!canManage())return;
  const p=W().provider;p.name=v('wst-p-name');p.phone=v('wst-p-phone');p.contract=v('wst-p-contract');p.frequency=v('wst-p-freq');p.nextCollection=v('wst-p-next');
  trace('Collecteur de déchets mis à jour : '+(p.name||'—'),'',who(),p.nextCollection?'Prochaine collecte le '+fd(p.nextCollection):'');
  save();render();
}
function saveCollect(){
  const date=v('wst-c-date')||today(),type=v('wst-c-type'),qty=Number(v('wst-c-qty')),unit=v('wst-c-unit')||'kg',slip=v('wst-c-slip'),next=v('wst-c-next');
  if(date>today()){alert('La date ne peut pas être dans le futur.');return}
  if(!(qty>0)){alert('Indiquez la quantité enlevée.');return}
  if(/huiles|graisse/i.test(type)&&!slip){alert('Le numéro de bordereau est obligatoire pour les huiles usagées et les graisses.');return}
  if(next&&next<=date){alert('La prochaine collecte doit être postérieure à la collecte.');return}
  const rec=stamp({id:uid(),date,type,qty,unit,collector:v('wst-c-who'),slip,photo:photo,provider:W().provider.name||''});
  W().collections.push(rec);photo='';
  if(next)W().provider.nextCollection=next;
  trace('Collecte : '+type+' '+qty+' '+unit,'',who()||rec.collector,slip?'Bordereau '+slip:'');
  save();render();
}

function monthOf(d){return d.slice(0,7)}
function vRegister(){
  const w=W(),months=Array.from(new Set(w.entries.map(x=>monthOf(x.date)).concat([today().slice(0,7)]))).sort().reverse();
  if(!fMonth)fMonth=months[0];
  const list=w.entries.filter(x=>monthOf(x.date)===fMonth).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  const mg=canManage();
  const rows=list.map(x=>'<tr><td>'+fd(x.date)+'</td><td>'+e(x.zone)+'</td><td>'+e(x.category)+'</td><td>'+e(x.reason||'')+'</td><td><b>'+(Math.round(x.qty*10)/10)+' '+e(x.unit||'kg')+'</b></td><td>'+e(x.destination||'')+'</td><td>'+e(x.operator||'')+'</td><td>'+(mg?'<button class="btn" style="padding:4px 8px" onclick="mtWaste.del(\''+x.id+'\')">Supprimer</button>':'')+'</td></tr>').join('');
  const mopts=months.map(m=>'<option value="'+m+'"'+(m===fMonth?' selected':'')+'>'+new Date(m+'-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</option>').join('');
  return '<div class="panel"><div class="mt-pest-headrow"><h2>Registre mensuel</h2><div><select id="wst-month" onchange="mtWaste.month(this.value)" style="width:auto">'+mopts+'</select> <button class="btn" onclick="mtWaste.printRegister()">Imprimer</button></div></div><p class="note">Total du mois : <b>'+kg(sumKg(list))+'</b>'+(sumL(list)?' et <b>'+(Math.round(sumL(list)*10)/10)+' L</b> d’huiles':'')+'</p>'
    +(list.length?'<div class="mt-pest-tablewrap"><table class="mt-pest-table"><thead><tr><th>Date</th><th>Zone</th><th>Catégorie</th><th>Cause</th><th>Quantité</th><th>Destination</th><th>Opérateur</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="note">Aucune saisie ce mois-ci.</p>')+'</div>';
}
function setMonth(m){fMonth=m;render()}
function del(id){
  if(!canManage())return;
  const x=W().entries.find(z=>z.id===id);if(!x)return;
  if(!confirm('Supprimer cette saisie ('+x.category+', '+x.qty+' '+x.unit+') ?'))return;
  W().entries=W().entries.filter(z=>z.id!==id);
  trace('Saisie de déchets supprimée : '+x.category+' '+x.qty+' '+x.unit,'',who(),'Saisie du '+fd(x.date));
  save();render();
}
function printRegister(){
  const list=W().entries.filter(x=>monthOf(x.date)===fMonth).sort((a,b)=>a.date.localeCompare(b.date));
  const site=(typeof siteDisplayName!=='undefined'&&siteDisplayName)||(typeof SITE_ID!=='undefined'?SITE_ID:'');
  const w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres contextuelles pour imprimer.');return}
  const rows=list.map(x=>'<tr><td>'+fd(x.date)+'</td><td>'+e(x.zone)+'</td><td>'+e(x.category)+'</td><td>'+e(x.reason||'')+'</td><td>'+(Math.round(x.qty*10)/10)+' '+e(x.unit||'kg')+'</td><td>'+e(x.destination||'')+'</td><td>'+e(x.operator||'')+'</td></tr>').join('');
  const cols=W().collections.filter(c=>monthOf(c.date)===fMonth).map(c=>'<tr><td>'+fd(c.date)+'</td><td>'+e(c.type)+'</td><td>'+(Math.round(c.qty*10)/10)+' '+e(c.unit)+'</td><td>'+e(c.collector||'')+'</td><td>'+e(c.slip||'')+'</td></tr>').join('');
  w.document.open();
  w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Registre des déchets</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:24px;color:#17251f}h1{color:#0d4a36;font-size:22px}h2{font-size:16px;color:#0d4a36;margin-top:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #b8c7bf;padding:5px 7px;text-align:left}th{background:#e8f1ec}.sign{display:flex;gap:30px;margin-top:40px}.sign div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:12px}@media print{.bar{display:none}}</style></head><body><div class="bar"><button onclick="window.print()">Imprimer ou enregistrer en PDF</button></div><h1>Registre des déchets alimentaires — '+e(fMonth)+'</h1><p>Établissement : '+e(site)+' · Total : '+kg(sumKg(list))+(sumL(list)?' + '+(Math.round(sumL(list)*10)/10)+' L d’huiles':'')+'</p><table><tr><th>Date</th><th>Zone</th><th>Catégorie</th><th>Cause</th><th>Quantité</th><th>Destination</th><th>Opérateur</th></tr>'+rows+'</table><h2>Collectes du mois</h2><table><tr><th>Date</th><th>Type</th><th>Quantité</th><th>Collecteur</th><th>Bordereau</th></tr>'+cols+'</table><div class="sign"><div>Établi par</div><div>Validé par</div><div>Date et signature</div></div></body></html>');
  w.document.close();
}
window.mtWaste={tab:setTab,period:function(n){period=n;render()},catChanged:catChanged,saveEntry:saveEntry,saveProvider:saveProvider,saveCollect:saveCollect,pickPhoto:pickPhoto,zoom:zoom,month:setMonth,del:del,printRegister:printRegister};
window.mtWasteOpen=open;
})();

</script>
<script id="mt-docs-module">
/* Module : Gestion documentaire HACCP
   Données : S.docs = { items[] } — enregistrées avec save(). Les fichiers eux-mêmes restent sur votre stockage (lien) ; l'application suit versions, validité, approbation et lecture. */
(function(){
'use strict';
const CATS=['Plan HACCP','Procédures','Instructions de travail','Enregistrements et modèles','Hygiène et formation','Fournisseurs et réception','Maintenance et équipements','Réglementation et audits','Autre'];
const STATUS=['Brouillon','En vigueur','Obsolète'];
const STD=[
 ['Plan HACCP (équipe, champ d’étude, diagrammes)','Plan HACCP'],['Analyse des dangers et points critiques (CCP)','Plan HACCP'],
 ['Procédure de réception des marchandises','Procédures'],['Procédure de maîtrise des températures','Procédures'],
 ['Procédure de nettoyage et désinfection','Procédures'],['Procédure de traçabilité et de retrait / rappel de produits','Procédures'],
 ['Procédure de gestion des non-conformités et actions correctives','Procédures'],['Procédure de lutte contre les nuisibles','Procédures'],
 ['Procédure de gestion des déchets','Procédures'],['Gestion des allergènes','Procédures'],
 ['Règles d’hygiène du personnel (5 M, tenue, lavage des mains)','Hygiène et formation'],['Plan de formation du personnel','Hygiène et formation'],
 ['Cahier des charges et agrément des fournisseurs','Fournisseurs et réception'],['Plan de maintenance et d’étalonnage des équipements','Maintenance et équipements'],
 ['Programme d’audits internes','Réglementation et audits']
];
let view='overview',q='',fCat='',fSt='',cur='';
function $(id){return document.getElementById(id)}
function v(id){const x=$(id);return x?String(x.value||'').trim():''}
function e(x){return typeof esc==='function'?esc(x):String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function D(){if(!S.docs||typeof S.docs!=='object')S.docs={};if(!Array.isArray(S.docs.items))S.docs.items=[];return S.docs}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function addMonths(iso,n){const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function fd(s){if(!s)return '—';const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)?s+'T12:00:00':s);return isNaN(d)?e(s):d.toLocaleDateString('fr-FR')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function prof(){return (typeof currentUserProfile!=='undefined'&&currentUserProfile)||{}}
function who(){const p=prof();const n=p.displayName||p.name||p.username||p.email||'';return n.includes('@')?n.split('@')[0]:n}
function canManage(){return ['admin','responsable','haccp'].includes(prof().role)}
function trace(summary,status,operator,note){if(!Array.isArray(S.trace))S.trace=[];S.trace.unshift({type:'Documents',product:summary,date:new Date().toLocaleString('fr-FR'),status:status||'',operator:operator||'',note:note||''})}
function opt(list,sel,ph){return (ph?'<option value="">'+e(ph)+'</option>':'')+list.map(x=>'<option'+(x===sel?' selected':'')+'>'+e(x)+'</option>').join('')}
function badge(t,c){return '<span class="mt-pest-badge '+c+'">'+e(t)+'</span>'}
function visible(d){return canManage()||d.status==='En vigueur'}
function reviewState(d){
  if(d.status!=='En vigueur'||!d.nextReview)return {k:'',txt:''};
  const t=today(),n=days(t,d.nextReview);
  if(n<0)return {k:'late',txt:'Révision en retard de '+(-n)+' j'};
  if(n<=30)return {k:'soon',txt:'À réviser avant le '+fd(d.nextReview)};
  return {k:'ok',txt:'Révision le '+fd(d.nextReview)};
}
function readOf(d){return (d.readBy||[]).filter(r=>r.version===d.version)}
function iRead(d){const p=prof();return readOf(d).some(r=>(p.uid&&r.uid===p.uid)||(!p.uid&&r.name===who()))}
function nextCode(){const n=1+D().items.reduce((m,x)=>Math.max(m,Number(String(x.code||'').replace('DOC-',''))||0),0);return 'DOC-'+String(n).padStart(3,'0')}

function render(){
  const root=$('app');if(!root)return;
  let body='';
  try{body=view==='form'?vForm():view==='library'?vLibrary():vOverview()}
  catch(err){console.error('Documents',err);body='<div class="panel"><p>Erreur d’affichage : '+e(err&&err.message||err)+'</p></div>'}
  const tabs=[['overview','Vue d’ensemble'],['library','Bibliothèque']].map(([k,l])=>'<button type="button" class="mt-pest-tab'+((view===k||(view==='form'&&k==='library'))?' active':'')+'" onclick="mtDocs.go(\''+k+'\')">'+e(l)+'</button>').join('');
  root.innerHTML='<section class="mt-pest-view mt-docs-view"><button class="btn back" onclick="home()">← Accueil</button><h1>Gestion documentaire HACCP</h1><div class="mt-pest-tabs">'+tabs+'</div>'+body+'</section>';
}
function open(){
  if(typeof SITE_ID!=='undefined'&&SITE_ID==='main'){alert('Module réservé aux établissements');return}
  if(typeof CURRENT_VIEW!=='undefined')CURRENT_VIEW='docs';
  document.body.classList.remove('on-home','mt-premium-active','on-login');
  const legacy=document.querySelector('body > nav');if(legacy)legacy.style.display='none';
  D();view='overview';render();window.scrollTo(0,0);
}
function go(k){view=k;cur='';render();window.scrollTo(0,0)}

function vOverview(){
  const items=D().items.filter(visible),t=today(),mg=canManage();
  const eff=items.filter(d=>d.status==='En vigueur'),draft=items.filter(d=>d.status==='Brouillon'),obs=items.filter(d=>d.status==='Obsolète');
  const late=eff.filter(d=>reviewState(d).k==='late'),soon=eff.filter(d=>reviewState(d).k==='soon');
  const unread=eff.filter(d=>!iRead(d));
  const have=n=>D().items.some(d=>d.status!=='Obsolète'&&String(d.title).toLowerCase()===n.toLowerCase());
  const missing=STD.filter(x=>!have(x[0]));
  const alerts=[];
  if(late.length)alerts.push(['bad',late.length+' document(s) à réviser en retard.','late']);
  if(soon.length)alerts.push(['warn',soon.length+' document(s) à réviser dans les 30 jours.','soon']);
  if(unread.length)alerts.push(['warn','Vous n’avez pas encore lu '+unread.length+' document(s) en vigueur.','unread']);
  if(mg&&draft.length)alerts.push(['warn',draft.length+' brouillon(s) en attente d’approbation.','draft']);
  const ah=alerts.length?alerts.map(a=>'<button type="button" class="mt-pest-alert '+a[0]+'" onclick="mtDocs.filter(\''+a[2]+'\')">'+e(a[1])+'<span>Voir →</span></button>').join(''):'<div class="mt-pest-alert ok">Documentation à jour.</div>';
  const miss=mg?'<div class="panel"><div class="mt-pest-headrow"><h2>Documents types HACCP</h2>'+(missing.length?'<button class="btn primary" onclick="mtDocs.addAllStd()">Créer les '+missing.length+' manquants</button>':'')+'</div><p class="note">Liste de référence d’un dossier HACCP complet. Chaque document créé est un emplacement à compléter (lien vers le fichier, version, responsable).</p>'
    +STD.map(x=>{const ok=have(x[0]);return '<div class="record" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span>'+(ok?'✔ ':'○ ')+e(x[0])+'<br><span class="note">'+e(x[1])+'</span></span>'+(ok?badge('Présent','ok'):'<button class="btn" style="padding:6px 10px" onclick="mtDocs.addStd('+STD.indexOf(x)+')">Ajouter</button>')+'</div>'}).join('')+'</div>':'';
  return '<div class="cards mt-pest-cards"><div class="metric"><span>En vigueur</span><b>'+eff.length+'</b></div><div class="metric"><span>À réviser</span><b class="'+(late.length?'mt-pest-red':soon.length?'mt-pest-orange':'')+'">'+(late.length+soon.length)+'</b></div><div class="metric"><span>Brouillons</span><b>'+draft.length+'</b></div><div class="metric"><span>Obsolètes</span><b>'+obs.length+'</b></div></div>'
    +'<div class="panel"><h2>À traiter</h2>'+ah+'<div class="mt-pest-actions"><button class="btn primary" onclick="mtDocs.go(\'library\')">Ouvrir la bibliothèque</button>'+(mg?'<button class="btn" onclick="mtDocs.newDoc()">Nouveau document</button><button class="btn" onclick="mtDocs.printList()">Imprimer la liste maîtresse</button>':'')+'</div></div>'+miss;
}
function vLibrary(){
  const mg=canManage();let list=D().items.filter(visible);
  if(q){const k=q.toLowerCase();list=list.filter(d=>(d.title+' '+d.code+' '+(d.owner||'')+' '+(d.keywords||'')).toLowerCase().includes(k))}
  if(fCat)list=list.filter(d=>d.category===fCat);
  if(fSt==='late')list=list.filter(d=>reviewState(d).k==='late');
  else if(fSt==='soon')list=list.filter(d=>reviewState(d).k==='soon');
  else if(fSt==='unread')list=list.filter(d=>d.status==='En vigueur'&&!iRead(d));
  else if(fSt)list=list.filter(d=>d.status===(fSt==='draft'?'Brouillon':fSt));
  list.sort((a,b)=>(a.category+a.title).localeCompare(b.category+b.title));
  const rows=list.map(d=>{const r=reviewState(d);return '<div class="record" style="cursor:pointer" onclick="mtDocs.open(\''+d.id+'\')"><b>'+e(d.code)+'</b> · '+e(d.title)+' '+badge(d.status,d.status==='En vigueur'?'ok':d.status==='Brouillon'?'warn':'muted')+(r.k==='late'?' '+badge(r.txt,'bad'):r.k==='soon'?' '+badge(r.txt,'warn'):'')+(d.status==='En vigueur'&&!iRead(d)?' '+badge('Non lu','warn'):'')+'<br><span class="note">'+e(d.category)+' · Version '+e(d.version)+(d.owner?' · '+e(d.owner):'')+(d.approvedAt?' · Approuvé le '+fd(d.approvedAt):'')+'</span></div>'}).join('')||'<p class="note">Aucun document.</p>';
  const fl=[['','Tous'],['En vigueur','En vigueur'],['draft','Brouillons'],['Obsolète','Obsolètes'],['late','Révision en retard'],['unread','Non lus']].map(x=>'<button type="button" class="mt-pest-chip'+(fSt===x[0]?' active':'')+'" onclick="mtDocs.filter(\''+x[0]+'\')">'+x[1]+'</button>').join('');
  return '<div class="panel"><div class="mt-pest-headrow"><h2>Bibliothèque</h2>'+(mg?'<button class="btn primary" onclick="mtDocs.newDoc()">+ Nouveau document</button>':'')+'</div><div class="row"><div><input id="doc-q" placeholder="Rechercher (titre, code, responsable)" value="'+e(q)+'" oninput="mtDocs.search(this.value)"></div><div><select onchange="mtDocs.cat(this.value)">'+opt(CATS,fCat,'Toutes les catégories')+'</select></div></div><div class="mt-pest-chips">'+fl+'</div>'+rows+'</div>';
}
function newDoc(pre){
  if(!canManage()){alert('Action réservée aux responsables.');return}
  window.__docDraft=Object.assign({id:'',code:nextCode(),title:'',category:CATS[1],version:'1.0',status:'Brouillon',owner:who(),link:'',location:'',keywords:'',description:'',issued:today(),reviewMonths:12,nextReview:addMonths(today(),12),history:[],readBy:[]},pre||{});
  cur='new';view='form';render();window.scrollTo(0,0);
}
function openDoc(id){const d=D().items.find(x=>x.id===id);if(!d)return;window.__docDraft=JSON.parse(JSON.stringify(d));cur=id;view='form';render();window.scrollTo(0,0)}
function vForm(){
  const d=window.__docDraft||{},isNew=cur==='new',mg=canManage(),dis=mg?'':' disabled';
  const hist=(d.history||[]).slice().reverse().map(h=>'<div class="record"><b>'+fd(h.at)+'</b> — '+e(h.by||'')+'<br><span class="note">'+e(h.action)+(h.version?' (v'+e(h.version)+')':'')+(h.note?' : '+e(h.note):'')+'</span></div>').join('');
  const readers=readOf(d);
  const link=d.link?'<p><a href="'+e(d.link)+'" target="_blank" rel="noopener noreferrer" class="btn primary" style="display:inline-block;text-decoration:none">Ouvrir le document</a></p>':'<p class="note">Aucun lien de document renseigné.</p>';
  const readBox=(!isNew&&d.status==='En vigueur')?'<div class="panel" style="background:#f5f9f6"><h3>Lecture et prise de connaissance</h3>'+(iRead(d)?badge('Vous avez lu la version '+d.version,'ok'):'<button class="btn primary" onclick="mtDocs.markRead(\''+d.id+'\')">J’ai lu la version '+e(d.version)+'</button>')+'<p class="note">'+readers.length+' lecteur(s) pour cette version'+(mg&&readers.length?' : '+readers.map(r=>e(r.name)).join(', '):'')+'.</p></div>':'';
  const ed='<label>Titre</label><input id="doc-title" value="'+e(d.title)+'"'+dis+'><div class="row"><div><label>Code</label><input id="doc-code" value="'+e(d.code)+'"'+dis+'></div><div><label>Catégorie</label><select id="doc-cat"'+dis+'>'+opt(CATS,d.category)+'</select></div></div>'
   +'<div class="row"><div><label>Version</label><input id="doc-ver" value="'+e(d.version)+'" disabled></div><div><label>Statut</label><select id="doc-status"'+dis+'>'+opt(STATUS,d.status)+'</select></div><div><label>Responsable du document</label><input id="doc-owner" value="'+e(d.owner||'')+'"'+dis+'></div></div>'
   +'<div class="row"><div><label>Date d’émission</label><input id="doc-issued" type="date" value="'+e(d.issued||'')+'"'+dis+'></div><div><label>Révision tous les (mois)</label><input id="doc-months" type="number" min="1" max="60" value="'+e(d.reviewMonths||12)+'"'+dis+'></div><div><label>Prochaine révision</label><input id="doc-next" type="date" value="'+e(d.nextReview||'')+'"'+dis+'></div></div>'
   +'<label>Lien vers le fichier (Drive, OneDrive, site…)</label><input id="doc-link" placeholder="https://" value="'+e(d.link||'')+'"'+dis+'><label>Emplacement de l’exemplaire papier</label><input id="doc-loc" value="'+e(d.location||'')+'" placeholder="Ex. classeur HACCP, bureau du chef"'+dis+'><label>Mots-clés</label><input id="doc-kw" value="'+e(d.keywords||'')+'"'+dis+'><label>Objet et périmètre</label><textarea id="doc-desc" rows="3"'+dis+'>'+e(d.description||'')+'</textarea>';
  const acts=mg?'<div class="mt-pest-actions"><button class="btn primary" onclick="mtDocs.save()">Enregistrer</button>'+(!isNew?'<button class="btn" onclick="mtDocs.approve()">Approuver et mettre en vigueur</button><button class="btn" onclick="mtDocs.newVersion()">Nouvelle version</button><button class="btn danger" onclick="mtDocs.remove()">Supprimer</button>':'')+'</div>':'';
  return '<div class="panel"><button class="btn back" onclick="mtDocs.go(\'library\')">← Bibliothèque</button><h2>'+(isNew?'Nouveau document':e(d.code)+' · '+e(d.title))+'</h2>'+(!isNew?link:'')+(!isNew&&d.approvedAt?'<p class="note">Approuvé par '+e(d.approvedBy||'—')+' le '+fd(d.approvedAt)+'</p>':'')+ed+acts+'</div>'+readBox+(hist?'<div class="panel"><h3>Historique des versions et modifications</h3>'+hist+'</div>':'');
}
function readForm(){
  const d=window.__docDraft;
  return Object.assign(d,{title:v('doc-title'),code:v('doc-code'),category:v('doc-cat'),status:v('doc-status'),owner:v('doc-owner'),issued:v('doc-issued'),reviewMonths:Number(v('doc-months'))||12,nextReview:v('doc-next'),link:v('doc-link'),location:v('doc-loc'),keywords:v('doc-kw'),description:v('doc-desc')});
}
function valid(d){
  if(!d.title){alert('Indiquez le titre du document.');return false}
  if(!d.code){alert('Indiquez le code du document.');return false}
  if(D().items.some(x=>x.id!==d.id&&x.code.toLowerCase()===d.code.toLowerCase())){alert('Ce code existe déjà.');return false}
  if(d.link&&!/^https?:\/\//i.test(d.link)){alert('Le lien doit commencer par http:// ou https://');return false}
  if(d.status==='En vigueur'&&!d.nextReview){alert('Indiquez la date de prochaine révision.');return false}
  return true;
}
function saveDoc(){
  if(!canManage())return;
  const d=readForm();if(!valid(d))return;
  const by=who();
  if(cur==='new'){d.id=uid();d.history=[{at:new Date().toISOString(),by,action:'Création du document',version:d.version}];if(d.status==='En vigueur'){d.approvedBy=by;d.approvedAt=today()}D().items.push(d);trace('Document créé : '+d.code+' '+d.title,'',by,d.category)}
  else{const o=D().items.find(x=>x.id===cur);if(!o)return;const oldS=o.status;Object.assign(o,d);o.history=(o.history||[]).concat([{at:new Date().toISOString(),by,action:'Modification'+(oldS!==d.status?' · statut '+oldS+' → '+d.status:''),version:o.version}]);if(oldS!==d.status&&d.status==='En vigueur'&&!o.approvedAt){o.approvedBy=by;o.approvedAt=today()}}
  save();view='library';cur='';render();
}
function approve(){
  if(!canManage())return;
  const d=readForm();if(!valid(d))return;
  const o=D().items.find(x=>x.id===cur);if(!o)return;
  if(!confirm('Approuver la version '+d.version+' et la mettre en vigueur ?'))return;
  const by=who();Object.assign(o,d,{status:'En vigueur',approvedBy:by,approvedAt:today()});
  if(!o.nextReview)o.nextReview=addMonths(today(),o.reviewMonths||12);
  o.history=(o.history||[]).concat([{at:new Date().toISOString(),by,action:'Approbation et mise en vigueur',version:o.version}]);
  trace('Document en vigueur : '+o.code+' v'+o.version,'Approuvé',by,o.title);
  save();view='library';cur='';render();
}
function newVersion(){
  if(!canManage())return;
  const o=D().items.find(x=>x.id===cur);if(!o)return;
  const note=prompt('Nature de la modification (obligatoire) :');if(!note||!note.trim())return;
  const parts=String(o.version).split('.'),major=Number(parts[0])||1;
  const nv=prompt('Numéro de la nouvelle version :',(major+1)+'.0');if(!nv||!nv.trim())return;
  const by=who();
  o.history=(o.history||[]).concat([{at:new Date().toISOString(),by,action:'Nouvelle version (ancienne : v'+o.version+')',version:nv.trim(),note:note.trim()}]);
  o.version=nv.trim();o.status='Brouillon';delete o.approvedAt;delete o.approvedBy;
  trace('Nouvelle version : '+o.code+' v'+o.version,'Brouillon',by,note.trim());
  save();openDoc(o.id);
}
function remove(){
  if(!canManage())return;
  const o=D().items.find(x=>x.id===cur);if(!o)return;
  if(!confirm('Supprimer définitivement « '+o.title+' » ? Pour conserver l’historique, préférez le statut Obsolète.'))return;
  D().items=D().items.filter(x=>x.id!==cur);trace('Document supprimé : '+o.code+' '+o.title,'',who(),'');
  save();view='library';cur='';render();
}
function markRead(id){
  const o=D().items.find(x=>x.id===id);if(!o||iRead(o))return;
  const p=prof();o.readBy=(o.readBy||[]).concat([{uid:p.uid||'',name:who()||'Utilisateur',version:o.version,at:new Date().toISOString()}]);
  save();openDoc(id);
}
function addStd(i){
  const x=STD[i];if(!x||!canManage())return;
  const d=Object.assign({id:uid(),code:nextCode(),title:x[0],category:x[1],version:'1.0',status:'Brouillon',owner:who(),link:'',location:'',keywords:'',description:'',issued:today(),reviewMonths:12,nextReview:addMonths(today(),12),readBy:[]},{history:[{at:new Date().toISOString(),by:who(),action:'Création depuis la liste des documents types',version:'1.0'}]});
  D().items.push(d);save();render();
}
function addAllStd(){
  if(!canManage())return;
  const have=n=>D().items.some(d=>d.status!=='Obsolète'&&String(d.title).toLowerCase()===n.toLowerCase());
  const miss=STD.filter(x=>!have(x[0]));if(!miss.length)return;
  if(!confirm('Créer '+miss.length+' documents (statut Brouillon) à compléter ?'))return;
  miss.forEach(x=>{D().items.push({id:uid(),code:nextCode(),title:x[0],category:x[1],version:'1.0',status:'Brouillon',owner:who(),link:'',location:'',keywords:'',description:'',issued:today(),reviewMonths:12,nextReview:addMonths(today(),12),readBy:[],history:[{at:new Date().toISOString(),by:who(),action:'Création depuis la liste des documents types',version:'1.0'}]})});
  trace('Documents types HACCP créés : '+miss.length,'',who(),'');
  save();render();
}
function printList(){
  const site=(typeof siteDisplayName!=='undefined'&&siteDisplayName)||(typeof SITE_ID!=='undefined'?SITE_ID:'');
  const w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres contextuelles pour imprimer.');return}
  const rows=D().items.slice().sort((a,b)=>a.code.localeCompare(b.code)).map(d=>'<tr><td>'+e(d.code)+'</td><td>'+e(d.title)+'</td><td>'+e(d.category)+'</td><td>'+e(d.version)+'</td><td>'+e(d.status)+'</td><td>'+fd(d.approvedAt)+'</td><td>'+fd(d.nextReview)+'</td><td>'+e(d.owner||'')+'</td><td>'+e(d.location||'')+'</td></tr>').join('');
  w.document.open();
  w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Liste maîtresse des documents</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:24px;color:#17251f}h1{color:#0d4a36;font-size:22px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #b8c7bf;padding:5px 7px;text-align:left}th{background:#e8f1ec}.sign{display:flex;gap:30px;margin-top:40px}.sign div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:12px}@media print{.bar{display:none}}</style></head><body><div class="bar"><button onclick="window.print()">Imprimer ou enregistrer en PDF</button></div><h1>Liste maîtresse des documents HACCP</h1><p>Établissement : '+e(site)+' · Édité le '+new Date().toLocaleDateString('fr-FR')+'</p><table><tr><th>Code</th><th>Titre</th><th>Catégorie</th><th>Version</th><th>Statut</th><th>Approuvé le</th><th>Révision</th><th>Responsable</th><th>Exemplaire papier</th></tr>'+rows+'</table><div class="sign"><div>Établi par</div><div>Approuvé par</div><div>Date et signature</div></div></body></html>');
  w.document.close();
}
window.mtDocs={go:go,open:openDoc,newDoc:function(){newDoc()},save:saveDoc,approve:approve,newVersion:newVersion,remove:remove,markRead:markRead,addStd:addStd,addAllStd:addAllStd,printList:printList,
  filter:function(k){fSt=k;fCat='';q='';view='library';render()},cat:function(c){fCat=c;render()},search:function(s){q=s;render();const i=$('doc-q');if(i){i.focus();i.setSelectionRange(s.length,s.length)}}};
window.mtDocsOpen=open;
})();

</script>
<script id="mt-train-module">
/* Module : Formation du personnel
   Données : S.train = { staff[], catalog[], sessions[] } — enregistrées avec save().
   Fiches personnel avec ou sans compte, catalogue (recyclage), sessions (prévues / réalisées), habilitations, matrice, registre imprimable. */
(function(){
'use strict';
const POSTES=['Chef de cuisine','Second de cuisine','Chef de partie','Cuisinier','Commis','Pâtissier','Plongeur','Économat / magasinier','Serveur','Responsable qualité','Direction','Autre'];
const REQ=['Tout le personnel','Postes concernés','Facultative'];
const CATS=['Hygiène et HACCP','Allergènes','Sécurité','Technique','Autre'];
const STD=[
 ['Hygiène alimentaire et bonnes pratiques','Hygiène et HACCP',12,'Tout le personnel',''],
 ['Principes HACCP','Hygiène et HACCP',24,'Postes concernés','chef,second,responsable,qualité,direction'],
 ['Gestion des allergènes','Allergènes',12,'Tout le personnel',''],
 ['Nettoyage et désinfection','Hygiène et HACCP',12,'Tout le personnel',''],
 ['Maîtrise des températures et chaîne du froid','Hygiène et HACCP',12,'Postes concernés','cuisin,commis,chef,pâtiss,économat,magasin'],
 ['Sécurité incendie','Sécurité',12,'Tout le personnel',''],
 ['Premiers secours','Sécurité',24,'Facultative',''],
 ['Gestes et postures','Sécurité',24,'Facultative',''],
 ['Utilisation sécurisée des machines (trancheur, robot)','Technique',24,'Facultative','']
];
const TABS=[['overview','Vue d’ensemble'],['staff','Personnel'],['matrix','Matrice'],['sessions','Sessions'],['catalog','Catalogue']];
let view='overview',cur='',q='',fSt='',fSess='';
function $(id){return document.getElementById(id)}
function v(id){const x=$(id);return x?String(x.value||'').trim():''}
function e(x){return typeof esc==='function'?esc(x):String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function T(){if(!S.train||typeof S.train!=='object')S.train={};['staff','catalog','sessions'].forEach(k=>{if(!Array.isArray(S.train[k]))S.train[k]=[]});return S.train}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function addMonths(iso,n){const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function fd(s){if(!s)return '—';const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)?s+'T12:00:00':s);return isNaN(d)?e(s):d.toLocaleDateString('fr-FR')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function prof(){return (typeof currentUserProfile!=='undefined'&&currentUserProfile)||{}}
function who(){const p=prof();const n=p.displayName||p.name||p.username||p.email||'';return n.includes('@')?n.split('@')[0]:n}
function canManage(){return ['admin','responsable','haccp'].includes(prof().role)}
function trace(summary,status,operator,note){if(!Array.isArray(S.trace))S.trace=[];S.trace.unshift({type:'Formation',product:summary,date:new Date().toLocaleString('fr-FR'),status:status||'',operator:operator||'',note:note||''})}
function opt(list,sel,ph){return (ph?'<option value="">'+e(ph)+'</option>':'')+list.map(x=>'<option'+(x===sel?' selected':'')+'>'+e(x)+'</option>').join('')}
function badge(t,c){return '<span class="mt-pest-badge '+c+'">'+e(t)+'</span>'}
function compress(file,maxW,qual,done){
  if(!file)return;const r=new FileReader();
  r.onload=function(){const im=new Image();im.onload=function(){const s=Math.min(1,maxW/im.width,maxW/im.height),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(im,0,0,w,h);done(cv.toDataURL('image/webp',qual))};im.src=r.result};
  r.readAsDataURL(file);
}
function roomFor(url){try{return JSON.stringify(S).length+String(url).length<900000}catch(_){return true}}
function noRoom(){alert('Espace de stockage de l’établissement presque plein : cette image n’a pas été ajoutée. Utilisez une image plus petite ou supprimez d’anciennes photos.')}

/* Calculs de validité */
function activeStaff(){return T().staff.filter(s=>s.active!==false)}
function myStaff(){const p=prof();return T().staff.filter(s=>p.uid&&s.uid===p.uid)}
function scopeStaff(){return canManage()?T().staff:myStaff()}
function trainOf(id){return T().catalog.find(t=>t.id===id)}
function staffOf(id){return T().staff.find(s=>s.id===id)}
function lastOk(s,t){
  let best=null;
  T().sessions.forEach(x=>{
    if(x.trainingId!==t.id||x.status!=='Réalisée')return;
    const p=(x.participants||[]).find(p=>p.staffId===s.id&&p.result!=='Non acquis');
    if(p&&(!best||x.date>best))best=x.date;
  });
  return best;
}
function applies(s,t){
  if(t.required==='Tout le personnel')return true;
  if(t.required==='Postes concernés'){

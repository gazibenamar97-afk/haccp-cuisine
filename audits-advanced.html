<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&T HACCP — Audits interactifs</title>
<style>
:root{--green:#087657;--dark:#153c31;--line:#d8e6de;--muted:#687c72;--bg:#f3f7f5;--red:#b3293b;--amber:#b77909}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--dark)}header{background:linear-gradient(110deg,#063f30,#087657);color:#fff;padding:25px max(18px,calc((100% - 1120px)/2))}header h1{margin:0 0 6px;font-size:27px}header p{margin:0;color:#d6f1e6}main{max-width:1120px;margin:auto;padding:20px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 18px #163b3010}.layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.stat strong{display:block;font-size:29px;margin-top:7px}.stat small,.muted{color:var(--muted)}label{display:block;font-weight:600;margin:10px 0 5px}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #c5d7cc;border-radius:9px;background:#fff}textarea{min-height:70px;resize:vertical}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;color:var(--dark)}button.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:bold}button:hover{filter:brightness(.97)}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.section{margin:20px 0}.section h2{font-size:18px}.question{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}.question.bad{border-left:5px solid var(--red)}.question.good{border-left:5px solid var(--green)}.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.qtop b{line-height:1.4}.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.choice button{flex:1;min-width:90px}.choice .selected[data-val=ok]{background:#e2f5e9;border-color:var(--green);color:#075638;font-weight:bold}.choice .selected[data-val=nc]{background:#fff0f1;border-color:var(--red);color:var(--red);font-weight:bold}.choice .selected[data-val=na]{background:#edf0f2;border-color:#64748b;font-weight:bold}.notearea{margin-top:12px}.side{position:sticky;top:15px}.bar{height:10px;border-radius:10px;background:#e7efeb;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:var(--green);transition:width .3s}.circle{width:142px;height:142px;border-radius:50%;margin:16px auto;display:grid;place-items:center;background:conic-gradient(var(--green) 0%,#e5efe9 0%)}.circle>div{width:114px;height:114px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center}.circle strong{font-size:31px}.cat{margin:12px 0;font-size:13px}.cat .bar{height:7px}.alert{background:#fff3f2;color:#8f2735;border:1px solid #f2ccd0;border-radius:10px;padding:11px;margin:8px 0;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.report{white-space:pre-wrap;font:13px/1.6 Arial,sans-serif;margin-top:15px;background:#f7faf8;border-radius:10px;padding:15px}.pill{font-size:12px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);margin-top:14px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;grid-row:1}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}header{padding:20px}main{padding:12px}}@media print{header,.actions,.choice,.notice,#auditHistory{display:none!important}body{background:#fff}.layout{display:block}.card,.question{box-shadow:none;break-inside:avoid}.side{position:static}.notearea textarea{border:0}main{max-width:none}}
</style></head><body><header><h1>✓ Audits HACCP</h1><p>Contrôles interactifs · Résultats en temps réel · Rapport d'audit</p></header>
<main><div class="card formgrid"><div><label for="site">Établissement</label><input id="site" value="Établissement de démonstration"></div><div><label for="auditor">Auditeur</label><input id="auditor" placeholder="Nom de l'auditeur"></div><div><label for="date">Date de l'audit</label><input id="date" type="date"></div></div>
<div class="stats"><div class="stat"><small>Progression</small><strong id="progress">0/10</strong></div><div class="stat"><small>Conformité</small><strong id="score">—</strong></div><div class="stat"><small>Non-conformités</small><strong id="nc">0</strong></div><div class="stat"><small>Statut</small><strong id="status" style="font-size:19px">À commencer</strong></div></div>
<div class="layout"><div id="questions"></div><aside class="card side"><h2 style="margin-top:0">Suivi de l'audit</h2><div class="circle" id="circle"><div><span><strong id="ringScore">—</strong><br><small>conformité</small></span></div></div><div class="muted" id="completed">0 question renseignée</div><div class="bar"><span id="progressBar" style="width:0%"></span></div><h3>Par catégorie</h3><div id="categories"></div><h3>Points à corriger</h3><div id="alerts" class="muted">Aucune non-conformité signalée.</div><div class="actions"><button class="primary" id="saveAudit">Enregistrer dans Firebase</button><button id="historyButton">Historique des audits</button><button class="primary" id="generate">Générer le rapport</button><button id="print">Imprimer / PDF</button><button id="reset">Réinitialiser</button></div><div id="report" class="report" hidden></div><div id="saveStatus" class="notice" role="status">Connexion à l’établissement…</div><div id="auditHistory" class="report" hidden></div></aside></div></main>
<script>
'use strict';
const items=[['Hygiène du personnel','Tenue professionnelle propre et adaptée'],['Hygiène du personnel','Lavage des mains et dispositifs disponibles'],['Températures et stockage','Températures des enceintes frigorifiques conformes'],['Températures et stockage','Séparation des produits crus et cuits'],['Nettoyage et désinfection','Plan de nettoyage respecté'],['Nettoyage et désinfection','Produits de nettoyage identifiés et stockés séparément'],['Traçabilité et DLC','Produits correctement étiquetés et datés'],['Traçabilité et DLC','DLC vérifiées et absence de produits périmés'],['Locaux et nuisibles','Locaux et surfaces en bon état'],['Locaux et nuisibles',"Absence d'indices de nuisibles"]];
const answers=items.map(()=>({value:'',note:''}));let bridgeSite='',bridgeLabel='',bridgeReady=false,requestSerial=0;const pending=new Map();const $=id=>document.getElementById(id);$('date').value=new Date().toLocaleDateString('en-CA');const qs=$('questions');let section='';
items.forEach(([cat,q],i)=>{if(cat!==section){section=cat;const h=document.createElement('h2');h.textContent=cat;h.className='section';qs.append(h)}const box=document.createElement('div');box.className='question';box.id='question'+i;const top=document.createElement('div');top.className='qtop';const name=document.createElement('b');name.textContent=(i+1)+'. '+q;const state=document.createElement('span');state.className='pill';state.id='state'+i;state.textContent='À vérifier';top.append(name,state);const choices=document.createElement('div');choices.className='choice';[['ok','✓ Conforme'],['nc','✕ Non conforme'],['na','— N/A']].forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.dataset.val=v;b.textContent=label;b.addEventListener('click',()=>{answers[i].value=v;update()});choices.append(b)});const lab=document.createElement('label');lab.className='notearea';lab.textContent='Observation / action corrective';const ta=document.createElement('textarea');ta.placeholder='Ajouter une observation…';ta.addEventListener('input',()=>{answers[i].note=ta.value;});lab.append(ta);box.append(top,choices,lab);qs.append(box)});
function update(){let done=0,ok=0,nc=0;const by={};items.forEach(([cat,q],i)=>{const a=answers[i];by[cat]??={ok:0,nc:0,done:0};if(a.value){done++;by[cat].done++}if(a.value==='ok'){ok++;by[cat].ok++}if(a.value==='nc'){nc++;by[cat].nc++}const box=$('question'+i);box.classList.toggle('bad',a.value==='nc');box.classList.toggle('good',a.value==='ok');$('state'+i).textContent=a.value==='ok'?'Conforme':a.value==='nc'?'Non conforme':a.value==='na'?'Non applicable':'À vérifier';box.querySelectorAll('.choice button').forEach(b=>b.classList.toggle('selected',b.dataset.val===a.value))});const score=ok+nc?Math.round(ok/(ok+nc)*100):null;$('progress').textContent=done+'/'+items.length;$('score').textContent=score===null?'—':score+'%';$('ringScore').textContent=$('score').textContent;$('nc').textContent=nc;$('status').textContent=done===0?'À commencer':done<items.length?'En cours':nc?'À corriger':'Terminé';$('completed').textContent=done+' question'+(done>1?'s':'')+' renseignée'+(done>1?'s':'');$('progressBar').style.width=100*done/items.length+'%';$('circle').style.background='conic-gradient('+(nc?'#b77909':'#087657')+' '+(score??0)+'%,#e5efe9 0%)';$('categories').replaceChildren();Object.entries(by).forEach(([cat,v])=>{const el=document.createElement('div');el.className='cat';const title=document.createElement('div');title.textContent=cat+' · '+v.done+'/2';const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('span');fill.style.width=(v.ok+v.nc?100*v.ok/(v.ok+v.nc):0)+'%';fill.style.background=v.nc?'#b77909':'#087657';bar.append(fill);el.append(title,bar);$('categories').append(el)});$('alerts').replaceChildren();if(!nc){$('alerts').textContent='Aucune non-conformité signalée.'}else items.forEach(([cat,q],i)=>{if(answers[i].value!=='nc')return;const d=document.createElement('div');d.className='alert';d.textContent=q+(answers[i].note?' — '+answers[i].note:' — Action corrective à définir');$('alerts').append(d)});return{done,ok,nc,score}}
$('generate').onclick=()=>{const r=update();const lines=['RAPPORT D’AUDIT HACCP','Établissement : '+$('site').value,'Auditeur : '+($('auditor').value||'Non renseigné'),'Date : '+$('date').value,'Progression : '+r.done+'/'+items.length,'Conformité : '+(r.score===null?'Non calculable':r.score+'%'),'Non-conformités : '+r.nc,''];items.forEach(([cat,q],i)=>{const a=answers[i];lines.push(cat+' — '+q,'Résultat : '+({ok:'Conforme',nc:'Non conforme',na:'Non applicable'}[a.value]||'Non renseigné'),'Observation : '+(a.note||'Aucune'),'')});$('report').hidden=false;$('report').textContent=lines.join('\n');$('report').scrollIntoView({behavior:'smooth',block:'nearest'})};$('print').onclick=()=>{$('generate').click();window.print()};$('reset').onclick=()=>{if(!confirm('Effacer les réponses de cette démonstration ?'))return;answers.forEach(a=>{a.value='';a.note=''});document.querySelectorAll('textarea').forEach(x=>x.value='');$('report').hidden=true;update()};update();

function bridge(type,payload={}){
 if(window.parent===window){return Promise.reject(Error('Ouvrez ce module depuis M&T HACCP.'))}
 const id='audit-'+(++requestSerial)+'-'+Date.now();
 return new Promise((resolve,reject)=>{
  const timeout=setTimeout(()=>{pending.delete(id);reject(Error('Aucune réponse de l’application.'))},15000);
  pending.set(id,{resolve,reject,timeout});
  window.parent.postMessage({mtAudit:true,id,type,payload},location.origin);
 });
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.parent)return;
 const d=event.data||{};if(!d.mtAuditResponse)return;
 const p=pending.get(d.id);if(!p)return;
 clearTimeout(p.timeout);pending.delete(d.id);
 if(d.error)p.reject(Error(d.error));else p.resolve(d.result);
});
function safeText(id,t){$(id).textContent=t}
function verifyBridge(){
 bridge('context').then(ctx=>{
  bridgeReady=true;bridgeSite=ctx.site;bridgeLabel=ctx.name||ctx.site;
  $('site').value=bridgeLabel;$('site').readOnly=true;
  if(ctx.auditor)$('auditor').value=ctx.auditor;
  safeText('saveStatus','Firebase connecté · '+bridgeLabel+' · Sauvegarde uniquement après clic sur Enregistrer.');
 }).catch(e=>safeText('saveStatus','Connexion indisponible : '+e.message));
}
function payloadAudit(){
 const r=update();
 if(r.done!==items.length)throw Error('Répondez aux '+items.length+' questions avant d’enregistrer.');
 if(!$('auditor').value.trim())throw Error('Renseignez le nom de l’auditeur.');
 if(!$('date').value)throw Error('Renseignez la date de l’audit.');
 return {date:$('date').value,auditor:$('auditor').value.trim(),site:bridgeSite,
  entries:items.map(([cat,q],i)=>({category:cat,question:q,result:answers[i].value,note:answers[i].note})),
  progress:r.done,score:r.score,nonConformities:r.nc,status:r.nc?'À corriger':'Terminé'};
}
$('saveAudit').onclick=async()=>{
 if(!bridgeReady){safeText('saveStatus','Impossible d’enregistrer : Firebase non connecté.');return}
 const button=$('saveAudit');button.disabled=true;
 try{const data=payloadAudit();const result=await bridge('save',data);
 safeText('saveStatus','Audit enregistré dans Firebase le '+new Date(result.savedAt).toLocaleString('fr-FR')+' · ID : '+result.id);
 }catch(e){safeText('saveStatus','Enregistrement refusé : '+e.message)}
 finally{button.disabled=false}
};
$('historyButton').onclick=async()=>{
 const h=$('auditHistory');h.hidden=false;h.replaceChildren();
 const msg=document.createElement('div');msg.textContent='Chargement de l’historique…';h.append(msg);
 try{const records=await bridge('list');h.replaceChildren();
 if(!records.length){h.textContent='Aucun audit enregistré pour cet établissement.';return}
 const title=document.createElement('h3');title.textContent='Historique de '+bridgeLabel;h.append(title);
 records.forEach(rec=>{
  const div=document.createElement('div');div.style.cssText='border-bottom:1px solid #d8e6de;padding:12px 0';
  const summary=document.createElement('div');
  summary.textContent=(rec.date||'Sans date')+' · '+(rec.auditor||'Auditeur inconnu')+' · '+(rec.score??'—')+' % · '+(rec.nonConformities||0)+' non-conformité(s)';
  const open=document.createElement('button');open.textContent='Consulter / Imprimer';
  open.onclick=()=>{
   if(!Array.isArray(rec.entries)||rec.entries.length!==items.length){alert('Format du rapport incompatible.');return}
   rec.entries.forEach((e,i)=>{answers[i].value=e.result||'';answers[i].note=e.note||'';$('question'+i).querySelector('textarea').value=answers[i].note});
   $('auditor').value=rec.auditor||'';$('date').value=rec.date||'';update();$('generate').click();
   window.scrollTo({top:0,behavior:'smooth'});
   safeText('saveStatus','Audit historique chargé. Imprimer / PDF pour exporter ; aucune modification enregistrée.');
  };
  div.append(summary,open);h.append(div);
 });
 }catch(e){h.textContent='Historique indisponible : '+e.message}
};
verifyBridge();

</script></body></html>
